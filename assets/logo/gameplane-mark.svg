<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Background Space Radial Gradient -->
    <radialGradient id="midSpaceGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1C1A20" />
      <stop offset="55%" stop-color="#17151A" />
      <stop offset="100%" stop-color="#121114" />
    </radialGradient>

    <!-- Aircraft Fuselage Spine -->
    <linearGradient id="midFuselage" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#EDE9F0" />
      <stop offset="100%" stop-color="#2C2932" />
    </linearGradient>

    <!-- Wing Gradients: Port Accent Magenta & Starboard Violet -->
    <linearGradient id="midWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232128" />
      <stop offset="45%" stop-color="#331525" />
      <stop offset="100%" stop-color="#FF4FA3" />
    </linearGradient>

    <linearGradient id="midWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232128" />
      <stop offset="45%" stop-color="#251833" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Tricolor Thruster Flames: Blue, White, Red -->
    <linearGradient id="midBlueFlame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="midWhiteFlame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#EDE9F0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="midRedFlame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </linearGradient>

    <!-- Balanced Glow Filter -->
    <filter id="midGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Tile -->
  <rect width="400" height="320" rx="16" fill="url(#midSpaceGlow)" stroke="#2C2932" stroke-width="1.2" />

  <!-- Simplified Tactical Backdrop Mesh -->
  <g opacity="0.16" stroke="#9E98A6" stroke-width="1">
    <circle cx="200" cy="130" r="95" fill="none" stroke-dasharray="4 6" />
    <circle cx="200" cy="130" r="62" fill="none" stroke-dasharray="2 4" />
    <line x1="65" y1="130" x2="335" y2="130" />
    <line x1="200" y1="35" x2="200" y2="225" />
  </g>

  <!-- ==================================================== -->
  <!-- AIRCRAFT BODY & THRUSTERS                            -->
  <!-- ==================================================== -->
  <g id="aircraft-mid">
    <!-- Tricolor Thruster Plumes -->
    <polygon points="188,200 191,248 195,200" fill="url(#midBlueFlame)" filter="url(#midGlow)" opacity="0.95" />
    <polygon points="205,200 209,248 212,200" fill="url(#midRedFlame)" filter="url(#midGlow)" opacity="0.95" />
    <polygon points="196,204 200,260 204,204" fill="url(#midWhiteFlame)" filter="url(#midGlow)" opacity="0.95" />

    <!-- Left Wing (Accent Magenta) -->
    <polygon points="200,35 105,160 135,195 172,182 192,200 200,190" fill="url(#midWingLeft)" stroke="#FF4FA3" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Right Wing (Sleep Violet) -->
    <polygon points="200,35 295,160 265,195 228,182 208,200 200,190" fill="url(#midWingRight)" stroke="#A78BFA" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Stealth Inner Facets -->
    <polygon points="200,35 165,135 200,188" fill="#232128" opacity="0.85" />
    <polygon points="200,35 235,135 200,188" fill="#2C2932" opacity="0.85" />

    <!-- Fuselage Spine Line -->
    <line x1="200" y1="35" x2="200" y2="190" stroke="url(#midFuselage)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Central Cockpit Reticle -->
    <g transform="translate(200, 110)">
      <polygon points="0,-26 9,6 0,13 -9,6" fill="#331525" stroke="#FF4FA3" stroke-width="1.5" filter="url(#midGlow)" />
      <circle cx="0" cy="-6" r="6" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 2" />
      <polygon points="0,-11 4,-3 0,4 -4,-3" fill="#ffffff" filter="url(#midGlow)" />
      <line x1="-7" y1="-6" x2="7" y2="-6" stroke="#ffffff" stroke-width="1.2" />
      <line x1="0" y1="-13" x2="0" y2="1" stroke="#ffffff" stroke-width="1.2" />
    </g>

    <!-- ==================================================== -->
    <!-- FORWARD-FACING DIRECT WINGTIP PODS                   -->
    <!-- ==================================================== -->
    <!-- Port Pod (UDP-01) -->
    <g id="port-pod-mid">
      <!-- Flush Mount Collar -->
      <polygon points="105,148 109,155 109,170 105,176" fill="#331525" stroke="#FF4FA3" stroke-width="1" />
      <!-- Forward-Facing Body -->
      <polygon points="103,126 108,138 108,185 105,196 101,196 98,185 98,138" fill="#17151A" stroke="#FF4FA3" stroke-width="1.3" stroke-linejoin="round" />
      <line x1="100" y1="152" x2="106" y2="152" stroke="#2C2932" stroke-width="1.2" />
      <line x1="100" y1="160" x2="106" y2="160" stroke="#2C2932" stroke-width="1.2" />
      <line x1="100" y1="168" x2="106" y2="168" stroke="#2C2932" stroke-width="1.2" />
      <!-- Seeker Nose & Beacon -->
      <polygon points="103,126 106,134 103,131 100,134" fill="#FF4FA3" filter="url(#midGlow)" />
      <circle cx="96" cy="160" r="2.8" fill="#FF4FA3" filter="url(#midGlow)" />
      <!-- HUD Callout -->
      <text x="103" y="116" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" fill="#FF8AC4" letter-spacing="0.5" text-anchor="middle">UDP-01</text>
    </g>

    <!-- Starboard Pod (UDP-02) -->
    <g id="starboard-pod-mid">
      <!-- Flush Mount Collar -->
      <polygon points="295,148 291,155 291,170 295,176" fill="#251833" stroke="#A78BFA" stroke-width="1" />
      <!-- Forward-Facing Body -->
      <polygon points="297,126 302,138 302,185 299,196 295,196 292,185 292,138" fill="#17151A" stroke="#A78BFA" stroke-width="1.3" stroke-linejoin="round" />
      <line x1="294" y1="152" x2="300" y2="152" stroke="#2C2932" stroke-width="1.2" />
      <line x1="294" y1="160" x2="300" y2="160" stroke="#2C2932" stroke-width="1.2" />
      <line x1="294" y1="168" x2="300" y2="168" stroke="#2C2932" stroke-width="1.2" />
      <!-- Seeker Nose & Beacon -->
      <polygon points="297,126 300,134 297,131 294,134" fill="#A78BFA" filter="url(#midGlow)" />
      <circle cx="304" cy="160" r="2.8" fill="#A78BFA" filter="url(#midGlow)" />
      <!-- HUD Callout -->
      <text x="297" y="116" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" fill="#A78BFA" letter-spacing="0.5" text-anchor="middle">UDP-02</text>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- BRANDING LOCKUP                                      -->
  <!-- ==================================================== -->
  <g transform="translate(200, 274)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="7" fill="#F5F3F7" text-anchor="middle">
      GAME<tspan fill="#FF4FA3">PLANE</tspan>
    </text>

    <g transform="translate(0, 9)">
      <line x1="-120" y1="0" x2="-18" y2="0" stroke="#FF4FA3" stroke-width="1.2" opacity="0.75" />
      <polygon points="0,-3 3,0 0,3 -3,0" fill="#ffffff" />
      <circle cx="0" cy="0" r="5" fill="none" stroke="#ffffff" stroke-width="0.8" />
      <line x1="18" y1="0" x2="120" y2="0" stroke="#A78BFA" stroke-width="1.2" opacity="0.75" />
    </g>

    <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="#EDE9F0" text-anchor="middle">
      KUBERNETES <tspan fill="#A78BFA">CONTROL PLANE</tspan>
    </text>
  </g>
</svg>
