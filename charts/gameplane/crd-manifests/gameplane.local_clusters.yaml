---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    gameplane.local/crd-bundle-sha256: d5069bc379d1aee86475b0f63c6c2866423a381b14b44cbf7a77dfd63e3c1c6a
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.gameplane.local
spec:
  group: gameplane.local
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    shortNames:
    - cls
    singular: cluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: DisplayName
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster represents a remote Kubernetes cluster managed by this
          Gameplane instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec describes a remote Kubernetes cluster.
            properties:
              agentGateway:
                description: |-
                  AgentGateway enables interactive agent operations in this cluster.
                  Kubernetes configuration and pod streams still use KubeconfigSecret.
                properties:
                  tlsSecretRef:
                    description: |-
                      TLSSecretRef names credentials in the central API namespace. The Secret
                      must carry gameplane.local/agent-gateway-credentials=true and contain
                      ca.crt, tls.crt and tls.key. Values are never returned by the API.
                    properties:
                      name:
                        description: Name is the Secret name in the central API namespace.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: URL is the HTTPS origin of the gateway, without a
                      path or query.
                    maxLength: 2048
                    pattern: ^https://[^/?#@]+/?$
                    type: string
                required:
                - tlsSecretRef
                - url
                type: object
              displayName:
                description: DisplayName is an optional human-readable name for the
                  cluster.
                type: string
              kubeconfigSecret:
                description: KubeconfigSecret references a Secret holding the kubeconfig.
                properties:
                  key:
                    default: kubeconfig
                    description: |-
                      Key is the Secret's data key where the kubeconfig lives.
                      Defaults to "kubeconfig".
                    type: string
                  name:
                    description: Name is the Secret's name.
                    type: string
                required:
                - name
                type: object
            required:
            - kubeconfigSecret
            type: object
          status:
            description: ClusterStatus reports the health and observed state of a
              remote cluster.
            properties:
              conditions:
                description: Conditions tracks the cluster's health and other observed
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastCheckTime:
                description: LastCheckTime is when the cluster's health was last assessed.
                format: date-time
                type: string
              message:
                description: Message provides details about the current phase.
                type: string
              observedGeneration:
                description: ObservedGeneration tracks the spec generation this status
                  represents.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase summarizes the cluster's health.
                    - Unknown: not yet checked
                    - Healthy: last check succeeded
                    - Unhealthy: last check failed
                enum:
                - Unknown
                - Healthy
                - Unhealthy
                type: string
              serverVersion:
                description: |-
                  ServerVersion is the Kubernetes server version of the remote cluster
                  (e.g., "v1.28.0"), set on successful health check.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
