    controller-gen.kubebuilder.io/version: v0.22.0
  name: backupexports.gameplane.local
spec:
  group: gameplane.local
  names:
    kind: BackupExport
    listKind: BackupExportList
    plural: backupexports
    shortNames:
    - bkx
    singular: backupexport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backupRef.name
      name: Backup
      type: string
    - jsonPath: .spec.format
      name: Format
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupExport is one download of a Backup as an archive.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackupExportSpec is the desired state of one download of a restic Backup
              as a .tar.gz or .zip archive (spec 041). The API creates it and deletes it
              when the transfer ends; the operator runs the export worker.
            properties:
              backupRef:
                description: BackupRef is the source Backup in the same namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              backupUID:
                description: |-
                  BackupUID pins the Backup identity; a Backup recreated under the same
                  name is refused.
                maxLength: 128
                minLength: 1
                type: string
              format:
                description: Format of the archive.
                enum:
                - tar.gz
                - zip
                type: string
              ttlSeconds:
                description: |-
                  TTLSeconds bounds the export's life. Defaults to the operator's
                  --backup-export-ttl when unset.
                format: int32
                maximum: 86400
                minimum: 60
                type: integer
            required:
            - backupRef
            - backupUID
            - format
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: BackupExportStatus is the observed state of a BackupExport.
            properties:
              bytesSent:
                anyOf:
                - type: integer
                - type: string
                description: BytesSent is reported by the worker when the transfer
                  ends.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable reason when Phase=Failed
                  or Expired.
                type: string
              phase:
                description: BackupExportPhase is the high-level state of one backup
                  download.
                enum:
                - Pending
                - Ready
                - Completed
                - Failed
                - Expired
                type: string
              serviceName:
                description: |-
                  ServiceName is the ClusterIP Service the API or gateway dials. It is
                  also the TLS server name of the worker certificate.
                type: string
              snapshotID:
                description: SnapshotID is the restic snapshot being exported.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
