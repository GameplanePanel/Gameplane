---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    gameplane.local/crd-bundle-sha256: d5069bc379d1aee86475b0f63c6c2866423a381b14b44cbf7a77dfd63e3c1c6a
    controller-gen.kubebuilder.io/version: v0.20.1
  name: networkcaptures.gameplane.local
spec:
  group: gameplane.local
  names:
    kind: NetworkCapture
    listKind: NetworkCaptureList
    plural: networkcaptures
    shortNames:
    - cap
    - caps
    singular: networkcapture
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.packetsWritten
      name: Packets
      type: integer
    - jsonPath: .status.bytesWritten
      name: Size
      type: string
    - jsonPath: .status.startTime
      name: Start
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkCapture represents a single packet-capture session initiated by an admin user.
          It tracks the capture's lifecycle (Pending, Running, Completed, Failed), configuration
          (filter, max-duration, max-size), and observed state (packets written, bytes written, timestamps, error reasons).
          Each NetworkCapture is owned by its parent GameServer via ownerReferences.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkCaptureSpec is the desired state of a packet capture
              session.
            properties:
              filter:
                description: |-
                  Filter is a pcap-filter(7) expression restricting captured packets.
                  Examples: "tcp port 8080", "host 192.168.1.5 and udp", "tcp[tcpflags] & tcp-syn != 0"
                  Optional. If omitted, a default filter restricts capture to the GameServer's own advertised ports.
                  Immutable once created (filter is set at capture start time, cannot change mid-capture).
                maxLength: 1024
                type: string
              maxDuration:
                description: |-
                  MaxDuration is the maximum runtime for the capture, expressed as a Go duration.
                  If the capture runs for longer than this duration, it stops automatically.
                  Required. Must be > 0.
                type: string
              maxSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  MaxSize is the maximum file size for the capture (e.g. 100Mi, 5Gi).
                  If the capture file grows larger than this size, it stops automatically.
                  Required. Must be > 0.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              serverRef:
                description: ServerRef is the GameServer being captured. Immutable
                  once created. Required.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished is the auto-expiration window after the capture completes,
                  in seconds. After status.completionTime + TTLSecondsAfterFinished, the NetworkCapture
                  is deleted by the operator. Optional; if omitted, the cluster default
                  (from Helm value capture.defaultRetentionSeconds) is used. The cluster-wide maximum
                  (capture.maxRetentionSeconds) constrains this field; requests exceeding the max are
                  rejected at API tier with HTTP 400. The cluster maximum of 604800 seconds (7 days) is
                  a storage-limitation-informed default, not a legal requirement.
                format: int32
                maximum: 604800
                minimum: 60
                type: integer
            required:
            - maxDuration
            - maxSize
            - serverRef
            type: object
          status:
            description: NetworkCaptureStatus is the observed state of a packet capture
              session.
            properties:
              bytesWritten:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  BytesWritten is the total size of the captured file, in bytes.
                  Updated as the capture progresses; final value recorded when capture completes.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              completionTime:
                description: |-
                  CompletionTime is the RFC3339 timestamp when the capture stopped
                  (phase transitioned to Completed or Failed). Populated by the operator when transitioning to a terminal phase.
                format: date-time
                type: string
              conditions:
                description: Conditions contains structured reasons for current phase
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable status or error message.
                maxLength: 512
                type: string
              packetsWritten:
                description: |-
                  PacketsWritten is the number of packets captured and written to the output file.
                  Updated as the capture progresses; final value recorded when capture completes.
                format: int64
                type: integer
              phase:
                allOf:
                - enum:
                  - Pending
                  - Running
                  - Completed
                  - Failed
                  - Expired
                - enum:
                  - Pending
                  - Running
                  - Completed
                  - Failed
                  - Expired
                description: |-
                  Phase is the current lifecycle phase of the capture.
                  Valid values: Pending, Running, Completed, Failed, Expired.
                type: string
              startTime:
                description: |-
                  StartTime is the RFC3339 timestamp when the capture started
                  (phase transitioned from Pending to Running). Populated by the operator when transitioning to Running.
                format: date-time
                type: string
            required:
            - phase
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
