{{- /* Discover the API and operator's live sources independently.
Never put credential material in rendered manifests or error messages. */ -}}
{{- if and .Release.IsUpgrade (eq (include "gameplane.apiEnabled" .) "true") (not .Values.api.standalone) }}
{{- $target := include "gameplane.credentialsNamespace" . }}
{{- $secretSources := dict }}
{{- $moduleSources := list }}
{{- $api := lookup "apps/v1" "Deployment" .Release.Namespace "gameplane-api" }}
{{- range $container := dig "spec" "template" "spec" "containers" list $api }}
  {{- if and (eq $container.name "api") (not (has "--standalone" ($container.args | default list))) }}
    {{- $previous := $.Release.Namespace }}
    {{- range $env := $container.env }}
      {{- if eq $env.name "GAMEPLANE_CREDENTIALS_NAMESPACE" }}{{ $previous = $env.value }}{{ end }}
    {{- end }}
    {{- $_ := set $secretSources $previous (list "auth-provider" "notification-sink" "mod-registry" "cluster-kubeconfig" "agent-gateway-credentials") }}
    {{- $moduleSources = append $moduleSources $previous }}
  {{- end }}
{{- end }}
{{- $operator := lookup "apps/v1" "Deployment" .Release.Namespace "gameplane-operator" }}
{{- range $container := dig "spec" "template" "spec" "containers" list $operator }}
  {{- if eq $container.name "manager" }}
    {{- /* The v0.3 chart supplied POD_NAMESPACE via the downward API before
    it passed --control-plane-namespace explicitly. */ -}}
    {{- $clusterNS := $.Release.Namespace }}
    {{- $moduleNS := "gameplane-system" }}
    {{- $configNS := "" }}
    {{- range $arg := $container.args }}
      {{- if hasPrefix "--control-plane-namespace=" $arg }}{{ $clusterNS = trimPrefix "--control-plane-namespace=" $arg }}{{ end }}
      {{- if hasPrefix "--module-namespace=" $arg }}{{ $moduleNS = trimPrefix "--module-namespace=" $arg }}{{ end }}
      {{- if hasPrefix "--module-configmap-namespace=" $arg }}{{ $configNS = trimPrefix "--module-configmap-namespace=" $arg }}{{ end }}
    {{- end }}
    {{- if not (hasKey $secretSources $clusterNS) }}
      {{- $_ := set $secretSources $clusterNS (list "cluster-kubeconfig") }}
    {{- end }}
    {{- $moduleSources = append $moduleSources ($configNS | default $moduleNS) }}
  {{- end }}
{{- end }}
{{- range $previous, $features := omit $secretSources $target }}
  {{- range $secret := (lookup "v1" "Secret" $previous "").items }}
    {{- range $feature := $features }}
      {{- $label := printf "gameplane.local/%s" $feature }}
      {{- if eq (index ($secret.metadata.labels | default dict) $label) "true" }}
        {{- $copy := lookup "v1" "Secret" $target $secret.metadata.name }}
        {{- $labels := dig "metadata" "labels" dict $copy }}
        {{- if or (not $copy)
            (ne (index $labels $label) "true")
            (ne (index $secret.metadata.labels "gameplane.local/managed-by") (index $labels "gameplane.local/managed-by"))
            (ne $secret.type $copy.type)
            (ne ($secret.immutable | default false) ($copy.immutable | default false))
            (not (deepEqual $secret.data $copy.data)) }}
          {{- fail (printf "Migrate Secret %s/%s (%s) with its type, data, immutable setting and management labels to %s before upgrading; see docs/install.md#upgrading-native-api-credentials" $previous $secret.metadata.name $feature $target) }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $source := without (uniq $moduleSources) $target }}
  {{- range $cm := (lookup "v1" "ConfigMap" $source "").items }}
    {{- $upload := eq (index ($cm.metadata.labels | default dict) "gameplane.local/module-upload") "true" }}
    {{- $locale := false }}
    {{- range $owner := $cm.metadata.ownerReferences }}
      {{- if and $owner.controller (hasPrefix "gameplane.local/" $owner.apiVersion) (eq $owner.kind "GameTemplate") (eq $cm.metadata.name (printf "%s-locales" $owner.name)) }}
        {{- $locale = true }}
      {{- end }}
    {{- end }}
    {{- if or $upload $locale }}
      {{- $copy := lookup "v1" "ConfigMap" $target $cm.metadata.name }}
      {{- $labels := dig "metadata" "labels" dict $copy }}
      {{- $uploadLabelsMatch := or (not $upload) (and (eq (index $labels "gameplane.local/module-upload") "true") (eq (index $labels "gameplane.local/module-name") (index $cm.metadata.labels "gameplane.local/module-name"))) }}
      {{- $localeOwnerMatches := or (not $locale) (deepEqual $cm.metadata.ownerReferences (dig "metadata" "ownerReferences" list $copy)) }}
      {{- if or (not $copy) (not $uploadLabelsMatch) (not $localeOwnerMatches)
          (ne ($cm.immutable | default false) ($copy.immutable | default false))
          (not (deepEqual $cm.data $copy.data)) (not (deepEqual $cm.binaryData $copy.binaryData)) }}
        {{- fail (printf "Migrate module ConfigMap %s/%s with its data, immutable setting, upload labels or template ownership to %s before upgrading; see docs/install.md#upgrading-native-api-credentials" $source $cm.metadata.name $target) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
