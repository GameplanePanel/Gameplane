{{- if and .Values.prometheusRules.enabled (eq (include "gameplane.operatorEnabled" .) "true") }}
{{- $namespaces := join "|" (include "gameplane.operatorGameNamespaces" . | fromJsonArray) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gameplane-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gameplane.labels" . | nindent 4 }}
    {{- with .Values.prometheusRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: gameplane.workloads
      rules:
        - alert: GameplaneScrapeTargetMissing
          expr: |
            (
              max by (namespace, pod, gameplane_component) (
                label_replace(kube_pod_container_status_running{namespace=~"{{ $namespaces }}",container=~"agent|tunnel"} == 1,
                  "gameplane_component", "$1", "container", "(agent|tunnel)")
              )
              and on (namespace, pod) kube_pod_labels{namespace=~"{{ $namespaces }}",label_app_kubernetes_io_name=~"gameplane-game|gameplane-tunnel"}
            )
            unless on (namespace, pod, gameplane_component) up{namespace=~"{{ $namespaces }}",gameplane_component=~"agent|tunnel"}
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Running Gameplane workload is missing from scrape discovery" }
        - alert: GameplaneScrapeUnavailable
          expr: max by (namespace, pod, gameplane_component) (up{gameplane_component=~"agent|tunnel",namespace=~"{{ $namespaces }}"}) == 0
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Gameplane metrics target cannot be scraped" }
        - alert: GameplaneRelayUnavailable
          expr: (max by (namespace, pod) (gameplane_tunnel_ready{namespace=~"{{ $namespaces }}"}) == 0) and on (namespace, pod) (max by (namespace, pod) (gameplane_tunnel_connection_known{namespace=~"{{ $namespaces }}"}) == 1)
          for: 2m
          labels: { severity: warning }
          annotations: { summary: "Gameplane relay connection or forwards are unavailable" }
        - alert: GameplaneRelayHealthUnknown
          expr: (max by (namespace, pod) (gameplane_tunnel_connection_known{namespace=~"{{ $namespaces }}"}) == 0) and on (namespace, pod) (max by (namespace, pod) (gameplane_tunnel_connection_supported{namespace=~"{{ $namespaces }}"}) == 1)
          for: 5m
          labels: { severity: info }
          annotations: { summary: "Gameplane provider cannot confirm live relay health" }
        - alert: GameplaneRelaySaturated
          expr: |
            max by (namespace, pod) (increase(gameplane_tunnel_flow_rejections_total{namespace=~"{{ $namespaces }}"}[5m])) > 0
            or
            max by (namespace, pod) (increase(gameplane_tunnel_udp_queue_drops_total{namespace=~"{{ $namespaces }}"}[5m])) > 0
          labels: { severity: warning }
          annotations: { summary: "Relay rejected traffic at its flow limit or dropped queued UDP packets" }
        - alert: GameplanePerformanceUnknown
          expr: max by (namespace, pod, metric, signal, unit) (gameplane_agent_performance_available{namespace=~"{{ $namespaces }}"}) == 0
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Declared game performance measurement is unavailable" }
        - alert: GameplanePerformanceDegraded
          expr: |
            (max by (namespace, pod, metric, signal, unit) (gameplane_agent_performance_value{namespace=~"{{ $namespaces }}"})
              < on (namespace, pod, metric, signal, unit)
             max by (namespace, pod, metric, signal, unit) (gameplane_agent_performance_degraded_threshold{namespace=~"{{ $namespaces }}",direction="below"}))
            or
            (max by (namespace, pod, metric, signal, unit) (gameplane_agent_performance_value{namespace=~"{{ $namespaces }}"})
              > on (namespace, pod, metric, signal, unit)
             max by (namespace, pod, metric, signal, unit) (gameplane_agent_performance_degraded_threshold{namespace=~"{{ $namespaces }}",direction="above"}))
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Game performance crossed its module-declared threshold" }
        - alert: GameplaneCPUThrottled
          expr: max by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace=~"{{ $namespaces }}",container="game"}[5m]) / rate(container_cpu_cfs_periods_total{namespace=~"{{ $namespaces }}",container="game"}[5m])) > 0.25
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "Game container CPU is throttled in more than 25% of periods" }
        - alert: GameplaneMemoryPressure
          expr: max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"{{ $namespaces }}",container="game"} / (container_spec_memory_limit_bytes{namespace=~"{{ $namespaces }}",container="game"} > 0)) > 0.9
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "Game container working set exceeds 90% of its memory limit" }
        - alert: GameplaneContainerOOM
          expr: (max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~"{{ $namespaces }}"}[10m])) > 0) and on (namespace, pod, container) (max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{namespace=~"{{ $namespaces }}",reason="OOMKilled"}) == 1)
          labels: { severity: warning }
          annotations: { summary: "Gameplane container restarted after an OOM kill" }
        - alert: GameplanePodPending
          expr: max by (namespace, pod) (kube_pod_status_phase{namespace=~"{{ $namespaces }}",phase="Pending"}) == 1
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "Gameplane Pod has remained Pending for ten minutes" }
        - alert: GameplaneNodePressure
          expr: (max by (node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"}) == 1) and on (node) max by (node) (kube_pod_info{namespace=~"{{ $namespaces }}"})
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "A node hosting Gameplane Pods reports resource pressure" }
{{- end }}
