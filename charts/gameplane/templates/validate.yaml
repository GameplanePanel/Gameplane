{{- $network := .Values.networkPolicies | default dict }}
{{- if $network.strict }}
{{- if not $network.enabled }}
{{- fail "networkPolicies.strict requires networkPolicies.enabled=true" }}
{{- end }}
{{- $required := list "kubeletCIDRs" "apiServerCIDRs" }}
{{- if not (and (eq (include "gameplane.operatorEnabled" .) "true") ($network.probeIngress | default dict).enabled) }}
{{- $required = append $required "probePorts" }}
{{- end }}
{{- range $key := $required }}
{{- $entries := index $network $key }}
{{- if or (not (kindIs "slice" $entries)) (eq (len $entries) 0) }}
{{- fail (printf "networkPolicies.strict requires a non-empty networkPolicies.%s list" $key) }}
{{- end }}
{{- end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])" }}
{{- $ipv4 := printf "^%s(\\.%s){3}/([0-9]|[12][0-9]|3[0-2])$" $octet $octet }}
{{- $h := "[0-9A-Fa-f]{1,4}" }}
{{- $ipv6 := printf "^((%s:){7}%s|(%s:){1,7}:|(%s:){1,6}:%s|(%s:){1,5}(:%s){1,2}|(%s:){1,4}(:%s){1,3}|(%s:){1,3}(:%s){1,4}|(%s:){1,2}(:%s){1,5}|%s:((:%s){1,6})|:((:%s){1,7}|:))/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$" $h $h $h $h $h $h $h $h $h $h $h $h $h $h $h $h }}
{{- range $key := list "kubeletCIDRs" "apiServerCIDRs" }}
{{- range (index $network $key) }}
{{- if or (not (kindIs "string" .)) (not (or (regexMatch $ipv4 (toString .)) (regexMatch $ipv6 (toString .)))) }}
{{- fail (printf "networkPolicies.%s entries must be explicit IPv4/IPv6 CIDRs" $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $network.probePorts }}
{{- if or (not (has (.protocol | default "") (list "TCP" "UDP" "SCTP"))) (not (regexMatch "^[0-9]+$" (toString .port))) (lt (int .port) 1) (gt (int .port) 65535) }}
{{- fail "networkPolicies.probePorts requires protocol TCP/UDP/SCTP and an integer port from 1 to 65535" }}
{{- end }}
{{- end }}
{{- end }}
{{- $diagnostics := include "gameplane.nodeDiagnostics" . | fromJson }}
{{- $nativeAPI := and (eq (include "gameplane.apiEnabled" .) "true") (not .Values.api.standalone) }}
{{- if or $nativeAPI (eq (include "gameplane.operatorEnabled" .) "true") }}
{{- $protected := list .Release.Namespace (.Values.operator.agentCASecretNamespace | default .Release.Namespace) (.Values.operator.moduleNamespace | default .Release.Namespace) "default" "kube-system" "kube-public" "kube-node-lease" }}
{{- $credentials := include "gameplane.operatorClusterCredentialsNamespace" . }}
{{- if $nativeAPI }}
{{- if and .Values.api.credentialsNamespace .Values.operator.controlPlaneNamespace (ne .Values.api.credentialsNamespace .Values.operator.controlPlaneNamespace) }}
{{- fail "api.credentialsNamespace and operator.controlPlaneNamespace must reference the same dedicated namespace for cluster credentials" }}
{{- end }}
{{- if has $credentials $protected }}
{{- fail (printf "API-writable Secrets require a dedicated namespace. %s overlaps a protected namespace" $credentials) }}
{{- end }}
{{- end }}
{{- $protected = append $protected $credentials }}
{{- range $ns := include "gameplane.operatorGameNamespaces" . | fromJsonArray }}
{{- if has $ns $protected }}
{{- fail (printf "Game workloads require a dedicated namespace. %s overlaps a protected namespace" $ns) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $diagnostics.enabled }}
{{- if or (not .Values.capture.enabled) (ne (include "gameplane.operatorEnabled" .) "true") }}
{{- fail "capture.nodeDiagnostics requires capture.enabled and the operator" }}
{{- end }}
{{- $protectedNamespaces := append (include "gameplane.operatorSecretNamespaces" . | fromJsonArray) .Release.Namespace }}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $diagnostics.namespace)) (gt (len $diagnostics.namespace) 63) (has $diagnostics.namespace $protectedNamespaces) }}
{{- fail "capture.nodeDiagnostics.namespace must be a separate explicit DNS-label namespace" }}
{{- end }}
{{- if lt (int $diagnostics.maxCaptures) 1 }}
{{- fail "capture.nodeDiagnostics.maxCaptures must be positive" }}
{{- end }}
{{- end }}
{{- if not (regexMatch "^v1\\.[0-9]+$" (.Values.podSecurity.version | default "v1.34")) }}
{{- fail "podSecurity.version must pin a Kubernetes minor such as v1.34" }}
{{- end }}
{{- $ha := .Values.api.postgresHA | default dict }}
{{- if and (hasKey $ha "enabled") (not (kindIs "bool" $ha.enabled)) }}
{{- fail "api.postgresHA.enabled must be a boolean" }}
{{- end }}
{{- if $ha.enabled }}
{{- if not (and $nativeAPI (eq .Values.api.db.driver "postgres") .Values.api.db.existingSecret) }}
{{- fail "api.postgresHA.enabled requires native API mode, api.db.driver=postgres and api.db.existingSecret" }}
{{- end }}
{{- if not (and (regexMatch "^[1-9][0-9]*$" (toString .Values.api.replicas)) (ge (int64 .Values.api.replicas) 2)) }}
{{- fail "api.postgresHA.enabled requires at least two integer api.replicas" }}
{{- end }}
{{- $live := lookup "apps/v1" "Deployment" .Release.Namespace "gameplane-api" }}
{{- if and $live (ne (index ($live.spec.template.metadata.annotations | default dict) "gameplane.local/postgres-ha-protocol") "1") }}
{{- fail "First upgrade at api.replicas=1 with api.postgresHA.enabled=false and the new PostgreSQL API image, then wait for the singleton rollout before enabling HA" }}
{{- end }}
{{- if and $live (eq (int $live.spec.replicas) 1) }}
{{- $status := $live.status | default dict }}
{{- if or (ne (int64 $status.observedGeneration) (int64 $live.metadata.generation)) (ne (int $status.updatedReplicas) 1) (ne (int $status.availableReplicas) 1) (ne (int $status.replicas) 1) (gt (int $status.terminatingReplicas) 0) }}
{{- fail "Wait for the HA-capable PostgreSQL singleton rollout and its database readiness check before enabling additional writers" }}
{{- end }}
{{- end }}
{{- else if and (eq (include "gameplane.apiEnabled" .) "true") (ne (toString .Values.api.replicas) "1") }}
{{- fail "api requires api.replicas=1 unless native PostgreSQL HA is enabled" }}
{{- end }}
{{- if .Values.api.standalone }}
{{- if ne (include "gameplane.apiEnabled" .) "true" }}
{{- fail "api.standalone requires api.enabled=true" }}
{{- end }}
{{- $panelKey := .Values.api.panelKey | default dict }}
{{- $keyFileName := $panelKey.fileName | default "panel.key" }}
{{- if or (gt (len $keyFileName) 128) (not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]*$" $keyFileName)) }}
{{- fail "api.panelKey.fileName must be a simple filename of at most 128 characters" }}
{{- end }}
{{- if and $panelKey.existingSecret ($panelKey.storage | default dict).existingClaim }}
{{- fail "choose either api.panelKey.existingSecret or api.panelKey.storage.existingClaim" }}
{{- end }}
{{- if eq (include "gameplane.operatorEnabled" .) "true" }}
{{- fail "api.standalone requires operator.enabled=false; install operators in the remote game clusters" }}
{{- end }}
{{- if (.Values.gateway | default dict).enabled }}
{{- fail "api.standalone cannot host gateway.enabled; install the gateway in the remote game cluster" }}
{{- end }}
{{- end }}
