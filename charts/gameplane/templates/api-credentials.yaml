{{- $rbac := include "gameplane.nativeRBAC" . | fromJson -}}
{{- if and (eq (include "gameplane.apiEnabled" .) "true") (not .Values.api.standalone) }}
{{- $namespace := include "gameplane.credentialsNamespace" . }}
{{- if not (or .Values.api.credentialsNamespace .Values.operator.controlPlaneNamespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-api-credentials
  namespace: {{ $namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
rules:
  {{- if $rbac.remoteClusters }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  {{- else if $rbac.runtimeSecretNames }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: {{ $rbac.runtimeSecretNames | toJson }}
  {{- end }}
  - apiGroups: [""]
    resources: [configmaps]
    {{- if $rbac.catalogAdmin }}
    verbs: [get, list, create, update, delete]
    {{- else }}
    verbs: [get, list]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-api-credentials
  namespace: {{ $namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-api-credentials }
subjects:
  - kind: ServiceAccount
    name: gameplane-api
    namespace: {{ .Release.Namespace }}
{{- if eq (include "gameplane.operatorEnabled" .) "true" }}
---
# The operator creates, replaces and removes translated module ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator-module-configmaps
  namespace: {{ $namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator-module-configmaps
  namespace: {{ $namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-operator-module-configmaps }
subjects:
  - kind: ServiceAccount
    name: gameplane-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
