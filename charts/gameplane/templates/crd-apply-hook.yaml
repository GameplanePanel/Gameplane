{{- if not .Values.api.standalone }}
{{- if .Values.crds.autoApply.enabled }}
{{- /*
This hook is how the chart installs and updates its CRDs. The chart no longer
bundles the gameplane-crds subchart (its crds/ copy doubled the packaged
chart; that chart is still published on its own for GitOps setups), so a Job
runs `kubectl apply --server-side` over the CRDs on pre-INSTALL and
pre-UPGRADE: first installs get them before any release object is created,
and a plain `helm upgrade` always brings the schema up to date (Helm itself
never updates CRDs). The kubectl image is therefore needed on every install;
air-gapped clusters mirror crds.autoApply.image.

Once the CRDs are Established the same Job server-side applies the chart's
ModuleSources (modulesource.yaml). They cannot be release objects here:
Helm resolves every release object's kind before it runs pre-install hooks,
and on a fresh cluster the ModuleSource kind does not exist yet.

Why a Job and not templates/: the CRDs can't live in templates/ (their
descriptions contain Go-template syntax like `{{"{{"}}.Params.message{{"}}"}}`
that Helm would try to evaluate), and the large gametemplates CRD needs
server-side apply to avoid the client-side last-applied-annotation size
limit. So the CRDs are shipped in crd-manifests/ (readable by .Files, unlike
the special crds/ dir), mounted into the Job via a ConfigMap.

All resources are hook-scoped and cleaned up after a successful run; only
the CRDs they apply persist (CRDs are never owned or deleted by Helm here,
so `helm uninstall` never wipes your GameServers).
*/}}
{{- /*
`make manifests` (hack/sync-chart-crds.sh) stamps every CRD with
`gameplane.local/crd-bundle-sha256`, a hash over the whole generated CRD set;
refuse to render a chart whose crd-manifests/ lost it.
*/}}
{{- $crdStamp := "gameplane.local/crd-bundle-sha256" }}
{{- $wantStamp := dig "metadata" "annotations" $crdStamp "" (.Files.Get "crd-manifests/gameplane.local_gameservers.yaml" | fromYaml) }}
{{- if not $wantStamp }}
{{- fail (printf "crd-manifests/gameplane.local_gameservers.yaml carries no %s annotation; run `make manifests`" $crdStamp) }}
{{- end }}
{{- $hookEvents := "pre-install,pre-upgrade" }}
{{- $moduleSources := include "gameplane.moduleSources" (dict "root" . "keep" true) | trim }}
{{- $hookAnnotations := dict
  "helm.sh/hook" $hookEvents
  "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-crd-apply
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Cluster-scoped: namespace-qualified so the same release name in two
  # namespaces doesn't collide on this name.
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-crd-apply
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
rules:
  # Scoped to CRDs only. get/create for first apply, patch for server-side
  # apply of an existing CRD (list lets kubectl resolve the resource).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  {{- if $moduleSources }}
  # Server-side apply of the chart's ModuleSources (see modulesource.yaml).
  - apiGroups: ["gameplane.local"]
    resources: ["modulesources"]
    verbs: ["get", "list", "create", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-crd-apply
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-{{ .Release.Namespace }}-crd-apply }
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-crd-apply
    namespace: {{ .Release.Namespace }}
{{- if and (eq (include "gameplane.apiEnabled" .) "true") .Release.IsUpgrade }}
---
# One-time workload migration, riding along with this hook because it needs
# exactly the same thing: a kubectl that runs BEFORE Helm applies the release.
#
# Older releases (including combined PostgreSQL installs) shipped no `strategy`
# on the api Deployment, so the apiserver defaulted it to RollingUpdate with a
# spec.strategy.rollingUpdate block. The chart now sets `type: Recreate` (the
# API's audit/user-management locks require one process), and the apiserver rejects
# the two together:
#
#   spec.strategy.rollingUpdate: Forbidden: may not be specified when
#   strategy `type` is 'Recreate'
#
# Helm cannot clear the stale field itself: under server-side apply it does
# not own it, so an explicit null is not enough, and the whole `helm upgrade`
# fails -- not just the Deployment. Hence a patch that runs first.
#
# Namespaced Role, not an addition to the CRD ClusterRole above: this touches
# one Deployment in the release namespace and should not be able to reach
# anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-strategy-migrate
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # The chart always names the API Deployment "gameplane-api" literally
    # (api.yaml), not `{{ .Release.Name }}-api` like the surrounding
    # Role/RoleBinding names. A release installed under any other name (e.g.
    # `gp`) used to target a Deployment that never existed and abort every
    # upgrade (F-213).
    resourceNames: ["gameplane-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-strategy-migrate
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-strategy-migrate }
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-crd-apply
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-crd-manifests
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
data:
  # .AsConfig embeds each CRD file verbatim (filename: content). .Files.Get
  # does not re-template the content, so the {{"{{"}} … {{"}}"}} in CRD
  # descriptions is preserved literally.
{{ (.Files.Glob "crd-manifests/*.yaml").AsConfig | indent 2 }}
{{- if $moduleSources }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-module-sources
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
data:
  module-sources.yaml: |
    {{- $moduleSources | nindent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-crd-apply
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "0") $hookAnnotations) | nindent 4 }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameplane-crd-apply
        {{- include "gameplane.labels" . | nindent 8 }}
    spec:
      {{- include "gameplane.placement" .Values.crds.autoApply | nindent 6 }}
      serviceAccountName: {{ .Release.Name }}-crd-apply
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
      {{- /* The target may be enabled for the first time during this upgrade.
             Only an existing Deployment needs migration; a lookup error fails
             rendering, while NotFound safely skips the patch. */}}
      {{- if and (eq (include "gameplane.apiEnabled" .) "true") (not (.Values.api.postgresHA | default dict).enabled) .Release.IsUpgrade (lookup "apps/v1" "Deployment" .Release.Namespace "gameplane-api") }}
        # Clear the stale spec.strategy.rollingUpdate left by releases that
        # predate the Recreate strategy — see the Role above for why Helm
        # cannot do this itself. An initContainer rather than a second command
        # on the container below because the kubectl image is distroless and
        # has no shell to chain with.
        #
        # A strategic-merge patch, not a JSON `remove`: it sets type and
        # clears rollingUpdate atomically (clearing it while the live type is
        # still RollingUpdate would just get defaulted straight back), a null
        # deletes the key rather than erroring when it is already absent, and
        # re-running it on an already-migrated Deployment is a no-op. So this
        # stays safe on every subsequent upgrade, not just the one that needs
        # it.
        - name: migrate-api-strategy
          image: {{ .Values.crds.autoApply.image | quote }}
          imagePullPolicy: {{ .Values.crds.autoApply.pullPolicy }}
          command:
            - kubectl
            - patch
            - deployment
            - gameplane-api
            - --type=merge
            - -p
            - '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
          env:
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      {{- end }}
        # --field-manager=helm: Helm 4 installs crds/ with a server-side
        # apply under field manager "helm" and WITHOUT --force-conflicts.
        # .spec.versions is an atomic list, so under kubectl's default
        # manager ("kubectl") every schema change this hook applied left
        # "kubectl" the sole owner of it, and a later install of the
        # standalone gameplane-crds chart over these CRDs failed with
        # "Apply failed with 1 conflict: conflict with \"kubectl\" ...
        # .spec.versions". Applying as "helm" keeps one owner.
        # --force-conflicts still takes the fields over from any other
        # manager (e.g. "kubectl" from an older release's hook).
        - name: apply-crds
          image: {{ .Values.crds.autoApply.image | quote }}
          imagePullPolicy: {{ .Values.crds.autoApply.pullPolicy }}
          command: ["kubectl", "apply", "--server-side", "--force-conflicts", "--field-manager=helm", "-f", "/crds"]
          env:
            # kubectl caches API discovery under $HOME/.kube; point it at the
            # writable emptyDir so readOnlyRootFilesystem holds.
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: crds, mountPath: /crds, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      {{- if $moduleSources }}
        # The kubectl image is distroless (no shell to chain commands), so
        # waiting for the new kinds to be served is its own step.
        - name: wait-crds
          image: {{ .Values.crds.autoApply.image | quote }}
          imagePullPolicy: {{ .Values.crds.autoApply.pullPolicy }}
          command: ["kubectl", "wait", "--for=condition=Established", "--timeout=120s", "-f", "/crds"]
          env:
            # kubectl caches API discovery under $HOME/.kube; point it at the
            # writable emptyDir so readOnlyRootFilesystem holds.
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: crds, mountPath: /crds, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      containers:
        # Each ModuleSource carries helm.sh/resource-policy=keep. Helm reads
        # that annotation from the LIVE object before deleting anything an
        # upgrade drops, so applying it here, before the upgrade, keeps the
        # ModuleSource an older release owned (and its Modules) in place.
        - name: apply-module-sources
          image: {{ .Values.crds.autoApply.image | quote }}
          imagePullPolicy: {{ .Values.crds.autoApply.pullPolicy }}
          command: ["kubectl", "apply", "--server-side", "--force-conflicts", "--field-manager=helm", "-f", "/module-sources"]
          env:
            # kubectl caches API discovery under $HOME/.kube; point it at the
            # writable emptyDir so readOnlyRootFilesystem holds.
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: module-sources, mountPath: /module-sources, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      {{- else }}
      containers:
        - name: wait-crds
          image: {{ .Values.crds.autoApply.image | quote }}
          imagePullPolicy: {{ .Values.crds.autoApply.pullPolicy }}
          command: ["kubectl", "wait", "--for=condition=Established", "--timeout=120s", "-f", "/crds"]
          env:
            # kubectl caches API discovery under $HOME/.kube; point it at the
            # writable emptyDir so readOnlyRootFilesystem holds.
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: crds, mountPath: /crds, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      {{- end }}
      volumes:
        - name: crds
          configMap:
            name: {{ .Release.Name }}-crd-manifests
        {{- if $moduleSources }}
        - name: module-sources
          configMap:
            name: {{ .Release.Name }}-module-sources
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- end }}
