{{- if .Values.serviceMonitors.enabled }}
{{- if (eq (include "gameplane.operatorEnabled" .) "true") }}
apiVersion: v1
kind: Service
metadata:
  name: gameplane-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gameplane-operator
    {{- include "gameplane.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: gameplane-operator }
  ports:
    - { name: metrics, port: 8080, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gameplane-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gameplane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-operator }
  endpoints:
    - { port: metrics, interval: 30s }
---
{{- end }}
{{- if (eq (include "gameplane.apiEnabled" .) "true") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gameplane-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gameplane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-api }
  endpoints:
    - { port: metrics, interval: 30s, path: /metrics }
---
{{- /*
  F-217: the telemetry-receiver serves /metrics only on its dashboard
  listener (port 8081, Bearer auth with the dashboard token), so this
  renders only when the receiver itself is deployed (same condition as
  telemetry-receiver.yaml) AND dashboard.tokenSecretRef.name is set: without
  a token Prometheus would hold a permanently-down target (NOTES.txt warns).
  The key is read through guards (F-214). The
  trailing `---` stays inside this block (not after it) so skipping it
  doesn't leave a stray empty document ahead of the PodMonitor below.
*/}}
{{- $receiverDashboard := .Values.api.telemetry.receiver.dashboard | default dict }}
{{- $receiverToken := $receiverDashboard.tokenSecretRef | default dict }}
{{- if and .Values.api.telemetry.receiver.enabled (not .Values.api.telemetry.endpoint) $receiverToken.name }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gameplane-telemetry-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gameplane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-telemetry-receiver }
  endpoints:
    - port: dashboard
      interval: 30s
      path: /metrics
      bearerTokenSecret:
        name: {{ $receiverToken.name }}
        key: {{ $receiverToken.key | default "token" }}
---
{{- end }}
{{- end }}
{{- /*
  F-216: scrapes the agent's separate plain-HTTP metrics listener
  (--metrics-addr, default :9090), never the mTLS control port 8090; full
  rationale (rejected client-cert approach, containerPort naming) lives in
  agent/specs.md's /metrics section — this is a pointer, not a copy.
*/}}
{{- if (eq (include "gameplane.operatorEnabled" .) "true") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gameplane-agent
  namespace: {{ .Values.gamesNamespace }}
  labels:
    {{- include "gameplane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-game }
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
{{- end }}

{{- end }}
