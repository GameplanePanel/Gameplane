{{- /*
SFTP endpoint for game server files (spec 040). Off by default. The pod holds no game
volumes: every login and file operation goes to the Gameplane API as the signed-in user.

Local mode (default): the panel's own cluster. The chart generates a service token Secret
that the API seeds at startup, and the pod talks to the in-cluster API Service.
Remote mode (sftp.apiURL set): this cluster runs only the SFTP pod against a central panel;
sftp.serviceTokenSecret must hold the token created there.
*/ -}}
{{- if (.Values.sftp | default dict).enabled }}
{{- $sftp := .Values.sftp }}
{{- $apiEnabled := eq (include "gameplane.apiEnabled" .) "true" }}
{{- $local := not $sftp.apiURL }}
{{- if and $local (not $apiEnabled) }}
{{- fail "sftp.enabled=true with api.enabled=false requires sftp.apiURL (the central panel the SFTP pod logs in to)" }}
{{- end }}
{{- if and (not $local) (not $sftp.serviceTokenSecret) }}
{{- fail "sftp.apiURL is set (remote mode): sftp.serviceTokenSecret must name a Secret with the service token (key token) created in the central panel" }}
{{- end }}
{{- $hostKeySecret := $sftp.hostKeySecret | default "gameplane-sftp-host-key" }}
{{- /* Local mode always uses the chart-generated token the API seeds; remote mode uses the operator-supplied Secret. */}}
{{- $tokenSecret := ternary "gameplane-sftp-service-token" $sftp.serviceTokenSecret $local }}
{{- $apiURL := ternary (printf "http://gameplane-api.%s.svc" .Release.Namespace) $sftp.apiURL $local }}
{{- /* Generated once: lookup returns the live Secret on install and upgrade; offline renders regenerate it. */}}
{{- if not $sftp.hostKeySecret }}
{{- $old := lookup "v1" "Secret" .Release.Namespace "gameplane-sftp-host-key" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gameplane-sftp-host-key
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  host_key: {{ dig "data" "host_key" "" ($old | default dict) | default (genPrivateKey "ed25519" | b64enc) }}
{{- end }}
{{- if $local }}
{{- $old := lookup "v1" "Secret" .Release.Namespace "gameplane-sftp-service-token" }}
---
# Local service token for the API's SFTP login path. The API seeds it at startup
# (GAMEPLANE_SFTP_LOCAL_SERVICE_TOKEN). The SFTP pod reads the same value from its file.
apiVersion: v1
kind: Secret
metadata:
  name: gameplane-sftp-service-token
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ dig "data" "token" "" ($old | default dict) | default (printf "gpsftps_%s" (randAlphaNum 43) | b64enc) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameplane-sftp
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
spec:
  replicas: {{ $sftp.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-sftp }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameplane-sftp
        {{- include "gameplane.labels" . | nindent 8 }}
    spec:
      {{- include "gameplane.placement" $sftp | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sftp
          image: {{ include "gameplane.sftpImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - { name: GAMEPLANE_SFTP_LISTEN, value: {{ printf ":%d" (int $sftp.port) | quote }} }
            - { name: GAMEPLANE_SFTP_HOST_KEY, value: /etc/gameplane/sftp/hostkeys }
            - { name: GAMEPLANE_SFTP_API_URL, value: {{ $apiURL | quote }} }
            - { name: GAMEPLANE_SFTP_SERVICE_TOKEN_FILE, value: /etc/gameplane/sftp-token/token }
            {{- if $sftp.caSecret }}
            - { name: GAMEPLANE_SFTP_CA_FILE, value: /etc/gameplane/sftp-ca/ca.crt }
            {{- end }}
            - { name: GAMEPLANE_SFTP_IDLE_TIMEOUT, value: {{ $sftp.idleTimeout | quote }} }
            - { name: GAMEPLANE_SFTP_MAX_SESSIONS_PER_USER, value: {{ printf "%d" (int $sftp.maxSessionsPerUser) | quote }} }
            - { name: GAMEPLANE_SFTP_MAX_TRANSFERS_PER_USER, value: {{ printf "%d" (int $sftp.maxTransfersPerUser) | quote }} }
            - { name: GAMEPLANE_SFTP_DEFAULT_NAMESPACE, value: {{ .Values.gamesNamespace | quote }} }
            - { name: GAMEPLANE_SFTP_METRICS_ADDR, value: ":9102" }
          ports:
            - { name: ssh, containerPort: {{ int $sftp.port }} }
            - { name: metrics, containerPort: 9102 }
          livenessProbe:  { tcpSocket: { port: ssh }, initialDelaySeconds: 5, periodSeconds: 20 }
          readinessProbe: { tcpSocket: { port: ssh }, initialDelaySeconds: 2, periodSeconds: 10 }
          resources: {{- toYaml $sftp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: host-key, mountPath: /etc/gameplane/sftp/hostkeys, readOnly: true }
            - { name: service-token, mountPath: /etc/gameplane/sftp-token, readOnly: true }
            {{- if $sftp.caSecret }}
            - { name: api-ca, mountPath: /etc/gameplane/sftp-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: host-key
          secret:
            secretName: {{ $hostKeySecret }}
            items:
              - { key: host_key, path: host_key }
        - name: service-token
          secret:
            secretName: {{ $tokenSecret }}
            items:
              - { key: token, path: token }
        {{- if $sftp.caSecret }}
        - name: api-ca
          secret:
            secretName: {{ $sftp.caSecret }}
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gameplane-sftp
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
spec:
  type: {{ $sftp.serviceType }}
  selector: { app.kubernetes.io/name: gameplane-sftp }
  ports:
    - { name: ssh, port: {{ int $sftp.port }}, targetPort: ssh, protocol: TCP }
{{- if .Values.networkPolicies.enabled }}
---
# SFTP clients come from the internet, so ingress is open on the SFTP port only. Egress is
# limited to DNS plus the API (local mode) or the central panel's endpoint (remote mode).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gameplane-sftp
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gameplane-sftp
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ int $sftp.port }} }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if $local }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gameplane-api
      ports:
        - { protocol: TCP, port: 8000 }
    {{- else }}
    {{- $hostPort := (urlParse $sftp.apiURL).host | default "" }}
    {{- $apiPort := 443 }}
    {{- if regexMatch ":[0-9]+$" $hostPort }}
    {{- $apiPort = regexFind "[0-9]+$" $hostPort | int }}
    {{- end }}
    - ports:
        {{- range $port := uniq (list 443 $apiPort) }}
        - { protocol: TCP, port: {{ $port }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
