{{- $rbac := include "gameplane.nativeRBAC" . | fromJson -}}
{{- if and (eq (include "gameplane.apiEnabled" .) "true") (not .Values.api.standalone) }}
{{- range $role := list
    (dict "name" "api-catalog-admin" "enabled" $rbac.catalogAdmin "group" "gameplane.local" "resources" (list "gametemplates" "modules" "modulesources") "verbs" (list "create" "update" "patch" "delete"))
    (dict "name" "api-cluster-registration" "enabled" $rbac.remoteClusters "group" "gameplane.local" "resources" (list "clusters") "verbs" (list "create" "update" "delete")) }}
{{- if $role.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Name }}-{{ $role.name }}
  labels: {{- include "gameplane.labels" $ | nindent 4 }}
rules:
  - apiGroups: [{{ $role.group | quote }}]
    resources: {{ $role.resources | toJson }}
    verbs: {{ $role.verbs | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $role.name }}
  labels: {{- include "gameplane.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $.Release.Name }}-{{ $role.name }} }
subjects:
  - { kind: ServiceAccount, name: gameplane-api, namespace: {{ $.Release.Namespace }} }
{{- end }}
{{- end }}
{{- end }}
{{- if and (eq (include "gameplane.operatorEnabled" .) "true") $rbac.snapshotContentReclamation }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator-snapshot-reclaim
  labels: {{- include "gameplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-operator-snapshot-reclaim
  labels: {{- include "gameplane.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-operator-snapshot-reclaim }
subjects:
  - { kind: ServiceAccount, name: gameplane-operator, namespace: {{ .Release.Namespace }} }
{{- end }}
