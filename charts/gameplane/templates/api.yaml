{{- if not (eq (include "gameplane.apiEnabled" .) "true") }}
{{- $livePVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "gameplane-api-data" }}
{{- if and $livePVC (ne (index ($livePVC.metadata.annotations | default dict) "helm.sh/resource-policy") "keep") }}
{{- fail "Before disabling api.enabled on an existing install, annotate gameplane-api-data with helm.sh/resource-policy=keep to preserve the SQLite database" }}
{{- end }}
{{- end }}
{{- if (eq (include "gameplane.apiEnabled" .) "true") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gameplane-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
{{- if not .Values.api.standalone }}
---
# Cluster-wide READ access: templates (cluster-scoped), nodes, storage
# classes, and read-only watches on Gameplane CRDs for the /events stream.
# Note the absence of any write verb here — mutation permissions are
# bound per-namespace via Role + RoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-api-read
  labels: {{- include "gameplane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gameplane.local"]
    resources: [gameservers, gametemplates, backups, backupschedules, restores, modules, modulesources, networkcaptures]
    verbs: [get, list, watch]
  - apiGroups: ["gameplane.local"]
    resources: [gametemplates]
    verbs: [create, update, patch, delete]      # templates are cluster-scoped; admin UI edits them
  - apiGroups: ["gameplane.local"]
    resources: [modules]
    verbs: [create, update, patch, delete]      # modules are cluster-scoped; install/upgrade/uninstall from the dashboard
  - apiGroups: ["gameplane.local"]
    resources: [modulesources]
    verbs: [create, update, patch, delete]      # source management (add/edit/remove sources) from the dashboard
  - apiGroups: ["gameplane.local"]
    resources: [clusters]
    verbs: [get, list, watch, create, update, delete]   # registration and gateway configuration from the dashboard
  - apiGroups: [""]
    resources: [nodes, events]
    verbs: [get, list, watch]
  # Per-node pod counts for the dashboard's cluster meters
  # (countNodePods in api/internal/handlers/cluster.go lists pods cluster-wide).
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  # Live node CPU/memory for the dashboard's cluster meters
  # (fetchNodeUsage in api/internal/handlers/cluster.go reads the
  # metrics-server aggregated API). Optional by design: without
  # metrics-server — or without this rule — the read fails and the API
  # omits "used", so the dashboard shows "—" instead of a fake 0%. That
  # graceful fallback is exactly why a missing rule here is silent, so
  # this must stay in step with that handler.
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes]
    verbs: [get, list]
  # Cluster storage stats (api/internal/handlers/cluster.go) sum
  # PersistentVolume capacity (cluster-scoped) for the dashboard.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-api-read
  labels: {{- include "gameplane.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-api-read }
subjects:
  - kind: ServiceAccount
    name: gameplane-api
    namespace: {{ .Release.Namespace }}
---
# Namespace-scoped WRITE access: limited to the games namespace(s) the
# API is allowed to mutate. Expanding this to additional namespaces
# requires a new RoleBinding here AND adding them to
# GAMEPLANE_EXTRA_NAMESPACES on the API Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-api-games
  namespace: {{ .Values.gamesNamespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gameplane.local"]
    resources: [gameservers, backups, backupschedules, restores, networkcaptures]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["gameplane.local"]
    resources: [gameservers/status, backups/status, backupschedules/status, restores/status, networkcaptures/status]
    verbs: [get, update, patch]
  # Verify GameServer -> StatefulSet -> Pod controller ownership before
  # serving pod logs or accepting terminal input.
  - apiGroups: ["apps"]
    resources: [statefulsets]
    verbs: [get]
  # The PTY console (api/internal/ws/attach.go) attaches to the game
  # container via the pod-attach subresource. SPDY uses POST (create);
  # the websocket transport uses GET.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/attach]
    verbs: [get, create]
  # The startup-log stream (api/internal/ws/podlogs.go) follows the game
  # container's stdout via the pod-log subresource so download/config
  # output is visible before the game's own log file exists.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Backup destinations are Secrets in the games namespace
  # (api/internal/handlers/destinations.go).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-api-games
  namespace: {{ .Values.gamesNamespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-api-games }
subjects:
  - kind: ServiceAccount
    name: gameplane-api
    namespace: {{ .Release.Namespace }}
---
# Module upload bundles are ConfigMaps in the control-plane namespace
# (api/internal/handlers/module_upload.go); the operator indexes them
# via upload-type ModuleSources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-api-uploads
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
  # Notification sink credentials, auth-provider clientSecrets, and
  # mod-registry API keys (CurseForge/Steam/Nexus) all live as Secrets
  # here in the control-plane namespace, under their own feature label
  # (gameplane.local/notification-sink, gameplane.local/auth-provider,
  # gameplane.local/mod-registry respectively). The API reads them at
  # use time and — since each feature's Add/Set form accepts the secret
  # value directly — also creates/updates/deletes them. RBAC can't
  # filter by label, so the real boundary is in code: reads and updates
  # refuse Secrets not labelled for the calling feature, and deletes
  # additionally require gameplane.local/managed-by=gameplane-api so
  # kubectl-/GitOps-created Secrets are never deleted over HTTP
  # (api/internal/notify/sinks.go, api/internal/auth/registry.go,
  # api/internal/registry/keys.go, api/internal/handlers/secrets_managed.go).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
  # System logs admin endpoint (api/internal/handlers/systemlogs.go)
  # streams operator and API pod logs from the control-plane namespace.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-api-uploads
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-api-uploads }
subjects:
  - kind: ServiceAccount
    name: gameplane-api
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- /*
  Safety guard: If switching an existing install to existingClaim, ensure the
  live gameplane-api-data PVC won't be pruned and destroyed by Helm.
*/}}
{{- if and (or .Values.api.standalone (eq .Values.api.db.driver "sqlite")) .Values.api.storage.existingClaim }}
  {{- $livePVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "gameplane-api-data" }}
  {{- if $livePVC }}
    {{- $annotations := $livePVC.metadata.annotations | default dict }}
    {{- if not (eq (index $annotations "helm.sh/resource-policy") "keep") }}
      {{- fail (printf "PersistentVolumeClaim 'gameplane-api-data' exists in namespace '%s' without annotation 'helm.sh/resource-policy: keep'. Switching to api.storage.existingClaim will cause Helm to prune the un-annotated PVC and erase your SQLite database. To protect your data, run:\n  kubectl annotate pvc -n %s gameplane-api-data helm.sh/resource-policy=keep\nbefore upgrading with existingClaim." .Release.Namespace .Release.Namespace) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if and (or .Values.api.standalone (eq .Values.api.db.driver "sqlite")) (not .Values.api.storage.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gameplane-api-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.api.storage.size }} }
  {{- with .Values.api.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameplane-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gameplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-api }
  {{- if or .Values.api.standalone (eq .Values.api.db.driver "sqlite") }}
  # Recreate strategy for SQLite: the database is a single-writer store
  # on a ReadWriteOnce PVC. RollingUpdate would start a new pod before
  # terminating the old one, allowing two processes to compete for the
  # database file. The legacy adoption code would race the old writer,
  # risking corruption. Recreate ensures the old pod is fully gone first.
  strategy:
    type: Recreate
    # Explicit null, not omission: it states that this Deployment has no
    # rolling-update config, so nothing can merge one back in.
    #
    # It is NOT sufficient on its own to fix an upgrade from a release
    # that predates this stanza (<= 0.2.0-beta.5). Those shipped no
    # strategy at all, so the apiserver defaulted them to RollingUpdate
    # and materialized spec.strategy.rollingUpdate on the live object;
    # under server-side apply Helm does not own that field, so a null
    # here does not remove it and the apiserver rejects the Deployment
    # -- failing the entire `helm upgrade`. Clearing it is done by the
    # migrate-api-strategy initContainer in crd-apply-hook.yaml, which
    # runs pre-upgrade. Both halves are load-bearing; the e2e upgrade
    # test covers them.
    rollingUpdate: null
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameplane-api
        {{- include "gameplane.labels" . | nindent 8 }}
      {{- if not .Values.api.standalone }}
      annotations:
        checksum/mtls: {{ include "gameplane.mtlsChecksum" . }}
      {{- end }}
    spec:
      serviceAccountName: gameplane-api
      {{- if .Values.api.standalone }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        {{- if .Values.api.standalone }}
        # Avoid widening a generated 0600 key to 0660 on each PVC remount.
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ include "gameplane.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.api.standalone }}
            - --standalone
            - {{ printf "--panel-key-file=/keys/%s" ((.Values.api.panelKey | default dict).fileName | default "panel.key") | quote }}
            {{- with .Values.api.remoteAllowedCIDRs }}
            - {{ printf "--remote-allowed-cidrs=%s" (join "," .) | quote }}
            {{- end }}
            {{- if (.Values.api.panelKey | default dict).existingSecret }}
            - --panel-key-provisioned
            {{- end }}
            {{- end }}
            - --db-driver={{ .Values.api.db.driver }}
            - --db-dsn={{ .Values.api.db.dsn }}
            {{- if .Values.api.oidc.enabled }}
            - {{ printf "--oidc-issuer=%s" .Values.api.oidc.issuer | quote }}
            - {{ printf "--oidc-client-id=%s" .Values.api.oidc.clientID | quote }}
            - {{ printf "--oidc-redirect-url=%s" .Values.api.oidc.redirectURL | quote }}
            {{- if .Values.api.oidc.displayName }}
            - {{ printf "--oidc-display-name=%s" .Values.api.oidc.displayName | quote }}
            {{- end }}
            {{- if .Values.api.oidc.groupsClaim }}
            - {{ printf "--oidc-groups-claim=%s" .Values.api.oidc.groupsClaim | quote }}
            {{- end }}
            {{- if .Values.api.oidc.defaultRole }}
            - {{ printf "--oidc-default-role=%s" .Values.api.oidc.defaultRole | quote }}
            {{- end }}
            {{- if and .Values.api.oidc.roleMappings .Values.api.oidc.roleMappings.admin }}
            - {{ printf "--oidc-role-mapping-admin=%s" (join "," .Values.api.oidc.roleMappings.admin) | quote }}
            {{- end }}
            {{- if and .Values.api.oidc.roleMappings .Values.api.oidc.roleMappings.operator }}
            - {{ printf "--oidc-role-mapping-operator=%s" (join "," .Values.api.oidc.roleMappings.operator) | quote }}
            {{- end }}
            {{- if and .Values.api.oidc.roleMappings .Values.api.oidc.roleMappings.viewer }}
            - {{ printf "--oidc-role-mapping-viewer=%s" (join "," .Values.api.oidc.roleMappings.viewer) | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.api.standalone }}
            {{- if and .Values.operator.gameDataStorage .Values.operator.gameDataStorage.storageClassName }}
            - --game-data-storage-class={{ .Values.operator.gameDataStorage.storageClassName }}
            {{- end }}
            - --agent-ca-bundle=/etc/gameplane/agent-ca/ca.crt
            - --agent-client-cert=/etc/gameplane/agent-client/tls.crt
            - --agent-client-key=/etc/gameplane/agent-client/tls.key
            {{- end }}
            {{- if gt (int .Values.api.audit.retentionDays) 0 }}
            - --audit-retention-days={{ .Values.api.audit.retentionDays }}
            {{- end }}
            {{- if .Values.api.audit.stdout }}
            - --audit-stdout
            {{- end }}
            {{- $webhookURL := .Values.api.audit.webhook.url }}
            {{- if and (not $webhookURL) .Values.api.audit.webhook.syslogBridge.enabled }}
            {{- $webhookURL = printf "http://gameplane-audit-syslog-bridge.%s.svc:8514/" .Release.Namespace }}
            {{- end }}
            {{- if $webhookURL }}
            - --audit-webhook-url={{ $webhookURL }}
            {{- end }}
            {{- if .Values.api.audit.s3.endpoint }}
            - --audit-s3-endpoint={{ .Values.api.audit.s3.endpoint }}
            - --audit-s3-bucket={{ .Values.api.audit.s3.bucket }}
            {{- if .Values.api.audit.s3.prefix }}
            - --audit-s3-prefix={{ .Values.api.audit.s3.prefix }}
            {{- end }}
            {{- if .Values.api.audit.s3.region }}
            - --audit-s3-region={{ .Values.api.audit.s3.region }}
            {{- end }}
            {{- if .Values.api.audit.s3.insecure }}
            - --audit-s3-insecure
            {{- end }}
            {{- end }}
            {{- $telemetryURL := .Values.api.telemetry.endpoint }}
            {{- if and (not $telemetryURL) .Values.api.telemetry.receiver.enabled }}
            {{- $telemetryURL = printf "http://gameplane-telemetry-receiver.%s.svc:8080/ingest" .Release.Namespace }}
            {{- end }}
            {{- if $telemetryURL }}
            - --telemetry-endpoint={{ $telemetryURL }}
            {{- end }}
            {{- /*
            Spec 022 (F-214): enabled and interval are absent after `helm
            upgrade --reuse-values` from beta.8, so they are read through
            hasKey. enabled defaults to true; false is the hard off switch.
            */}}
            {{- $telemetry := .Values.api.telemetry }}
            {{- if not (ternary $telemetry.enabled true (hasKey $telemetry "enabled")) }}
            - --telemetry-disabled
            {{- end }}
            {{- if and (not .Values.api.standalone) .Values.defaultModuleSource.enabled }}
            - --official-module-source={{ .Values.defaultModuleSource.name | default "default" }}
            {{- end }}
            {{- /*
            An explicit updates.channel always wins. Otherwise derive it so
            the dashboard doesn't lie: "edge" when the images actually
            deployed track the rolling :edge build (image.tag=edge, or —
            when image.tag is left empty so it falls back to the chart's
            appVersion — an appVersion carrying the "edge" marker), "stable"
            for everything else, including versioned pre-releases (e.g.
            "0.2.0-beta.5") that went through the signed release pipeline.
            */}}
            {{- $channel := .Values.updates.channel }}
            {{- if not $channel }}
            {{- if or (eq .Values.image.tag "edge") (and (not .Values.image.tag) (contains "edge" .Chart.AppVersion)) }}
            {{- $channel = "edge" }}
            {{- else }}
            {{- $channel = "stable" }}
            {{- end }}
            {{- end }}
            - --update-channel={{ $channel }}
            - --trusted-proxies={{ .Values.api.trustedProxies }}
            - --metrics-addr=:{{ .Values.api.metricsPort | default 9090 }}
            {{- if and (not .Values.api.standalone) .Values.clusterOps.externalAddress }}
            - --cluster-external-address={{ .Values.clusterOps.externalAddress }}
            {{- end }}
          env:
            - name: GAMEPLANE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            {{- if and (not .Values.api.standalone) .Values.clusterOps.enabled }}
            - name: GAMEPLANE_CLUSTER_OPS
              value: "true"
            {{- end }}
            {{- if .Values.api.oidc.enabled }}
            - name: GAMEPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.oidc.clientSecretRef.name }}
                  key:  {{ .Values.api.oidc.clientSecretRef.key }}
            {{- end }}
            {{- if .Values.api.audit.webhook.authSecretRef.name }}
            - name: GAMEPLANE_AUDIT_WEBHOOK_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.audit.webhook.authSecretRef.name }}
                  key:  {{ .Values.api.audit.webhook.authSecretRef.key }}
            {{- end }}
            {{- if .Values.api.audit.s3.credentialsSecretRef.name }}
            - name: GAMEPLANE_AUDIT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.audit.s3.credentialsSecretRef.name }}
                  key:  {{ .Values.api.audit.s3.credentialsSecretRef.accessKeyKey }}
            - name: GAMEPLANE_AUDIT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.audit.s3.credentialsSecretRef.name }}
                  key:  {{ .Values.api.audit.s3.credentialsSecretRef.secretKeyKey }}
            {{- end }}
            {{- if and (not .Values.api.telemetry.endpoint) .Values.api.telemetry.receiver.enabled }}
            - name: GAMEPLANE_TELEMETRY_BUNDLED
              value: "true"
            {{- end }}
            {{- with (.Values.api.telemetry.interval | default "") }}
            - name: GAMEPLANE_TELEMETRY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.telemetry.authSecretRef.name }}
            - name: GAMEPLANE_TELEMETRY_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.telemetry.authSecretRef.name }}
                  key:  {{ .Values.api.telemetry.authSecretRef.key }}
            {{- end }}
            {{- /*
            `capture` may be absent entirely after `helm upgrade --reuse-values`
            from a chart that predates it (F-214). Guard presence of the block
            only, and use hasKey rather than `default` for the numeric fields so
            an explicit user-set 0 is preserved instead of being swapped for the
            fallback (`default` treats 0 as unset).
            */}}
            {{- $capture := .Values.capture | default dict }}
            - name: GAMEPLANE_CAPTURE_ENABLED
              value: {{ ($capture.enabled | default false) | quote }}
            - name: GAMEPLANE_CAPTURE_DEFAULT_RETENTION
              value: {{ (ternary $capture.defaultRetentionSeconds 86400 (hasKey $capture "defaultRetentionSeconds")) | int64 | quote }}
            - name: GAMEPLANE_CAPTURE_MAX_RETENTION
              value: {{ (ternary $capture.maxRetentionSeconds 604800 (hasKey $capture "maxRetentionSeconds")) | int64 | quote }}
            - name: GAMEPLANE_CAPTURE_DEFAULT_MAX_DURATION
              value: {{ $capture.defaultMaxDurationSeconds | default 0 | int64 | quote }}
            - name: GAMEPLANE_CAPTURE_DEFAULT_MAX_SIZE
              value: {{ $capture.defaultMaxSizeBytes | default 0 | int64 | quote }}
            - name: GAMEPLANE_LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
          ports:
            - { name: http,    containerPort: 8000 }
            - { name: metrics, containerPort: {{ .Values.api.metricsPort | default 9090 }} }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.api.standalone }}
            - name: panel-key
              mountPath: /keys
              {{- if (.Values.api.panelKey | default dict).existingSecret }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- if not .Values.api.standalone }}
            - { name: agent-ca, mountPath: /etc/gameplane/agent-ca, readOnly: true }
            - { name: agent-client, mountPath: /etc/gameplane/agent-client, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          {{- if or .Values.api.standalone (eq .Values.api.db.driver "sqlite") }}
          persistentVolumeClaim: { claimName: {{ .Values.api.storage.existingClaim | default "gameplane-api-data" }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.api.standalone }}
        {{- $panelKey := .Values.api.panelKey | default dict }}
        - name: panel-key
          {{- if $panelKey.existingSecret }}
          secret:
            secretName: {{ $panelKey.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ $panelKey.secretKey | default "panel.key" | quote }}
                path: {{ $panelKey.fileName | default "panel.key" | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ ($panelKey.storage | default dict).existingClaim | default "gameplane-api-key" | quote }}
          {{- end }}
        {{- else }}
        - name: agent-ca
          secret: { secretName: {{ .Values.api.agentMTLS.caSecretRef.name }} }
        - name: agent-client
          secret: { secretName: {{ .Values.api.agentMTLS.clientCertRef.name }} }
        {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gameplane-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gameplane-api
    {{- include "gameplane.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: gameplane-api }
  ports:
    - { name: http, port: 80, targetPort: http }
    # In-cluster scrape port for the ServiceMonitor. The Ingress and the web
    # front end route only to the http port.
    - { name: metrics, port: {{ .Values.api.metricsPort | default 9090 }}, targetPort: metrics }

{{- end }}
