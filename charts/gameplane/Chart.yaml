apiVersion: v2
name: gameplane
description: Kubernetes-native game server control panel (open-source alternative to CubeCoders AMP).
type: application
version: 0.3.0
appVersion: "0.3.0"
home: https://github.com/GameplanePanel/gameplane
sources:
  - https://github.com/GameplanePanel/gameplane
keywords:
  - game-server
  - minecraft
  - valheim
  - operator
  - control-panel
maintainers:
  - name: Gameplane contributors
dependencies:
  # Vendored locally so installs never fetch another chart. Helm resolves this
  # condition before installing native CRDs, including on a fresh cluster.
  - name: gameplane-crds
    version: 0.3.0
    condition: operator.enabled
