# Hand-maintained namespace-local Secret reads. Game namespace Secret reads
# and writes are in role_namespace.yaml. Duplicate this Role/RoleBinding into
# any distinct --control-plane-namespace, --agent-ca-secret-namespace or
# --module-namespace, and restart the operator after changing its flags.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gameplane-operator-secrets
  namespace: gameplane-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gameplane-operator-secrets
  namespace: gameplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gameplane-operator-secrets
subjects:
  - kind: ServiceAccount
    name: gameplane-operator
    namespace: gameplane-system
