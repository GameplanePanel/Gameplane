apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameplane-operator
  namespace: gameplane-system
  labels:
    app.kubernetes.io/name: gameplane-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gameplane-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameplane-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: gameplane-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/gameplanepanel/gameplane/operator:dev
          args:
            - "--leader-elect"
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
            # Operator -> agent mTLS material. Without these the operator
            # cannot talk to any agent sidecar (console, files, RCON,
            # heartbeats). The referenced Secrets must exist in this
            # namespace before the pod starts (see the volumes below) —
            # e.g. via `make dev-up`'s bootstrap or cert-manager in a real
            # cluster; this sample does not create them.
            - "--agent-ca-bundle=/etc/gameplane/agent-ca/ca.crt"
            - "--agent-client-cert=/etc/gameplane/agent-client/tls.crt"
            - "--agent-client-key=/etc/gameplane/agent-client/tls.key"
            - "--agent-ca-secret-name=gameplane-agent-ca"
            - "--agent-ca-secret-namespace=gameplane-system"
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: agent-ca, mountPath: /etc/gameplane/agent-ca, readOnly: true }
            - { name: agent-client, mountPath: /etc/gameplane/agent-client, readOnly: true }
      volumes:
        - name: agent-ca
          secret: { secretName: gameplane-agent-ca }
        - name: agent-client
          secret: { secretName: gameplane-agent-client }
      terminationGracePeriodSeconds: 30
