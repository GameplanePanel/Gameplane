openapi: 3.1.0
info:
  title: Gameplane Agent
  version: 1.0.0
  description: |
    HTTP API served by the Gameplane agent sidecar inside every game pod.
    This contract is consumed by the Gameplane API gateway, which proxies
    authenticated dashboard traffic through to the agent.

    Auth: all /files, /logs, /console, /players routes require either
    (a) an mTLS client cert signed by the operator's CA, or (b) a
    shared-secret bearer token mounted from a per-pod Secret. The /healthz
    endpoint on this same listener is unauthenticated.

    Prometheus metrics are not served on this listener at all: /metrics
    is exposed on a separate, plain (no TLS, no client cert, no bearer
    token) HTTP listener on its own port — see the `/metrics` path below
    for that listener's own `servers` entry. Nothing else is routed there;
    a scraper never needs the mTLS client cert that unlocks the control
    routes described above.

servers:
  - url: https://{pod}.{namespace}.svc.cluster.local:8090
    variables:
      pod:        { default: "<gameserver-pod-0>" }
      namespace:  { default: "gameplane-games" }

security:
  - mtls: []
  - bearer: []

components:
  securitySchemes:
    mtls:
      type: mutualTLS
    bearer:
      type: http
      scheme: bearer
  schemas:
    FileEntry:
      type: object
      required: [name, path, size, mode, dir, modTime]
      properties:
        name:    { type: string }
        path:    { type: string, description: "Path relative to /data" }
        size:    { type: integer, format: int64 }
        mode:    { type: string }
        dir:     { type: boolean }
        modTime: { type: string, format: date-time }
    Players:
      type: object
      required: [online, max, players, asOf, capabilities]
      properties:
        online:
          type: integer
          description: >-
            Current online player count, or -1 when unknown (RCON disabled,
            or no recognized player-list format for this game). -1 is the
            sole "unknown" sentinel; it is never combined with real counts.
        max:
          type: integer
          description: -1 when unknown, for the same reasons as `online`.
        players: { type: array, items: { type: string } }
        asOf:    { type: string, format: date-time }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
    Capabilities:
      type: object
      required: [kick, ban, unban, whitelist]
      description: |
        Per-game moderation capabilities. False entries indicate the
        underlying game protocol does not expose that action via RCON,
        so the dashboard hides the corresponding controls instead of
        emitting requests that would 501.
      properties:
        kick:      { type: boolean }
        ban:       { type: boolean }
        unban:     { type: boolean }
        whitelist: { type: boolean }
    BannedPlayer:
      type: object
      required: [name]
      properties:
        name:   { type: string }
        reason: { type: string }
        source: { type: string, description: "Who issued the ban (e.g. 'Server' or an op username)" }
    ModerationRequest:
      type: object
      required: [name]
      properties:
        name:   { type: string, description: "1-32 chars [A-Za-z0-9_]" }
        reason: { type: string, description: "Optional; truncated to 256 bytes. Rejected with 400 if it contains an ASCII control character or a shell/RCON metacharacter (semicolon, ampersand, pipe, dollar, backtick, backslash, double or single quote), per gameaction.CheckText" }
    ModerationResponse:
      type: object
      required: [ok]
      properties:
        ok:  { type: boolean }
        raw: { type: string, description: "Raw RCON response, useful for surfacing in the UI" }
    ConsoleEnvelope:
      type: object
      required: [kind, body]
      properties:
        kind:
          type: string
          enum: [cmd, out, err]
          description: |
            "cmd" on client-to-server; "out" on server-to-client for
            successful RCON responses; "err" on server-to-client for
            failures.
        body: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }
  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        Served only on the agent's separate plain metrics listener
        (`--metrics-addr`, default `:9090`), not on the mTLS control
        listener (`--addr`, default `:8090`) that every other path in
        this contract lives on. This listener carries no TLS and no
        auth of any kind — it serves nothing but this one path.
      servers:
        - url: http://{pod}.{namespace}.svc.cluster.local:9090
          variables:
            pod:        { default: "<gameserver-pod-0>" }
            namespace:  { default: "gameplane-games" }
      security: []
      responses:
        "200": { description: Metrics exposition }

  /files/list:
    get:
      summary: List directory entries
      parameters:
        - in: query
          name: path
          schema: { type: string, default: "/" }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileEntry" }
  /files/read:
    get:
      summary: Read a file inline (small files only)
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: File content }
        "413": { description: File too large — use /files/download }
  '/files/archive':
    parameters:
      - in: query
        name: path
        required: true
        style: form
        explode: true
        schema: { type: array, items: { type: string }, minItems: 1, maxItems: 256 }
    get:
      summary: Download selected paths as a ZIP
      responses:
        '200': { description: Completed ZIP, content: { application/zip: { schema: { type: string, format: binary } } } }
        '400': { description: Invalid or protected selection }
        '404': { description: A selected path does not exist }
        '409': { description: Another archive is running }
        '413': { description: Archive limit exceeded }
    post:
      summary: Create a ZIP on the server
      parameters:
        - in: query
          name: dest
          required: true
          schema: { type: string }
      responses:
        '201': { description: Archive created }
        '400': { description: Invalid destination or selection }
        '404': { description: A selected path does not exist }
        '409': { description: Destination exists or another archive is running }
        '413': { description: Archive limit exceeded }
  /files/download:
    get:
      summary: Download a file as an attachment
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: File content }
  /files/write:
    post:
      summary: Overwrite or create a file
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: OK }
  /files/upload:
    post:
      summary: Upload one or more files to a directory
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "204": { description: OK }
  /files/mkdir:
    post:
      summary: Create a directory (recursive)
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: OK }
  /files/delete:
    delete:
      summary: Delete a file or directory
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: recursive
          schema: { type: boolean, default: false }
      responses:
        "204": { description: OK }
        "400": { description: Refusing to delete root or invalid request }

  /logs/history:
    get:
      summary: Read the preceding page of the configured log file
      parameters:
        - in: query
          name: before
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Up to 100 lines and 64 KiB of text, with an optional cursor for the preceding page
        "400": { description: Invalid cursor }
        "404": { description: File unavailable }
        "409": { description: File replaced or truncated }
  /logs/tail:
    get:
      summary: Tail the game container log over WebSocket (text frames per line)
      parameters:
        - in: query
          name: from
          schema: { type: string, enum: [end, start], default: end }
      responses:
        "101": { description: Switching Protocols }

  /players:
    get:
      summary: Current online player count and names
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Players" }
  /players/kick:
    post:
      summary: Kick a player (capability-gated; 501 when unsupported)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "200":
          description: Kicked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationResponse" }
        "400": { description: Invalid name or reason }
        "501": { description: Not supported by this game }
        "502": { description: Upstream RCON unavailable }
  /players/ban:
    post:
      summary: Ban a player (capability-gated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "200":
          description: Banned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationResponse" }
        "400": { description: Invalid name or reason }
        "501": { description: Not supported by this game }
        "502": { description: Upstream RCON unavailable }
  /players/unban:
    post:
      summary: Lift a ban on a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Unbanned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationResponse" }
        "400": { description: Invalid name }
        "501": { description: Not supported by this game }
        "502": { description: Upstream RCON unavailable }
  /players/banned:
    get:
      summary: Currently banned players
      description: |
        Returns an empty array when the underlying game doesn't support
        a banlist query — capabilities advertise the truth so the UI
        can hide the section if all moderation actions are unsupported.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BannedPlayer" }
        "502": { description: Upstream RCON unavailable }

  /console:
    get:
      summary: Duplex console over WebSocket (JSON envelopes)
      description: |
        Client writes ConsoleEnvelope with kind="cmd"; server replies
        with kind="out" (success) or kind="err" (RCON failure).
      responses:
        "101": { description: Switching Protocols }

  /quiesce:
    post:
      summary: Pause writes to the data volume before a snapshot
      description: |
        Asks the agent to flush in-memory game state to disk and stop
        further auto-saves until /unquiesce is called. For Minecraft
        this issues `save-off` followed by `save-all flush` over RCON.

        Games without a quiesce equivalent (Valheim, Factorio, etc.)
        return 200 with `quiesced: false` and a human-readable reason.
        Callers should treat that as success-with-degradation, not as
        an error — backups must still proceed.
      responses:
        "200":
          description: Quiesce attempted
          content:
            application/json:
              schema:
                type: object
                required: [quiesced]
                properties:
                  quiesced: { type: boolean }
                  reason:   { type: string }
        "502": { description: RCON unavailable; auto-save was rolled back where possible }
  /unquiesce:
    post:
      summary: Resume writes after a snapshot
      description: |
        Reverses the most recent /quiesce. For Minecraft this issues
        `save-on`. Calling on an unsupported game is a no-op.
      responses:
        "200":
          description: Unquiesce attempted
          content:
            application/json:
              schema:
                type: object
                required: [quiesced]
                properties:
                  quiesced: { type: boolean, description: "false on success" }
                  reason:   { type: string }
        "502": { description: RCON unavailable; the game may still be quiesced — retry }

  /v2/pods/{uid}/identity:
    parameters:
      - &podUID
        name: uid
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Verify the pod UID and availability of the verified backup protocol
      responses:
        "204":
          description: Matching pod UID
          headers:
            Gameplane-Backup-Mode:
              description: Present for a checkpoint that leaves writes enabled
              schema: { type: string, enum: [flush-only] }
        "404": { description: Missing or mismatched pod UID }
  /v2/pods/{uid}/flush:
    parameters: [*podUID]
    post:
      summary: Checkpoint the running game while writes stay enabled
      responses:
        "200":
          description: The game acknowledged its checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [outcome, quiesced]
                properties:
                  outcome: { type: string, enum: [flushed] }
                  quiesced: { type: boolean, enum: [false] }
        "404": { description: Missing adapter or mismatched pod UID }
        "502": { description: The game did not acknowledge the checkpoint }
  /v2/pods/{uid}/quiesce:
    parameters: [*podUID]
    post:
      summary: Pause with verified game command replies
      responses:
        "200":
          description: Paused or unsupported
          content:
            application/json:
              schema:
                type: object
                required: [outcome, quiesced]
                properties:
                  outcome: { type: string, enum: [paused, unsupported] }
                  quiesced: { type: boolean, description: "true only when paused" }
                  reason: { type: string }
        "502": { description: Transport failure or unacknowledged command }
        "404": { description: Missing or mismatched pod UID }
  /v2/pods/{uid}/unquiesce:
    parameters: [*podUID]
    post:
      summary: Resume with verified game command replies
      responses:
        "200":
          description: Only resumed confirms completion of cleanup
          content:
            application/json:
              schema:
                type: object
                required: [outcome, quiesced]
                properties:
                  outcome: { type: string, enum: [resumed, unsupported] }
                  quiesced: { type: boolean, enum: [false] }
                  reason: { type: string }
        "502": { description: Transport failure or unacknowledged command }
        "404": { description: Missing or mismatched pod UID }
