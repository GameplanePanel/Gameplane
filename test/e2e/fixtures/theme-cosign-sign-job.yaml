# Signs the e2e theme e2e-theme-signed:0.1.0 in the in-cluster test registry
# for TestAPI_ThemeMarketplaceLifecycle (spec 043). Same pattern as
# cosign-sign-job.yaml, with its own names so it never touches the module
# test's keypair Secret or Job: the init container generates an ECDSA key pair
# into the Secret gameplane-system/e2e-theme-sign-keypair (cosign.key,
# cosign.pub, cosign.password), and the main container signs keyed and offline.
# The test reads cosign.pub from that Secret and sets it as the theme source's
# verify key. e2e-theme-unsigned is never signed.
#
# backoffLimit 0 / restartPolicy Never: one pod attempt, so generate-key-pair
# never races a Secret it already created. The test deletes this Job and the
# keypair Secret before each apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-theme-cosign-signer
  namespace: gameplane-system
  labels:
    app.kubernetes.io/component: e2e-fixture
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-theme-cosign-signer
  namespace: gameplane-system
  labels:
    app.kubernetes.io/component: e2e-fixture
rules:
  # generate-key-pair k8s://... creates the keypair Secret; signing reads it.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-theme-cosign-signer
  namespace: gameplane-system
  labels:
    app.kubernetes.io/component: e2e-fixture
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-theme-cosign-signer
subjects:
  - kind: ServiceAccount
    name: e2e-theme-cosign-signer
    namespace: gameplane-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-theme-cosign-sign
  namespace: gameplane-system
  labels:
    app.kubernetes.io/component: e2e-fixture
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: e2e-fixture
    spec:
      restartPolicy: Never
      serviceAccountName: e2e-theme-cosign-signer
      initContainers:
        - name: keygen
          image: ghcr.io/sigstore/cosign/cosign:v3.1.2
          args:
            - generate-key-pair
            - k8s://gameplane-system/e2e-theme-sign-keypair
          env:
            - { name: COSIGN_PASSWORD, value: "e2e-pass" }
            - { name: COSIGN_YES, value: "true" }
            - { name: HOME, value: /tmp }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: sign
          image: ghcr.io/sigstore/cosign/cosign:v3.1.2
          args:
            - sign
            - --key=k8s://gameplane-system/e2e-theme-sign-keypair
            # Same flags as cosign-sign-job.yaml (classic .sig, no tlog, plain
            # HTTP registry); see that file for why each one is needed.
            - --new-bundle-format=false
            - --use-signing-config=false
            - --tlog-upload=false
            - --allow-http-registry
            - --allow-insecure-registry
            - --yes
            - gameplane-test-registry.gameplane-system.svc:5000/e2e-themes/e2e-theme-signed:0.1.0
          env:
            - { name: COSIGN_PASSWORD, value: "e2e-pass" }
            - { name: COSIGN_YES, value: "true" }
            - { name: HOME, value: /tmp }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
