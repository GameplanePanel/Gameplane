# Spec 019 T062: a webhook receiver for the notification-sink e2e test
# (TestAPI_I18n_NotifyLanguage). busybox httpd serves one CGI script that
# appends each request's query string and JSON body to /tmp/hooks.log and
# answers 204, so a successful test-send implies the log line was written.
# The test reads the log with `kubectl exec ... cat /tmp/hooks.log`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-notify-sink-cgi
  namespace: gameplane-system
data:
  hook: |
    #!/bin/sh
    set -eu
    printf '%s\t%s\tstart\t%s\n' "$(date -u +%FT%TZ)" "$QUERY_STRING" "${CONTENT_LENGTH:-0}" >> /tmp/requests.log
    body=$(head -c "${CONTENT_LENGTH:-0}")
    printf '%s\t%s\n' "$QUERY_STRING" "$body" >> /tmp/hooks.log
    printf '%s\t%s\tbody-read\n' "$(date -u +%FT%TZ)" "$QUERY_STRING" >> /tmp/requests.log
    printf 'Status: 204 No Content\r\n\r\n'
    printf '%s\t%s\tresponse-written\n' "$(date -u +%FT%TZ)" "$QUERY_STRING" >> /tmp/requests.log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-notify-sink
  namespace: gameplane-system
  labels: { app.kubernetes.io/name: e2e-notify-sink }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: e2e-notify-sink }
  template:
    metadata:
      labels: { app.kubernetes.io/name: e2e-notify-sink }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sink
          # Same pinned tag the other e2e fixtures use (oras-push-job.yaml).
          image: busybox:1.36
          command: ["busybox", "httpd", "-f", "-p", "8080", "-h", "/www"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
          volumeMounts:
            - { name: cgi, mountPath: /www/cgi-bin, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: cgi
          configMap: { name: e2e-notify-sink-cgi, defaultMode: 0755 }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-notify-sink
  namespace: gameplane-system
spec:
  selector: { app.kubernetes.io/name: e2e-notify-sink }
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
