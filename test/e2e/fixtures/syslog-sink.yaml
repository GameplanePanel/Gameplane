# Spec 013 T045: a syslog collector for the optional-components bucket
# (TestOptionalComponents_Lifecycle). socat accepts TCP on 514 and copies
# every received byte to /tmp/syslog.log, which the test reads with
# `kubectl exec … cat`. Not stdout: the bridge frames TCP records with octet
# counting and no trailing newline, and the container runtime holds back a
# log line until its newline arrives, so the records never reach
# `kubectl logs`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-syslog-sink
  namespace: gameplane-system
  labels: { app.kubernetes.io/name: e2e-syslog-sink }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: e2e-syslog-sink }
  template:
    metadata:
      labels: { app.kubernetes.io/name: e2e-syslog-sink }
    spec:
      containers:
        - name: sink
          # alpine/socat:1.8.0.3 (multi-arch index digest)
          image: alpine/socat@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
          args: ["-u", "TCP-LISTEN:514,fork,reuseaddr", "OPEN:/tmp/syslog.log,creat,append"]
          # socat listens on 514, so it keeps root with only NET_BIND_SERVICE.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          ports:
            - { name: syslog, containerPort: 514, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: syslog }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-syslog-sink
  namespace: gameplane-system
spec:
  selector: { app.kubernetes.io/name: e2e-syslog-sink }
  ports:
    - { name: syslog, port: 514, targetPort: syslog, protocol: TCP }
