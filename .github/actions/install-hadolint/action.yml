name: install hadolint
description: >-
  Download the pinned hadolint release, verify its checksum and put it on PATH.
  Used by ci.yaml workflow-lint and by go-component.yaml for the split components.

runs:
  using: composite
  steps:
    - name: hadolint (download and verify)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/hadolint"
        cd "$RUNNER_TEMP/hadolint"
        curl -fsSL -o hadolint \
          https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
        echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  hadolint" | sha256sum -c -
        chmod +x hadolint
        echo "$RUNNER_TEMP/hadolint" >> "$GITHUB_PATH"
