name: build e2e images
description: >
  Build the operator/api/agent/sentinel/capture-sidecar/telemetry-receiver/fakeoidc (+ gameprobe)
  images the kind e2e suites load into the cluster, tagged
  gameplane-test/<component>:e2e exactly like make e2e-images, via buildx bake
  — then `docker save` all eight into a single tar uploaded as an artifact
  (e2e-images-<arch>). The heavy e2e jobs load that tar instead of each
  recompiling the same binaries. This is the ONLY builder, so it always writes
  the layer cache back (the old single-writer export dance is gone).
inputs:
  arch:
    description: Architecture label for the artifact name (amd64 or arm64).
    required: false
    default: amd64
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
    - name: bake e2e images (operator/api/agent/sentinel/capture-sidecar/telemetry-receiver/fakeoidc)
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      with:
        files: containers/docker-bake.hcl
        targets: e2e
        load: true
        set: |
          e2e-operator.cache-from=type=gha,scope=e2e-operator-${{ inputs.arch }}
          e2e-api.cache-from=type=gha,scope=e2e-api-${{ inputs.arch }}
          e2e-agent.cache-from=type=gha,scope=e2e-agent-${{ inputs.arch }}
          e2e-sentinel.cache-from=type=gha,scope=e2e-sentinel-${{ inputs.arch }}
          e2e-capture-sidecar.cache-from=type=gha,scope=e2e-capture-sidecar-${{ inputs.arch }}
          e2e-telemetry-receiver.cache-from=type=gha,scope=e2e-telemetry-receiver-${{ inputs.arch }}
          e2e-fakeoidc.cache-from=type=gha,scope=e2e-fakeoidc-${{ inputs.arch }}
          e2e-operator.cache-to=type=gha,mode=max,scope=e2e-operator-${{ inputs.arch }}
          e2e-api.cache-to=type=gha,mode=max,scope=e2e-api-${{ inputs.arch }}
          e2e-agent.cache-to=type=gha,mode=max,scope=e2e-agent-${{ inputs.arch }}
          e2e-sentinel.cache-to=type=gha,mode=max,scope=e2e-sentinel-${{ inputs.arch }}
          e2e-capture-sidecar.cache-to=type=gha,mode=max,scope=e2e-capture-sidecar-${{ inputs.arch }}
          e2e-telemetry-receiver.cache-to=type=gha,mode=max,scope=e2e-telemetry-receiver-${{ inputs.arch }}
          e2e-fakeoidc.cache-to=type=gha,mode=max,scope=e2e-fakeoidc-${{ inputs.arch }}
    - name: bake gameprobe image
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      with:
        files: containers/docker-bake.hcl
        targets: e2e-gameprobe
        load: true
        set: |
          e2e-gameprobe.cache-from=type=gha,scope=e2e-gameprobe-${{ inputs.arch }}
          e2e-gameprobe.cache-to=type=gha,mode=max,scope=e2e-gameprobe-${{ inputs.arch }}
    - name: save images to a single tar
      shell: bash
      run: |
        docker save \
          gameplane-test/operator:e2e \
          gameplane-test/api:e2e \
          gameplane-test/agent:e2e \
          gameplane-test/sentinel:e2e \
          gameplane-test/capture-sidecar:e2e \
          gameplane-test/telemetry-receiver:e2e \
          gameplane-test/fakeoidc:e2e \
          gameplane-test/gameprobe:e2e \
          -o "$RUNNER_TEMP/e2e-images.tar"
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: e2e-images-${{ inputs.arch }}
        path: ${{ runner.temp }}/e2e-images.tar
        retention-days: 1
