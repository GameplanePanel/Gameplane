name: go module + build cache
description: Cache workspace dependencies separately from per-job Go build artifacts.

inputs:
  key-suffix:
    description: >-
      Suffix for the cache key, e.g. "lint-operator" or "e2e". Callers interpolate
      their own matrix values; this file must not, since composite actions have no
      matrix context and an expression here fails the whole action at load time.
    required: true
  go-version:
    description: Go version to setup
    required: false
    default: '1.26'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: go
      with:
        go-version: ${{ inputs.go-version }}
        # Resolve '1.26' to the newest 1.26.x patch instead of the runner's
        # preinstalled one, so stdlib fixes (spec 013 G1, govulncheck) land
        # without a manual pin bump.
        check-latest: true
        cache: false
    - name: Go dependency cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-v2-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.mod', '**/go.sum', 'go.work', 'go.work.sum') }}
        restore-keys: |
          go-mod-v2-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
    - name: Go build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        # A source change creates a new entry; exact dependency-only keys kept
        # restoring the first build forever. Include the resolved Go version,
        # architecture and job flags (key-suffix) before falling back.
        key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.key-suffix }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', 'go.work', 'go.work.sum', '.golangci.yml') }}
        restore-keys: |
          go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.key-suffix }}-
