name: build game images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - containers/**
      - .github/workflows/images.yaml
  push:
    branches:
      - master
    paths:
      - containers/**
      - .github/workflows/images.yaml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 1: Build and push the shared SteamCMD base image.
  # Game images depend on this digest via build args, so it must be built first.
  common-base:
    name: build & push common base images
    runs-on: ubuntu-latest
    timeout-minutes: 10 # extension per D-A, pending maintainer confirmation
    permissions:
      contents: read
      packages: write
    # Publishing runs hold the signing key through this environment, whose
    # deployment policy admits only master and v* tags (repository settings).
    # Pull-request runs only build, so they take no environment.
    environment: ${{ github.event_name != 'pull_request' && 'release-signing' || '' }}
    strategy:
      matrix:
        include:
          - base: steamcmd
    outputs:
      # Pass the steamcmd base digest to downstream game jobs via ${{ needs.common-base.outputs.steamcmd-digest }}
      # On PRs, digest is empty and game job uses the local tag instead.
      steamcmd-digest: ${{ steps.build.outputs.digest }}
      steamcmd-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Signing is mandatory when publishing to a registry: fail before anything
      # is pushed. Skipped on PRs, which never publish.
      - if: github.event_name != 'pull_request'
        name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for image publishing"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Login only when pushing to registry; skip on PRs to avoid unnecessary token operations.
      # Fork PRs have read-only GITHUB_TOKEN anyway, so login would fail confusingly.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI references must be lowercase; github.repository_owner keeps the
      # account's original casing, so fold it down for the by-digest push.
      - id: image
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner_lc}/gameplane/common-${{ matrix.base }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gameplane/common-${{ matrix.base }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/common/${{ matrix.base }}
          # Common base images support both architectures (Ubuntu 26.04 LTS-based).
          platforms: linux/amd64,linux/arm64
          # On PRs: validate multi-platform coverage without loading/pushing (buildx still fully builds).
          # On master: push by digest only. The tags are attached after the
          # digest is signed and verified, so a tag only ever names a signed image.
          push: false
          load: false
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
      - if: github.event_name != 'pull_request'
        name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - if: github.event_name != 'pull_request'
        name: refresh sigstore trust root
        run: cosign initialize
      - if: github.event_name != 'pull_request'
        name: sign image (keyed, logged)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner_lc}/gameplane/common-${{ matrix.base }}@${DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
                --new-bundle-format=false --use-signing-config=false "$ref"; then
              exit 0
            fi
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts (Rekor unavailable?)"
          exit 1
      - if: github.event_name != 'pull_request'
        name: verify signature & check published key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --new-bundle-format=false \
            "ghcr.io/${owner_lc}/gameplane/common-${{ matrix.base }}@${DIGEST}"
          if [ -f signing/cosign.pub ] && ! cmp -s signing/cosign.pub "$RUNNER_TEMP/cosign.pub"; then
            echo "::error::committed signing/cosign.pub does not match COSIGN_PRIVATE_KEY — update the published key"
            exit 1
          fi
      # Attach the tags only now that the digest carries a verified signature.
      # `oras tag` points each tag at the existing manifest without rewriting
      # it; the loop confirms every tag resolves to the signed digest.
      - if: github.event_name != 'pull_request'
        name: install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - if: github.event_name != 'pull_request'
        name: attach tags to the signed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$META_TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no tags were computed for ${IMAGE}"
            exit 1
          fi
          tags=()
          for r in "${refs[@]}"; do
            if [ "${r%:*}" != "$IMAGE" ]; then
              echo "::error::${r} is not a tag of ${IMAGE}"
              exit 1
            fi
            tags+=("${r##*:}")
          done
          oras tag "${IMAGE}@${DIGEST}" "${tags[@]}"
          for t in "${tags[@]}"; do
            got="$(oras resolve "${IMAGE}:${t}")"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${IMAGE}:${t} resolves to ${got}, not the signed digest ${DIGEST}"
              exit 1
            fi
          done
      - if: github.event_name != 'pull_request'
        name: record base digest
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "**Common Base Images**"
            echo ""
            echo "SteamCMD base digest (pin this in game Dockerfiles):"
            echo "\`\`\`"
            echo "ghcr.io/${owner_lc}/gameplane/common-steamcmd@${{ steps.build.outputs.digest }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stage 2: Build game-specific images that depend on the common base.
  # Each game image is a separate matrix entry and receives the base digest or tag via build args.
  # On PRs, the base must be built in this job to ensure it exists in the local daemon.
  # On master, it's already pushed to the registry and referenced via its immutable digest.
  game-images:
    name: build & push game images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Same signing environment as common-base; pull-request runs take none.
    environment: ${{ github.event_name != 'pull_request' && 'release-signing' || '' }}
    needs: common-base
    strategy:
      matrix:
        include:
          - game: nuclear-option
            context: containers/games/nuclear-option
          - game: squad
            context: containers/games/squad
          - game: the-isle
            context: containers/games/the-isle
          - game: ark-survival-evolved
            context: containers/games/ark-survival-evolved
          - game: mount-and-blade-2-bannerlord
            context: containers/games/mount-and-blade-2-bannerlord
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Signing is mandatory when publishing to a registry: fail before anything
      # is pushed. Skipped on PRs, which never publish.
      - if: github.event_name != 'pull_request'
        name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for image publishing"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Login only when pushing to registry; skip on PRs to avoid unnecessary token operations.
      # Fork PRs have read-only GITHUB_TOKEN anyway, so login would fail confusingly.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner-lowercase
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${owner_lc}" >> "$GITHUB_OUTPUT"
      # On PRs, build the base image and export as OCI layout.
      # The buildx builder is isolated (docker-container driver), so it cannot read from the Docker daemon.
      # We export to OCI format and pass it as a named context to the game build via oci-layout:// URI.
      # On master, the base is already pushed to the registry and we reference it via digest instead.
      # Build amd64 only (game binary is x86_64-only; loading multi-platform is not supported).
      - if: github.event_name == 'pull_request'
        id: build-base-pr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/common/steamcmd
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=/tmp/steamcmd-base-oci.tar
          build-args: |
            VERSION=dev
      # On PRs only: unpack the OCI layout so it can be passed as a named context to the game build.
      - if: github.event_name == 'pull_request'
        name: unpack base OCI layout
        run: |
          mkdir -p /tmp/steamcmd-base
          tar -xf /tmp/steamcmd-base-oci.tar -C /tmp/steamcmd-base
      - id: base-tag
        # On PR: use the named context from the OCI layout built above. On master: use the pushed digest.
        env:
          OWNER: ${{ steps.owner-lowercase.outputs.name }}
          DIGEST: ${{ needs.common-base.outputs.steamcmd-digest }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$DIGEST" ]; then
            # PR: use the named context (resolved via oci-layout:// URI passed to buildx).
            base_image="gameplane-steamcmd-base:pr"
            # Named context tells buildx where to find the base image built in this job.
            # The buildx builder cannot read from the Docker daemon, so we pass the OCI layout.
            build_contexts="gameplane-steamcmd-base:pr=oci-layout:///tmp/steamcmd-base"
          else
            # Master: digest is available from the pushed base image (immutable pinning).
            # No named context needed; FROM resolves directly in the registry.
            base_image="ghcr.io/${OWNER}/gameplane/common-steamcmd@${DIGEST}"
            build_contexts=""
          fi
          {
            echo "image=${base_image}"
            echo "build-contexts=${build_contexts}"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gameplane/${{ matrix.game }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          # Game server binaries are x86_64 only (e.g., Unity runtime for Nuclear Option).
          # ARM64 support would require game-specific work (native builds or compatibility layers).
          platforms: linux/amd64
          # On PRs: just validate the build (no load, no push). On master: push by
          # digest only. The tags are attached after the digest is signed and
          # verified, so a tag only ever names a signed image.
          push: false
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name=ghcr.io/{0}/gameplane/{1},push-by-digest=true,name-canonical=true,push=true', steps.owner-lowercase.outputs.name, matrix.game) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            STEAMCMD_BASE_IMAGE=${{ steps.base-tag.outputs.image }}
          # On PRs: pass the base OCI layout as a named context so buildx can resolve it.
          # On master: build-contexts is empty (base is resolved from registry digest).
          build-contexts: ${{ steps.base-tag.outputs.build-contexts }}
      - if: github.event_name != 'pull_request'
        name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - if: github.event_name != 'pull_request'
        name: refresh sigstore trust root
        run: cosign initialize
      - if: github.event_name != 'pull_request'
        name: sign image (keyed, logged)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner_lc}/gameplane/${{ matrix.game }}@${DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
                --new-bundle-format=false --use-signing-config=false "$ref"; then
              exit 0
            fi
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts (Rekor unavailable?)"
          exit 1
      - if: github.event_name != 'pull_request'
        name: verify signature & check published key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --new-bundle-format=false \
            "ghcr.io/${owner_lc}/gameplane/${{ matrix.game }}@${DIGEST}"
          if [ -f signing/cosign.pub ] && ! cmp -s signing/cosign.pub "$RUNNER_TEMP/cosign.pub"; then
            echo "::error::committed signing/cosign.pub does not match COSIGN_PRIVATE_KEY — update the published key"
            exit 1
          fi
      # Attach the tags only now that the digest carries a verified signature.
      # `oras tag` points each tag at the existing manifest without rewriting
      # it; the loop confirms every tag resolves to the signed digest.
      - if: github.event_name != 'pull_request'
        name: install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - if: github.event_name != 'pull_request'
        name: attach tags to the signed digest
        env:
          IMAGE: ghcr.io/${{ steps.owner-lowercase.outputs.name }}/gameplane/${{ matrix.game }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$META_TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no tags were computed for ${IMAGE}"
            exit 1
          fi
          tags=()
          for r in "${refs[@]}"; do
            if [ "${r%:*}" != "$IMAGE" ]; then
              echo "::error::${r} is not a tag of ${IMAGE}"
              exit 1
            fi
            tags+=("${r##*:}")
          done
          oras tag "${IMAGE}@${DIGEST}" "${tags[@]}"
          for t in "${tags[@]}"; do
            got="$(oras resolve "${IMAGE}:${t}")"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${IMAGE}:${t} resolves to ${got}, not the signed digest ${DIGEST}"
              exit 1
            fi
          done
      - if: github.event_name != 'pull_request'
        name: record game image digest
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "**Game Images**"
            echo ""
            echo "${{ matrix.game }} image digest (pin this in module template.yaml):"
            echo "\`\`\`"
            echo "ghcr.io/${owner_lc}/gameplane/${{ matrix.game }}@${{ steps.build.outputs.digest }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
