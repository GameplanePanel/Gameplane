name: published release qualification

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published Gameplane version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: verify published chart and images
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: 'v3.1.2'
      - name: verify, install and upgrade using published chart and images
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash deploy/kind/qualify-published-release.sh "$RELEASE_TAG"
