name: published release qualification

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published Gameplane version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: verify published chart and images
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.2'
      - name: verify, install and upgrade using published chart and images
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash deploy/kind/qualify-published-release.sh "$RELEASE_TAG"
