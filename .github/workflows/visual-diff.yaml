name: visual regression

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'assets/design-export/**'
      - '.github/workflows/visual-diff.yaml'
  pull_request:
    paths:
      - 'web/**'
      - 'assets/design-export/**'
      - '.github/workflows/visual-diff.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-diff:
    name: design vs browser visual diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: capture browser screenshots
        run: npm run screenshots:design

      - name: compare design baseline vs browser captures
        if: always()
        run: npm run diff:screenshots -- --check-expected

      - name: upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff-report
          path: web/test-results/visual-diff
          retention-days: 14
          if-no-files-found: warn

      - name: upload original browser captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshot-captures
          path: web/e2e/screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
