name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  images:
    name: build & push images
    runs-on: ubuntu-latest
    # Go stages cross-compile (FROM --platform=$BUILDPLATFORM), so a component
    # normally builds in a few minutes; the margin covers a cold cache.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # The signing key is held by this environment, whose deployment policy
    # admits only master and v* tags (repository settings).
    environment: release-signing
    strategy:
      # A failing leg must not cancel the other legs part-way through a publish.
      fail-fast: false
      matrix:
        include:
          - component: operator
          - component: api
          - component: web
          - component: agent
          - component: audit-syslog-bridge
          - component: telemetry-receiver
          - component: sentinel
          - component: capture-sidecar
          - component: mcp-server
          - component: tunnel-frp
            dockerfile: tunnel/Dockerfile.frp
          - component: tunnel-tailscale
            dockerfile: tunnel/Dockerfile.tailscale
          - component: tunnel-playit
            dockerfile: tunnel/Dockerfile.playit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Signing is mandatory for an official release: fail before anything is
      # pushed rather than publish unsigned images. Mirrors publish-edge.yaml.
      - name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for official image publishing"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI references must be lowercase; github.repository_owner keeps the
      # account's original casing, so fold it down for the by-digest push.
      - id: image
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner_lc}/gameplane/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Images live UNDER the gameplane/ path segment so they match the
          # chart's default image.registry (ghcr.io/<owner>/gameplane) and the
          # Makefile REGISTRY. metadata-action lowercases the owner for us.
          images: ghcr.io/${{ github.repository_owner }}/gameplane/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Push by digest only. The release tags are attached after the digest is
      # signed and verified (last step), so a tag only ever names a signed image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.component) }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      # Refresh the Sigstore TUF trust root before signing (see publish-edge.yaml).
      - name: refresh sigstore trust root
        run: cosign initialize
      # Keyed-sign the released image by digest AND record it in the public Rekor
      # transparency log. --new-bundle-format=false --use-signing-config=false
      # selects the classic path (hashedrekord against rekor.sigstore.dev, no
      # TSA) — the format existing cosign clients and the operator's cosign/v2
      # verifier read. See publish-edge.yaml for the full rationale.
      - name: sign image (keyed, logged)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner_lc}/gameplane/${{ matrix.component }}@${DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
                --new-bundle-format=false --use-signing-config=false "$ref"; then
              exit 0
            fi
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts (Rekor unavailable?)"
          exit 1
      # Round-trip check, mirroring publish-edge.yaml: strictly verify the
      # signature just pushed (no --insecure-ignore-tlog, so the Rekor evidence
      # must be present), and fail the release if the committed signing/cosign.pub no
      # longer matches the signing key.
      - name: verify signature & check published key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --new-bundle-format=false \
            "ghcr.io/${owner_lc}/gameplane/${{ matrix.component }}@${DIGEST}"
          if [ -f signing/cosign.pub ] && ! cmp -s signing/cosign.pub "$RUNNER_TEMP/cosign.pub"; then
            echo "::error::committed signing/cosign.pub does not match COSIGN_PRIVATE_KEY — update the published key"
            exit 1
          fi
      # Attach the release tags only now that the digest carries a verified
      # signature. `oras tag` points each tag at the existing manifest without
      # rewriting it; the loop confirms every tag resolves to the signed digest.
      # A leg that fails before this step leaves only an untagged digest. A
      # leg that fails in the resolve loop has already published its tags, so
      # inspect the image's tags before re-running the failed jobs.
      - name: install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: attach release tags to the signed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$META_TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no release tags were computed for ${IMAGE}"
            exit 1
          fi
          tags=()
          for r in "${refs[@]}"; do
            if [ "${r%:*}" != "$IMAGE" ]; then
              echo "::error::${r} is not a tag of ${IMAGE}"
              exit 1
            fi
            tags+=("${r##*:}")
          done
          oras tag "${IMAGE}@${DIGEST}" "${tags[@]}"
          for t in "${tags[@]}"; do
            got="$(oras resolve "${IMAGE}:${t}")"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${IMAGE}:${t} resolves to ${got}, not the signed digest ${DIGEST}"
              exit 1
            fi
          done

  chart:
    name: package Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15 # applied by extension per D-A, pending maintainer confirmation
    permissions:
      contents: read
      packages: write
    environment: release-signing
    needs: images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # cosign sign reads credentials from ~/.docker/config.json, which helm
      # registry login does not populate (it uses HELM_REGISTRY_CONFIG instead).
      # Add docker login to provide cosign with GHCR credentials.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: chart version
        run: |
          sed -i "s/^version: .*/version: ${GITHUB_REF_NAME#v}/" charts/gameplane/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: ${GITHUB_REF_NAME#v}/" charts/gameplane/Chart.yaml
      - name: helm package
        run: helm package charts/gameplane -d dist
      # The chart is a published artifact like the images, so it must be signed
      # too — it was previously pushed unsigned, which made the "everything we
      # publish is signed" claim untrue.
      - name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for official chart publishing"
            exit 1
          fi
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: refresh sigstore trust root
        run: cosign initialize
      - name: push to OCI
        id: push
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm.json
        run: |
          # OCI references must be lowercase; github.repository_owner keeps the
          # account's original casing (GameplanePanel), so fold it down.
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          # `helm push` prints "Digest: sha256:…" for the pushed chart manifest;
          # capture it so the signature covers the immutable digest, not a tag.
          out="$(helm push dist/gameplane-*.tgz "oci://ghcr.io/${owner_lc}/charts" 2>&1)"
          printf '%s\n' "$out"
          digest="$(printf '%s\n' "$out" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | head -n1)"
          if [ -z "$digest" ]; then
            echo "::error::could not parse the pushed chart digest from helm push output"
            exit 1
          fi
          echo "ref=ghcr.io/${owner_lc}/charts/gameplane@${digest}" >> "$GITHUB_OUTPUT"
      - name: sign chart (keyed, logged)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          for attempt in 1 2 3; do
            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
                --new-bundle-format=false --use-signing-config=false "$REF"; then
              exit 0
            fi
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts (Rekor unavailable?)"
          exit 1
      - name: verify chart signature
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --new-bundle-format=false "$REF"

  # Publish the GitHub Release page for the tag, with the matching CHANGELOG
  # section as the notes. beta.3's page was created by hand and beta.4's was
  # forgotten entirely — this makes the page part of the release, not a
  # follow-up chore.
  github-release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15 # applied by extension per D-A, pending maintainer confirmation
    permissions:
      contents: write
    needs: [images, chart]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::no CHANGELOG section for ${GITHUB_REF_NAME#v} — falling back to generated notes"
            rm notes.md
          fi
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: re-running the workflow must not fail on an existing
          # release (and must not clobber hand-edited notes).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          args=(--verify-tag --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          if [ -f notes.md ]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          # Ship the signature-verification key with the release once it is
          # committed in the repo.
          assets=()
          if [ -f signing/cosign.pub ]; then assets=(signing/cosign.pub); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "${args[@]}" "${assets[@]}"

  modules:
    name: push & sign module bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15 # applied by extension per D-A, pending maintainer confirmation
    permissions:
      contents: read
      packages: write
    environment: release-signing
    steps:
      # The module bundles live in the GameplanePanel/module submodule at modules/,
      # so this job needs a recursive checkout to read their source. The
      # submodule is public, so the default GITHUB_TOKEN clones it (no PAT).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Signing is mandatory: fail rather than publish unsigned bundles (or
      # silently publish none at all).
      - name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for official module bundle publishing"
            exit 1
          fi
      - name: install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: refresh sigstore trust root
        run: cosign initialize
      - name: login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # --tlog-upload records each bundle signature in the public Rekor
      # transparency log. build.sh keeps signing in cosign's classic format, so
      # the operator's keyed (offline) verify path still works unchanged —
      # enforcing log inclusion is a separate, opt-in ModuleSource setting.
      - name: push & sign bundles
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          modules/build.sh push \
            --registry "ghcr.io/${owner_lc}/gameplane-modules" \
            --sign --tlog-upload --tag-latest
