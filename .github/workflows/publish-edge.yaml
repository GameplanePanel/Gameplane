name: publish-edge

# Continuously publish edge images to GHCR on every push to master, so testers
# can track the latest build without waiting for a tagged release. Tagged
# releases (release.yaml, triggered by v* tags) remain the recommended,
# version-pinned install path; this is the rolling "edge" channel.
#
# Images: ghcr.io/<owner>/gameplane/{operator,api,web,agent,audit-syslog-bridge,
#         telemetry-receiver,sentinel,capture-sidecar,mcp-server,tunnel-frp,
#         tunnel-tailscale,tunnel-playit}:edge
#         ...and an immutable :sha-<short> tag for pinning a specific commit.
# Consume with: helm install ... --set image.tag=edge

on:
  push:
    branches: [master]
    # Only rebuild when something that lands in an image changes. Docs/chart
    # edits don't need a fresh image push. Every path here is a real `COPY`
    # input of at least one of the 12 matrix images' Dockerfiles below (or a
    # transitive Go module dependency of one) — a path missing from this list
    # means a push that changes it publishes nothing to :edge until a later,
    # unrelated push happens to also touch a listed path.
    paths:
      - "operator/**"
      - "api/**"
      - "web/**"
      - "agent/**"
      - "netguard/**"
      - "gameaction/**"
      - "gameproto/**"
      - "telemetryschema/**"
      - "svcutil/**"
      - "gp-module/**"
      - "audit-syslog-bridge/**"
      - "telemetry-receiver/**"
      - "sentinel/**"
      - "capture-sidecar/**"
      - "mcp-server/**"
      - "tunnel/**"
      - "go.work"
      - "go.work.sum"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - ".github/workflows/publish-edge.yaml"
      - "hack/ci_scope.py"
      - ".dockerignore"
      - "signing/cosign.pub"
  workflow_dispatch: {}

permissions:
  contents: read

# Don't stack edge publishes: a newer master push supersedes an in-flight one.
concurrency:
  group: publish-edge
  cancel-in-progress: true

jobs:
  changes:
    name: select edge images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: include changes since the last successful publish
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 hack/ci_scope.py images --head "$HEAD_SHA"

  images:
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    name: build & push edge image
    runs-on: ubuntu-latest
    # 35 min: observed max 31 minutes across 142 job samples on 2026-08-30,
    # multi-arch buildx plus cosign across the image set
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    # The signing key is held by this environment, whose deployment policy
    # admits only master and v* tags (repository settings).
    environment: release-signing
    strategy:
      fail-fast: false
      # The catalog and COPY-input selector share one source of truth.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Signing is mandatory for the official edge channel: fail before anything
      # is pushed if the key is absent, rather than shipping unsigned images.
      # The key has been provisioned since module signing went live, so this
      # never regresses a real run — it only prevents a silently-unsigned one.
      - name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for edge image publishing"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI references must be lowercase; github.repository_owner keeps the
      # account's original casing, so fold it down for the by-digest push.
      - id: image
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner_lc}/gameplane/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Same path as release.yaml so the edge and released images sit side
          # by side under one package. metadata-action lowercases the owner.
          images: ghcr.io/${{ github.repository_owner }}/gameplane/${{ matrix.component }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      # Push by digest only. The edge tags are attached after the digest is
      # signed and verified, so :edge and :sha-* only ever name a signed image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.component) }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge-${{ github.sha }}
          cache-from: type=gha,scope=edge-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=edge-${{ matrix.component }}
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      # Refresh the Sigstore TUF trust root so the runner has the CURRENT
      # public-good signing config — the Rekor v2 log key + timestamp authority.
      # cosign's baked-in root can still reference a decommissioned yearly Rekor
      # shard; without this, signing fails the Rekor-v2 TSA/checkpoint threshold
      # check ("accepted signatures do not match threshold, Found: 0").
      - name: refresh sigstore trust root
        run: cosign initialize
      # Keyed-sign the pushed image by digest AND record the signature in
      # Sigstore's public-good Rekor transparency log, so misuse of the project
      # key becomes publicly detectable.
      #
      # Two flags select cosign's classic, widely-compatible signing path over
      # the new Rekor v2 flow:
      #   --new-bundle-format=false  → classic OCI `.sig` signature + hashedrekord
      #                                tlog entry (not a protobuf DSSE bundle),
      #                                the format existing `cosign verify` clients
      #                                and the operator's cosign/v2 verifier read.
      #   --use-signing-config=false → legacy tlog upload to --rekor-url's default
      #                                (https://rekor.sigstore.dev), NOT the Rekor
      #                                v2 signing-config path. (cosign requires
      #                                these two together: use-signing-config
      #                                implies the new bundle format.)
      # The default v3 flow targets Rekor v2, which additionally needs an RFC3161
      # TSA timestamp and a live yearly log shard; keyed signing to it fails
      # cosign's post-sign threshold self-check ("accepted signatures do not
      # match threshold, Found: 0"). The classic path needs no TSA. Bounded retry
      # tolerates a transient Rekor blip; we never fall back to an unlogged
      # signature (strict verify below would fail anyway).
      - name: sign image (keyed, logged)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner_lc}/gameplane/${{ matrix.component }}@${DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
                --new-bundle-format=false --use-signing-config=false "$ref"; then
              exit 0
            fi
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts (Rekor unavailable?)"
          exit 1
      # Round-trip check: derive the public key from the signing secret and
      # strictly verify the signature just pushed — no --insecure-ignore-tlog, so
      # the Rekor inclusion evidence must be present. A corrupted key or a
      # sign/verify mismatch fails the publish instead of every user's `cosign
      # verify`. When signing/cosign.pub is committed in the repo it must match the
      # derived key — a mismatch means the key was rotated without updating it.
      - name: verify signature & check published key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile "$RUNNER_TEMP/cosign.pub"
          # --new-bundle-format=false to read the classic signature we produced;
          # no --insecure-ignore-tlog, so the Rekor log entry must be present.
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --new-bundle-format=false \
            "ghcr.io/${owner_lc}/gameplane/${{ matrix.component }}@${DIGEST}"
          if [ -f signing/cosign.pub ] && ! cmp -s signing/cosign.pub "$RUNNER_TEMP/cosign.pub"; then
            echo "::error::committed signing/cosign.pub does not match COSIGN_PRIVATE_KEY — update the published key"
            exit 1
          fi
      # Attach the edge tags only now that the digest carries a verified
      # signature. `oras tag` points each tag at the existing manifest without
      # rewriting it; the loop confirms every tag resolves to the signed digest.
      # A run that stops or is superseded before this step leaves only an
      # untagged digest behind.
      - name: install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: attach edge tags to the signed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$META_TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no edge tags were computed for ${IMAGE}"
            exit 1
          fi
          tags=()
          for r in "${refs[@]}"; do
            if [ "${r%:*}" != "$IMAGE" ]; then
              echo "::error::${r} is not a tag of ${IMAGE}"
              exit 1
            fi
            tags+=("${r##*:}")
          done
          oras tag "${IMAGE}@${DIGEST}" "${tags[@]}"
          for t in "${tags[@]}"; do
            got="$(oras resolve "${IMAGE}:${t}")"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${IMAGE}:${t} resolves to ${got}, not the signed digest ${DIGEST}"
              exit 1
            fi
          done
      # Surface the verification key (job summary + artifact) so publishing or
      # rotating the repo's signing/cosign.pub never requires handling the private key
      # outside CI. One matrix leg is enough — the key is the same for all.
      - name: export public key
        if: matrix.component == 'operator'
        run: |
          {
            echo '### cosign public key'
            echo '```'
            cat "$RUNNER_TEMP/cosign.pub"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload public key artifact
        if: matrix.component == 'operator'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosign-pub
          path: ${{ runner.temp }}/cosign.pub
