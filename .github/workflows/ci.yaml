name: ci

on:
  push:
    branches: [master]
    # Every master push runs the full suite, including docs/submodule changes.
  pull_request:
    # Docs-only changes can't affect anything the suites test — don't spend
    # kind minutes on a markdown diff. Any non-ignored file in the change
    # set still triggers the workflow. "website" (no slash) matches the
    # submodule gitlink itself — a plain submodule pointer bump; the /**
    # variant covers any future in-tree files under that path.
    # paths + negations (not paths-ignore, which cannot re-include) so that a
    # change touching only a specs.md still runs make check-specs (ruling D5).
    # Docs re-inclusion entries run the dedicated documentation gates (check-links,
    # check-doc-versions) on docs-only changes so stale versions and broken links
    # are caught without running unrelated test suites.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!design.pen"
      - "!website"
      - "!website/**"
      - "!LICENSE"
      - "**/specs.md"
      - "README.md"
      - "docs/**"
      - "audit-syslog-bridge/README.md"
      - "mcp-server/README.md"
      - "telemetry-receiver/README.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "specs/**/outreach.md"
# Cancel superseded runs so rapid pushes to the same ref don't waste
# runner minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Go module mirror and checksum database have repeatedly dropped HTTP/2
# streams mid-transfer ("stream error: stream ID N; INTERNAL_ERROR; received
# from peer"), reddening jobs for reasons that have nothing to do with the
# change under test.
#   GOPROXY  - fall through to a second mirror, then to the origin, instead of
#              failing when proxy.golang.org is unwell.
# GOSUMDB is NOT disabled here. It is turned off only on the two `go mod
# download` steps, where every hash is already pinned in the committed go.sum
# and re-verified locally, so skipping the tile fetch costs nothing. Every
# `go install` keeps the checksum database on, because a tool fetched outside
# the module graph has no go.sum entry to verify it against.
env:
  GOPROXY: https://proxy.golang.org,https://goproxy.io,direct

permissions:
  contents: read

# All jobs run on GitHub-hosted runners: each job gets its own isolated
# VM, so jobs never contend for memory or ports and there is nothing to
# serialize. The e2e suites are split into independent jobs, each with
# its own kind cluster, so the slowest suite — not the sum of all of
# them — sets the wall-clock time.
jobs:
  # Path-filter gate. Computes which parts of the tree a change touches so the
  # heavy jobs below can skip when they can't be affected (a web-only PR drops
  # from ~22 jobs to a handful). Any shared/CI-config path (this workflow, the
  # composite actions, the Makefile, go.work, buckets.sh) forces EVERYTHING on
  # via the `ci` fail-safe. Master pushes and unknown diff bases also select
  # the full suite through ci_scope.py's `all` output.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.combine.outputs.go }}
      web: ${{ steps.combine.outputs.web }}
      charts: ${{ steps.combine.outputs.charts }}
      e2e: ${{ steps.combine.outputs.e2e }}
      weblive: ${{ steps.combine.outputs.weblive }}
      images: ${{ steps.combine.outputs.images }}
      github: ${{ steps.combine.outputs.github }}
      specs: ${{ steps.combine.outputs.specs }}
      docs: ${{ steps.combine.outputs.docs }}
      kindsmoke: ${{ steps.combine.outputs.kindsmoke }}
      lint: ${{ steps.scope.outputs.lint }}
      modules: ${{ steps.scope.outputs.modules }}
      lint-exclude: ${{ steps.scope.outputs.lint-exclude }}
      go-exclude: ${{ steps.scope.outputs.go-exclude }}
      e2e-unit: ${{ steps.scope.outputs.e2e-unit }}
      bot-matrix: ${{ steps.bots.outputs.matrix }}
      capture_overhead: ${{ steps.combine.outputs.capture_overhead }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: select affected Go modules and consumers
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 hack/ci_scope.py modules --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: partition every bot-fast test onto its own runner
        id: bots
        run: python3 hack/ci_scope.py bots
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'netguard/**'
              - 'gameaction/**'
              - 'gameproto/**'
              - 'operator/**'
              - 'api/**'
              - 'agent/**'
              - 'audit-syslog-bridge/**'
              - 'telemetry-receiver/**'
              - 'telemetryschema/**'
              - 'sentinel/**'
              - 'mcp-server/**'
              - 'capture-sidecar/**'
              - 'svcutil/**'
              - 'tunnel/**'
              - 'gp-module/**'
              - 'test/e2e/**'
              - 'go.work'
              - 'go.work.sum'
              - '**/go.mod'
              - '**/go.sum'
              - '**/Dockerfile'
            web:
              - 'web/**'
            charts:
              - 'charts/**'
              # The chart embeds a copy of the root signing key; the drift
              # check in `chart render` has to run when either side moves.
              - 'cosign.pub'
              # The CRD bundle-hash stamp check regenerates the chart CRDs
              # from these; an edit to either must re-run it.
              - 'operator/config/crd/**'
              - 'hack/sync-chart-crds.sh'
            e2etree:
              - 'test/e2e/**'
              - 'deploy/kind/**'
              - 'containers/docker-bake.hcl'
            # Narrower than e2etree on purpose: this backs a job that only
            # smoke-tests deploy/kind/**'s pinned dev ingress-nginx manifest
            # on a real Kind cluster, and must NOT run on every e2e-affecting
            # change (a Go or chart edit does not touch that manifest pin).
            # On PRs there is no `ci` fail-safe either — the workflow file
            # itself is listed directly below. Master pushes always run it.
            kindsmoke:
              - 'deploy/kind/**'
              - '.github/workflows/ci.yaml'
            gamecoverage:
              - 'modules'
              - 'modules/**'
              - 'docs/game-coverage.md'
            # Gates the non-blocking e2e-capture-overhead job on PRs (OD-2 in
            # specs/done_007-capture-overhead-guard/OPEN-DECISIONS.md). Master pushes
            # run it through the e2e gate instead.
            capture_overhead:
              - 'capture-sidecar/**'
              - 'operator/internal/controller/networkcapture*'
              - 'api/internal/handlers/capture*'
              - 'test/e2e/internal/minecraft-java/**'
              - 'test/e2e/capture_overhead_e2e_test.go'
              - 'test/e2e/gameprobe_job.go'
            ci:
              - '.github/workflows/ci.yaml'
              - '.github/actions/**'
              - 'hack/ci_scope.py'
              - 'hack/test_ci_scope.py'
              - 'Makefile'
              - 'go.work'
              - 'go.work.sum'
              - 'test/e2e/buckets.sh'
              # golangci-lint walks up from `working-directory` to find this
              # config, so every `lint (…)` leg picks up an edit here even
              # though none of them declare it as an input. Force the lint
              # job on so a config change is tested against real code
              # instead of silently taking effect on the next unrelated PR.
              - '.golangci.yml'
            github:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'
              - '.github/dependabot.yml'
              - 'hack/ci_scope.py'
              - 'hack/test_ci_scope.py'
              - 'hack/check-ci-report-coverage.sh'
              - 'hack/test-check-ci-report-coverage.sh'
              - 'hack/testdata/check-ci-report-coverage/**'
              - 'hack/check-publish-edge-paths.sh'
              - 'hack/test-check-publish-edge-paths.sh'
              - 'hack/testdata/check-publish-edge-paths/**'
            specs:
              - '**/specs.md'
              - 'hack/check-specs.sh'
              - 'hack/check-telemetry-catalog.sh'
              - 'telemetryschema/catalog.txt'
              - 'charts/gameplane/values.yaml'
              - 'hack/check-dev-load-images.sh'
              - 'hack/test-up-registry.sh'
              - 'deploy/kind/up.sh'
            docs:
              - 'README.md'
              - 'docs/architecture.md'
              - 'docs/contributing.md'
              - 'docs/dependencies.md'
              - 'docs/game-coverage.md'
              - 'docs/install.md'
              - 'docs/key-rotation.md'
              - 'docs/module-authoring.md'
              - 'docs/networking.md'
              - 'docs/notifications.md'
              - 'docs/oidc.md'
              - 'docs/roadmap.md'
              - 'docs/security.md'
              - 'docs/tunnels.md'
              - 'audit-syslog-bridge/README.md'
              - 'mcp-server/README.md'
              - 'telemetry-receiver/README.md'
              - 'docs/comparison-sources.md'
              - 'hack/check-links.sh'
              - 'hack/check-doc-versions.sh'
              - 'hack/test-check-doc-versions.sh'
              - 'hack/testdata/check-doc-versions/**'
              # `docs/**` broadly: check-links resolves relative links from
              # the 18 audited files against ANY file under docs/ (e.g.
              # docs/architecture.md -> docs/agent-architecture.md), not
              # just the other audited files, so renaming a non-audited doc
              # must still run the gate.
              - 'docs/**'
              # appVersion source for check-doc-versions.sh; a bump here
              # changes what every audited file is checked against.
              - 'charts/gameplane/Chart.yaml'
              # Non-docs/ link targets referenced from the audited files
              # (docs/dependencies.md -> CHANGELOG.md, docs/contributing.md
              # -> CLAUDE.md and specs/012-.../outreach.md, README.md ->
              # LICENSE/cosign.pub, docs/key-rotation.md -> the legacy key
              # files) — renaming or moving any of these must run check-links.
              - 'CHANGELOG.md'
              - 'CLAUDE.md'
              - 'LICENSE'
              - 'cosign.pub'
              - 'cosign-legacy.pub'
              - 'cosign.pub.legacy-sig'
              - 'specs/**/outreach.md'
      - id: combine
        # Fold the raw filters into single-token booleans so every downstream
        # `if:` is one expression (fewer chances to get wrong when the only way
        # to test is to push). `ci` forces all of them true. e2e-affecting =
        # go|charts|e2etree|ci; images/weblive are needed by the kind e2e jobs
        # and the live-web job, so they = e2e|web|ci.
        env:
          GO: ${{ steps.scope.outputs.go }}
          WEB: ${{ steps.filter.outputs.web }}
          CHARTS: ${{ steps.filter.outputs.charts }}
          E2ETREE: ${{ steps.filter.outputs.e2etree }}
          GAMECOVERAGE: ${{ steps.filter.outputs.gamecoverage }}
          CI: ${{ steps.filter.outputs.ci == 'true' || steps.scope.outputs.all == 'true' }}
          CAPTURE: ${{ steps.filter.outputs.capture_overhead }}
          GITHUB: ${{ steps.filter.outputs.github }}
          SPECS: ${{ steps.filter.outputs.specs }}
          DOCS: ${{ steps.filter.outputs.docs }}
          KINDSMOKE: ${{ steps.filter.outputs.kindsmoke == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: |
          gov=false;  { [ "$GO" = true ]     || [ "$CI" = true ]; } && gov=true
          webv=false; { [ "$WEB" = true ]    || [ "$CI" = true ]; } && webv=true
          chv=false;  { [ "$CHARTS" = true ] || [ "$CI" = true ]; } && chv=true
          e2ev=false; { [ "$GO" = true ] || [ "$CHARTS" = true ] || [ "$E2ETREE" = true ] || [ "$GAMECOVERAGE" = true ] || [ "$CI" = true ]; } && e2ev=true
          wlv=false;  { [ "$e2ev" = true ] || [ "$WEB" = true ] || [ "$CI" = true ]; } && wlv=true
          ghv=false;  { [ "$GITHUB" = true ] || [ "$CI" = true ]; } && ghv=true
          specsv=false; { [ "$SPECS" = true ] || [ "$CI" = true ]; } && specsv=true
          docsv=false; { [ "$DOCS" = true ] || [ "$CI" = true ]; } && docsv=true
          capov=false; { [ "$CAPTURE" = true ] || [ "$CI" = true ]; } && capov=true
          # Keep this gate narrow on PRs; KINDSMOKE also enables it for every
          # master push, independently of its file filter.
          ksv=false; [ "$KINDSMOKE" = true ] && ksv=true
          {
            echo "go=$gov"
            echo "web=$webv"
            echo "charts=$chv"
            echo "e2e=$e2ev"
            echo "weblive=$wlv"
            echo "images=$wlv"
            echo "github=$ghv"
            echo "specs=$specsv"
            echo "docs=$docsv"
            echo "kindsmoke=$ksv"
            echo "capture_overhead=$capov"
          } >> "$GITHUB_OUTPUT"

  # Build the operator/api/agent (+ gameprobe) images ONCE and publish them as
  # an artifact, so the 9 heavy e2e jobs load a tar instead of each recompiling
  # the same three Go binaries. Gated on `images` so a run that needs no e2e
  # image skips the build entirely.
  build-images:
    name: build e2e images
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-e2e-images

  # Same as build-images but on an arm64 runner, producing the e2e-images-arm64
  # artifact the arm64 e2e legs load. Native arm build, no QEMU.
  build-images-arm64:
    name: build e2e images (arm64)
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-e2e-images
        with:
          arch: arm64

  # Proof that CAP_NET_RAW file capabilities survive the multi-stage Dockerfile
  # COPY into distroless/static:nonroot. File capabilities are stored as xattrs
  # and may be dropped by some builders/COPY implementations; this gate ensures
  # they survived so the sidecar can open AF_PACKET sockets at runtime.
  #
  # IMPORTANT: this deliberately does NOT extract the binary with `docker cp`.
  # `docker cp` (copy out of a container) unpacks the tar stream client-side,
  # as the invoking non-root runner user, outside any container/namespace —
  # and writing the security.capability xattr onto a real file requires the
  # CAP_SETFCAP privilege that process does not have, so the xattr silently
  # fails to apply. That makes `docker cp` + getcap report the capability
  # missing unconditionally, regardless of whether the image is actually
  # correct, which would fail this gate every run and permanently redden the
  # branch — the worst possible outcome for a job whose only purpose is to
  # prove this property. Instead we `docker save` the image (the capability
  # xattr is preserved as a PAX/SCHILY.xattr record inside the layer
  # tarball itself) and extract that tarball ourselves with
  # `tar --xattrs --xattrs-include='security.capability'`, GNU tar's
  # documented way to round-trip file capabilities through an archive.
  #
  # That layer-tarball extraction is *itself* CAP_SETFCAP-restricted for the
  # exact same reason `docker cp` is: restoring the security.capability xattr
  # to a real file requires privilege the plain `runner` user does not have,
  # regardless of whether the archive is well-formed. So the extraction (and
  # the getcap read of the result) run under `sudo` — GitHub-hosted runners
  # grant the runner user passwordless sudo — which is the only way this job
  # can actually distinguish "capability present" from "capability absent"
  # instead of failing unconditionally either way.
  capture-sidecar-setcap-proof:
    name: capture-sidecar CAP_NET_RAW survival
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: install libcap2-bin (getcap)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcap2-bin
      # Same Dockerfile, same repo-root context, same buildx-backed action as
      # publish-edge.yaml/release.yaml use for the real capture-sidecar image
      # — single-platform (amd64, matching this runner) and loaded locally
      # instead of pushed.
      - name: build capture-sidecar image (matches publish workflows)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: capture-sidecar/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: capture-sidecar:test
      - name: verify CAP_NET_RAW survived the image build
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          # Extraction below writes root-owned files under $WORKDIR (see
          # comment above the job for why sudo is required), so cleanup
          # needs the same privilege or it silently leaves them behind.
          trap 'sudo rm -rf "$WORKDIR"' EXIT

          echo "Saving image to a tarball (docker save preserves layer xattrs; docker cp does not)..."
          docker save capture-sidecar:test -o "$WORKDIR/image.tar"

          mkdir -p "$WORKDIR/image"
          tar -xf "$WORKDIR/image.tar" -C "$WORKDIR/image"

          # docker save's output layout varies by storage driver (classic
          # docker archive: per-layer directories with layer.tar; containerd
          # image store: OCI blobs/sha256/<digest>) so scan every extracted
          # regular file that tar can list as a candidate layer tarball
          # instead of hardcoding a path.
          FOUND_BINARY=0
          LAST_GETCAP_OUTPUT=""

          while IFS= read -r -d '' candidate; do
            if ! tar -tf "$candidate" >/dev/null 2>&1; then
              continue
            fi
            # Materialize the listing before grepping it: `tar -tf | grep -q`
            # lets grep exit on its first match and SIGPIPE the still-writing
            # tar process, which under `set -o pipefail` turns into a
            # nonzero pipeline status indistinguishable from "no match" —
            # silently skipping the layer that actually holds the binary.
            listing="$(tar -tf "$candidate" 2>/dev/null || true)"
            if ! printf '%s\n' "$listing" | grep -Eq '(^|/)capture-sidecar$'; then
              continue
            fi

            EXTRACT_DIR="$WORKDIR/extract-$(basename "$candidate" | tr -c 'a-zA-Z0-9' '_')"
            mkdir -p "$EXTRACT_DIR"
            # sudo: restoring the security.capability xattr to a real file
            # requires CAP_SETFCAP, which the unprivileged runner user does
            # not have — see the job-level comment for why this can't run
            # as plain `tar`.
            sudo tar --xattrs --xattrs-include='security.capability' -xf "$candidate" -C "$EXTRACT_DIR"

            BIN_PATH="$(sudo find "$EXTRACT_DIR" -type f -name 'capture-sidecar' -print -quit)"
            if [ -z "$BIN_PATH" ]; then
              continue
            fi

            FOUND_BINARY=1
            echo "Inspecting $candidate -> $BIN_PATH"
            LAST_GETCAP_OUTPUT="$(sudo getcap "$BIN_PATH" 2>&1 || true)"
            echo "getcap output: $LAST_GETCAP_OUTPUT"

            if printf '%s' "$LAST_GETCAP_OUTPUT" | grep -q 'cap_net_raw'; then
              echo "CAP_NET_RAW present in final image"
              exit 0
            fi
          done < <(find "$WORKDIR/image" -type f -print0)

          if [ "$FOUND_BINARY" -eq 0 ]; then
            echo "ERROR: could not find any layer tarball containing /capture-sidecar in the saved image." >&2
            echo "Saved image contents:" >&2
            find "$WORKDIR/image" -maxdepth 3 >&2
            exit 1
          fi

          echo "ERROR: CAP_NET_RAW missing from the capture-sidecar binary in the built image." >&2
          echo "Last getcap output observed: '$LAST_GETCAP_OUTPUT'" >&2
          echo "This means file capabilities did not survive the multi-stage Dockerfile COPY." >&2
          echo "The sidecar will fail at runtime when it tries to open AF_PACKET sockets." >&2
          exit 1

  # Repository-wide gates run once, including on documentation-only changes.
  docs:
    name: docs and repository checks
    needs: [changes]
    if: needs.changes.outputs.lint == 'true' || needs.changes.outputs.specs == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify lint gate configuration
        run: ./test/e2e/lint-gate-verify.sh verify
      - name: check documentation links
        run: make check-links
      - name: check documentation versions
        run: make check-doc-versions
      - name: test documentation version checker
        run: make test-doc-versions
      - name: check specs compliance
        run: make check-specs
      - name: check telemetry catalog
        run: make check-telemetry-catalog
      - name: check dev-load image coverage
        run: make check-dev-load-images
      - name: test up.sh registry/context bootstrap
        run: make test-up-registry

  lint:
    name: lint (${{ matrix.module }})
    needs: [changes]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [netguard, gameaction, gameproto, telemetryschema, operator, agent, api, sentinel, audit-syslog-bridge, telemetry-receiver, mcp-server, capture-sidecar, svcutil, tunnel, gp-module, test/e2e]
        exclude: ${{ fromJSON(needs.changes.outputs.lint-exclude) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: lint-${{ matrix.module }}
      - name: go mod download
        working-directory: ${{ matrix.module }}
        # proxy.golang.org and sum.golang.org intermittently drop HTTP/2 streams
        # mid-download ("stream error: stream ID N; INTERNAL_ERROR; received
        # from peer"), which fails the whole job on a transient upstream fault
        # that has nothing to do with the change under test. Retry with backoff;
        # a genuinely broken dependency still fails on the final attempt, whose
        # output is the one that reaches the log.
        #
        # GOSUMDB is off for this step only: every module here is pinned in the
        # committed go.sum and its hash is still checked on download, so the
        # sum.golang.org tile fetch adds nothing but a failure mode. It stays on
        # everywhere else, including every go install.
        env:
          GOSUMDB: "off"
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt ${attempt}/5) — retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          go mod download
      - name: lint (operator/api - envtest build tags)
        if: matrix.module == 'operator' || matrix.module == 'api'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --build-tags=envtest
      - name: lint (test/e2e - e2e build tags)
        if: matrix.module == 'test/e2e'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --build-tags=e2e
      - name: lint (other modules - no build tags)
        if: matrix.module != 'operator' && matrix.module != 'api' && matrix.module != 'test/e2e'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  # Merge gate for spec 022: the project default telemetry destination
  # (DefaultEndpoint in api/internal/telemetry/destination.go) must be an https
  # URL. OPEN-DECISIONS OD-1 is ruled, so it passes; it keeps FR-002 enforced. Deliberately
  # separate: not part of `make lint`, and not in the `report` job's needs.
  telemetry-default-gate:
    name: telemetry default gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check the default telemetry destination
        run: sh hack/check-telemetry-default.sh

  go:
    name: go (${{ matrix.module }} / ${{ matrix.arch }})
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    # amd64 on the standard hosted runner; arm64 on the free public-repo
    # arm runner. Unit + envtest run on both arches every PR — this is where
    # real arch bugs (build tags, sqlite codepaths, struct alignment) surface.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [netguard, gameaction, gameproto, telemetryschema, operator, api, agent, audit-syslog-bridge, telemetry-receiver, sentinel, mcp-server, capture-sidecar, svcutil, tunnel, gp-module]
        exclude: ${{ fromJSON(needs.changes.outputs.go-exclude) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: initialize validator module fixtures
        if: matrix.module == 'gp-module'
        # The real-module test reads modules/cs2 from disk.
        run: git submodule update --init modules
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: ${{ matrix.module }}
      - name: go mod download
        working-directory: ${{ matrix.module }}
        # proxy.golang.org and sum.golang.org intermittently drop HTTP/2 streams
        # mid-download ("stream error: stream ID N; INTERNAL_ERROR; received
        # from peer"), which fails the whole job on a transient upstream fault
        # that has nothing to do with the change under test. Retry with backoff;
        # a genuinely broken dependency still fails on the final attempt, whose
        # output is the one that reaches the log.
        #
        # GOSUMDB is off for this step only: every module here is pinned in the
        # committed go.sum and its hash is still checked on download, so the
        # sum.golang.org tile fetch adds nothing but a failure mode. It stays on
        # everywhere else, including every go install.
        env:
          GOSUMDB: "off"
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt ${attempt}/5) — retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          go mod download
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      # NOTE: -race is omitted on purpose to keep this job fast; coverage
      # uses -covermode=atomic, which is valid without -race. `make cover`
      # still runs -race for local/manual use.
      - name: unit test + coverage
        working-directory: ${{ matrix.module }}
        run: |
          mkdir -p coverage
          go test -covermode=atomic -coverpkg=./... \
            -coverprofile=coverage/unit.out ./...
      - name: agent file access across real UIDs
        if: matrix.module == 'agent' && matrix.arch == 'amd64'
        working-directory: agent
        # Root only launches the test's unprivileged game/agent subprocesses.
        # Keep sudo scoped to this compiled regression, never the general suite.
        run: |
          go test -c -o "$RUNNER_TEMP/agent-files.test" ./internal/files
          sudo "$RUNNER_TEMP/agent-files.test" -test.run='^TestFileAccessAcrossUIDs$' -test.v -test.timeout=2m
      - name: setup-envtest binary cache
        if: matrix.module == 'operator' || matrix.module == 'api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/setup-envtest
          key: setup-envtest-bin-release-0.24-${{ runner.os }}-${{ runner.arch }}
      - name: envtest assets cache
        if: matrix.module == 'operator' || matrix.module == 'api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-1.36.2-${{ runner.os }}-${{ runner.arch }}
      - name: integration (envtest) test + coverage
        if: matrix.module == 'operator' || matrix.module == 'api'
        working-directory: ${{ matrix.module }}
        run: |
          [ -x "$HOME/go/bin/setup-envtest" ] || go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24
          KUBEBUILDER_ASSETS=$("$HOME"/go/bin/setup-envtest use 1.36.2 -p path)
          export KUBEBUILDER_ASSETS
          go test -tags=envtest -timeout 10m \
            -covermode=atomic -coverpkg=./... \
            -coverprofile=coverage/envtest.out ./...
      - name: warm coverage tool cache
        # cover-go-merge and cover-go-check `go run` pinned tools, so they hit
        # the module mirror as well and fail the same transient way. Fetch them
        # here, with retries, so the gate itself runs from the module cache and
        # a real coverage shortfall fails fast instead of being retried.
        run: |
          fetch() {
            go install github.com/wadey/gocovmerge@v0.0.0-20160331181800-b5bfa59ec0ad &&
            go install github.com/vladopajic/go-test-coverage/v2@v2.18.9
          }
          for attempt in 1 2 3; do
            if fetch; then exit 0; fi
            echo "coverage tool fetch failed (attempt ${attempt}/4) — retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          fetch
      - name: merge profiles + threshold gate
        run: make cover-go-merge && make cover-go-check

  web:
    name: web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dashboard nginx accepts default mod uploads within API request limit
        working-directory: .
        run: python3 web/test-mod-upload-proxy.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: eslint
        run: npm run lint
      - run: npm run build
      - name: unit tests + coverage
        id: cover
        run: npm run test:cover
      - name: report coverage (commit status)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
          # steps.cover.outcome ignores this step's own continue-on-error
          # (it has none) and reflects whether `npm run test:cover` — the
          # vitest coverage-threshold gate — actually passed, so a
          # below-threshold run posts "failure" instead of a hard-coded
          # "success" that contradicts the red `web` job next to it.
          COVER_OUTCOME: ${{ steps.cover.outcome }}
        run: |
          set +e
          [ -f coverage/coverage-summary.json ] || exit 0
          DESC=$(node -e "const t=require('./coverage/coverage-summary.json').total;console.log('L'+t.lines.pct+' S'+t.statements.pct+' B'+t.branches.pct+' F'+t.functions.pct)")
          SHA="$HEAD_SHA"; [ -z "$SHA" ] && SHA="$RUN_SHA"
          STATE="success"
          [ "$COVER_OUTCOME" = "success" ] || STATE="failure"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            "$API_URL/repos/$REPO/statuses/$SHA" \
            -d "{\"context\":\"coverage/web\",\"state\":\"$STATE\",\"description\":\"$DESC\"}" >/dev/null || true
      - name: upload web coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web
          path: web/coverage
          retention-days: 7
          if-no-files-found: warn

  web-e2e-mock:
    name: web e2e (mock)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults: { run: { working-directory: web } }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: install chromium
        # Skips the browser download on a cache hit; still apt-installs deps.
        run: npx playwright install --with-deps chromium
      - name: playwright (mock)
        run: npm run test:e2e:mock
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-mock
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: warn

  helm:
    name: helm lint
    needs: [changes]
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/gameplane

  chart-template:
    name: chart render
    needs: [changes]
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm template gameplane charts/gameplane > /tmp/rendered.yaml
      - name: gateway isolation and API-disabled chart renders
        run: python3 charts/tests/check_gateway.py
      - name: sanity-check rendered manifests
        run: |
          grep -q 'kind: Deployment' /tmp/rendered.yaml
          grep -q 'kind: ClusterRole' /tmp/rendered.yaml
          grep -q 'kind: NetworkPolicy' /tmp/rendered.yaml
      - name: backup/restore Job egress policy renders (F-215)
        run: |
          helm template gameplane charts/gameplane \
            --show-only templates/networkpolicies.yaml > /tmp/netpol.yaml
          grep -q 'name: allow-backup-restore-egress' /tmp/netpol.yaml
          awk '/name: allow-backup-restore-egress/,/^---$/' /tmp/netpol.yaml \
            | grep -q 'app.kubernetes.io/name: gameplane-backup-restore'
      - name: observability scrape TLS/reachability render correctly (F-216, F-217)
        # F-216 rationale: agent/specs.md's /metrics section. F-217: the
        # telemetry-receiver needs its own ServiceMonitor, and both it and
        # the agent PodMonitor need a NetworkPolicy exception for the
        # configured Prometheus namespace once one is set via
        # serviceMonitors.scrapeNamespaceSelector. Spec 022: the receiver
        # serves /metrics only on its dashboard port 8081 behind a Bearer
        # token, so its ServiceMonitor and NetworkPolicy rule need
        # api.telemetry.receiver.dashboard.tokenSecretRef.name.
        run: |
          scrape_ns='serviceMonitors.scrapeNamespaceSelector={"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}'
          helm template gameplane charts/gameplane \
            --set serviceMonitors.enabled=true \
            --set api.telemetry.receiver.enabled=true \
            --set api.telemetry.receiver.dashboard.tokenSecretRef.name=receiver-dashboard \
            --set-json "$scrape_ns" \
            --show-only templates/servicemonitors.yaml > /tmp/servicemonitors.yaml
          awk '/kind: PodMonitor/,0' /tmp/servicemonitors.yaml | grep -q 'port: metrics'
          if awk '/kind: PodMonitor/,0' /tmp/servicemonitors.yaml | grep -q 'scheme: https'; then
            echo "::error::agent PodMonitor must not scrape over https"
            exit 1
          fi
          if awk '/kind: PodMonitor/,0' /tmp/servicemonitors.yaml | grep -q 'tlsConfig'; then
            echo "::error::agent PodMonitor must not carry a client-cert tlsConfig"
            exit 1
          fi
          grep -q 'name: gameplane-telemetry-receiver' /tmp/servicemonitors.yaml
          # The receiver serves /metrics only on its dashboard listener (8081)
          # behind the dashboard token, so the ServiceMonitor scrapes that
          # port with the token Secret as bearerTokenSecret.
          awk '/name: gameplane-telemetry-receiver/,/^---$/' /tmp/servicemonitors.yaml > /tmp/receiver-servicemonitor.yaml
          grep -q 'port: dashboard' /tmp/receiver-servicemonitor.yaml
          grep -q 'bearerTokenSecret:' /tmp/receiver-servicemonitor.yaml
          grep -q 'name: receiver-dashboard' /tmp/receiver-servicemonitor.yaml
          # No dashboard token: no receiver ServiceMonitor (it could only scrape
          # a permanently-down target); NOTES.txt carries the warning.
          helm template gameplane charts/gameplane \
            --set serviceMonitors.enabled=true \
            --set api.telemetry.receiver.enabled=true \
            --set-json "$scrape_ns" \
            --show-only templates/servicemonitors.yaml > /tmp/servicemonitors-notoken.yaml
          if grep -q 'name: gameplane-telemetry-receiver' /tmp/servicemonitors-notoken.yaml; then
            echo "::error::receiver ServiceMonitor rendered without api.telemetry.receiver.dashboard.tokenSecretRef.name"
            exit 1
          fi
          helm template gameplane charts/gameplane \
            --set serviceMonitors.enabled=true \
            --set-json "$scrape_ns" \
            --show-only templates/networkpolicies.yaml > /tmp/netpol-scrape.yaml
          awk '/name: allow-prometheus-to-agent/,/^---$/' /tmp/netpol-scrape.yaml \
            | grep -q 'port: 9090'
          helm template gameplane charts/gameplane \
            --set serviceMonitors.enabled=true \
            --set api.telemetry.receiver.enabled=true \
            --set api.telemetry.receiver.dashboard.tokenSecretRef.name=receiver-dashboard \
            --set-json "$scrape_ns" \
            --show-only templates/telemetry-receiver.yaml > /tmp/telemetry-receiver-scrape.yaml
          awk '/kind: NetworkPolicy/,/^---$/' /tmp/telemetry-receiver-scrape.yaml > /tmp/telemetry-receiver-netpol.yaml
          # The Prometheus namespace is admitted on the dashboard port 8081,
          # not on the public ingest port 8080 (which admits only the API).
          awk '/namespaceSelector:/,0' /tmp/telemetry-receiver-netpol.yaml \
            | grep -q 'kubernetes.io/metadata.name: monitoring'
          awk '/namespaceSelector:/,0' /tmp/telemetry-receiver-netpol.yaml \
            | grep -q 'port: 8081'
          if awk '/namespaceSelector:/,0' /tmp/telemetry-receiver-netpol.yaml | grep -q 'port: 8080'; then
            echo "::error::the Prometheus namespace must not be admitted on the receiver ingest port 8080"
            exit 1
          fi
          awk '/kind: Service/,/^---$/' /tmp/telemetry-receiver-scrape.yaml \
            | grep -q 'app.kubernetes.io/name: gameplane-telemetry-receiver'
          awk '/kind: Service/,/^---$/' /tmp/telemetry-receiver-scrape.yaml \
            | grep -q 'name: dashboard'
          # scrapeNamespaceSelector unset (the chart default): neither
          # exception renders, matching the pre-fix behavior.
          helm template gameplane charts/gameplane \
            --set serviceMonitors.enabled=true \
            --show-only templates/networkpolicies.yaml > /tmp/netpol-default.yaml
          if grep -q 'allow-prometheus-to-agent' /tmp/netpol-default.yaml; then
            echo "::error::allow-prometheus-to-agent rendered without serviceMonitors.scrapeNamespaceSelector set"
            exit 1
          fi
      - name: telemetry install values render (spec 022 FR-005, FR-006)
        # api.telemetry.enabled=false renders --telemetry-disabled; the bundled
        # receiver auto-wires the API and marks it bundled; a custom endpoint
        # is used as-is without the bundled marker; defaults render no endpoint.
        run: |
          # api.telemetry.enabled=false is the hard off switch.
          helm template gameplane charts/gameplane \
            --set api.telemetry.enabled=false \
            --show-only templates/api.yaml > /tmp/api-telemetry-off.yaml
          grep -q -- '--telemetry-disabled' /tmp/api-telemetry-off.yaml
          # The bundled receiver auto-wires the API and marks it bundled.
          helm template gameplane charts/gameplane \
            --set api.telemetry.receiver.enabled=true \
            --show-only templates/api.yaml > /tmp/api-telemetry-bundled.yaml
          grep -q -- '--telemetry-endpoint=http://gameplane-telemetry-receiver' /tmp/api-telemetry-bundled.yaml
          grep -q 'GAMEPLANE_TELEMETRY_BUNDLED' /tmp/api-telemetry-bundled.yaml
          if grep -q -- '--telemetry-disabled' /tmp/api-telemetry-bundled.yaml; then
            echo "::error::--telemetry-disabled rendered with api.telemetry.enabled left at its default"
            exit 1
          fi
          # A custom endpoint is used as-is and is never marked bundled.
          helm template gameplane charts/gameplane \
            --set api.telemetry.endpoint=https://telemetry.example.com/ingest \
            --set api.telemetry.receiver.enabled=true \
            --show-only templates/api.yaml > /tmp/api-telemetry-custom.yaml
          grep -q -- '--telemetry-endpoint=https://telemetry.example.com/ingest' /tmp/api-telemetry-custom.yaml
          if grep -q 'GAMEPLANE_TELEMETRY_BUNDLED' /tmp/api-telemetry-custom.yaml; then
            echo "::error::GAMEPLANE_TELEMETRY_BUNDLED rendered for a custom telemetry endpoint"
            exit 1
          fi
          # Defaults render no endpoint (the API falls back to its compiled-in default).
          helm template gameplane charts/gameplane \
            --show-only templates/api.yaml > /tmp/api-telemetry-default.yaml
          if grep -q -- '--telemetry-endpoint' /tmp/api-telemetry-default.yaml; then
            echo "::error::default values rendered a --telemetry-endpoint"
            exit 1
          fi
          grep -q -- '--official-module-source=default' /tmp/api-telemetry-default.yaml
      - name: telemetry receiver proof-of-work render (spec 022 FR-039, OD-5)
        # api.telemetry.receiver.ingestPow renders INGEST_POW*: off with the
        # OD-5 defaults, the configured values when enabled, and a failed
        # render for a value the receiver would refuse to start with (the
        # difficulty cap is the hardest challenge an install solves).
        run: |
          pow_env() {
            # pow_env FILE WANT...: INGEST_POW, _TARGET_PER_MIN, _MIN_BITS and
            # _MAX_BITS of the rendered receiver Deployment must equal WANT.
            python3 - "$@" <<'PY'
          import sys, yaml
          path, *want = sys.argv[1:]
          docs = [d for d in yaml.safe_load_all(open(path)) if d]
          env = {e['name']: e['value'] for d in docs if d['kind'] == 'Deployment'
                 for e in d['spec']['template']['spec']['containers'][0]['env'] if 'value' in e}
          got = [env[k] for k in ('INGEST_POW', 'INGEST_POW_TARGET_PER_MIN', 'INGEST_POW_MIN_BITS', 'INGEST_POW_MAX_BITS')]
          assert got == want, f"INGEST_POW env = {got}, want {want}"
          PY
          }
          pow_fails() {
            # pow_fails MESSAGE --set ...: the render must fail with MESSAGE.
            message="$1"; shift
            if helm template gameplane charts/gameplane --set api.telemetry.receiver.enabled=true "$@" \
                 --show-only templates/telemetry-receiver.yaml > /dev/null 2> /tmp/pow-fail.err; then
              echo "::error::receiver rendered for $*"
              exit 1
            fi
            if ! grep -q -- "$message" /tmp/pow-fail.err; then
              echo "::error::render for $* failed without '$message'"
              cat /tmp/pow-fail.err
              exit 1
            fi
          }
          pow=api.telemetry.receiver.ingestPow
          # Defaults: proof-of-work off, with the OD-5 values.
          helm template gameplane charts/gameplane \
            --set api.telemetry.receiver.enabled=true \
            --show-only templates/telemetry-receiver.yaml > /tmp/pow-default.yaml
          pow_env /tmp/pow-default.yaml false 60 0 22
          # Enabled with its own values.
          helm template gameplane charts/gameplane \
            --set api.telemetry.receiver.enabled=true \
            --set $pow.enabled=true --set $pow.targetPerMinute=30 \
            --set $pow.minBits=8 --set $pow.maxBits=26 \
            --show-only templates/telemetry-receiver.yaml > /tmp/pow-enabled.yaml
          pow_env /tmp/pow-enabled.yaml true 30 8 26
          # Values the receiver would refuse to start with fail the render.
          pow_fails 'ingestPow.targetPerMinute must be at least 1' --set $pow.targetPerMinute=0
          pow_fails 'ingestPow.maxBits must be at most 26' --set $pow.maxBits=27
          pow_fails 'ingestPow.maxBits must be at least minBits' --set $pow.minBits=10 --set $pow.maxBits=9
      - name: games Namespace carries the keep policy
        # F-212: `helm uninstall` used to delete the games Namespace and
        # every GameServer/StatefulSet/PVC in it. Assert the Namespace is
        # excluded from Helm's ownership via the keep resource-policy,
        # scoped to the Namespace document specifically (a plain grep over
        # the whole render would also match the unrelated API PVC's own
        # keep annotation and pass even if the Namespace fix regressed).
        run: |
          python3 - <<'PY'
          import sys, yaml
          docs = list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
          ns = [d for d in docs if d and d.get('kind') == 'Namespace'
                and d.get('metadata', {}).get('name') == 'gameplane-games']
          if not ns:
              sys.exit("::error::no games Namespace rendered")
          policy = (ns[0].get('metadata', {}).get('annotations') or {}).get(
              'helm.sh/resource-policy')
          if policy != 'keep':
              sys.exit(
                  "::error::games Namespace missing "
                  "helm.sh/resource-policy: keep (F-212)")
          print("games Namespace carries helm.sh/resource-policy: keep")
          PY
      - name: pre-upgrade hook targets the rendered API Deployment name (F-213)
        # A release installed under a non-default name used to render a hook
        # Role whose resourceNames named a Deployment
        # ({{ .Release.Name }}-api) the chart never actually creates — the
        # API Deployment is always named "gameplane-api" literally
        # (api.yaml), unlike the surrounding Role/RoleBinding names. Any such
        # release could install but never upgrade.
        run: |
          helm template gp charts/gameplane --namespace gpns --is-upgrade > /tmp/rendered-gp.yaml
          python3 - <<'PY'
          import sys, yaml
          docs = list(yaml.safe_load_all(open('/tmp/rendered-gp.yaml')))
          deploy_names = {d['metadata']['name'] for d in docs
                           if d and d.get('kind') == 'Deployment'}
          roles = [d for d in docs if d and d.get('kind') == 'Role'
                   and d.get('metadata', {}).get('name', '').endswith('-strategy-migrate')]
          if not roles:
              sys.exit("::error::no strategy-migrate Role rendered with --is-upgrade "
                        "(api.db.driver=sqlite is the chart default)")
          resource_names = {n for rule in roles[0].get('rules', [])
                             for n in rule.get('resourceNames', [])}
          if not resource_names & deploy_names:
              sys.exit(f"::error::pre-upgrade hook Role resourceNames {resource_names} "
                        f"does not match any rendered Deployment name {deploy_names} (F-213)")
          print(f"hook Role resourceNames {resource_names} matches a rendered Deployment")
          PY
      - name: chart renders after helm upgrade --reuse-values from v0.2.0-beta.8 (F-214)
        # `helm upgrade --reuse-values` swaps the new chart's own default
        # values.yaml for the old release's fully-resolved values before
        # rendering (helm pkg/action/upgrade.go reuseValues: chart.Values =
        # oldVals), so any value key introduced since the user's last upgrade
        # is completely absent, not just unset. Simulate that exactly: stand
        # beta.8's values.yaml in for the chart's OWN values.yaml (a plain -f
        # merge would NOT reproduce this, since -f still merges onto the new
        # chart's own defaults).
        run: |
          trap 'cp /tmp/values.yaml.orig charts/gameplane/values.yaml' EXIT
          cp charts/gameplane/values.yaml /tmp/values.yaml.orig
          cp charts/gameplane/testdata/upgrade-from-v0.2.0-beta.8-values.yaml charts/gameplane/values.yaml
          helm template gameplane charts/gameplane > /tmp/rendered-reuse-values.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered-reuse-values.yaml')) if d]
          resources = {(d['kind'], d['metadata']['name']) for d in docs}
          required = {('Deployment', 'gameplane-api'), ('Deployment', 'gameplane-web'),
                      ('PersistentVolumeClaim', 'gameplane-api-data')}
          assert required <= resources, f"reuse-values removed existing resources: {required - resources}"
          assert ('Deployment', 'gameplane-gateway') not in resources
          assert ('NetworkPolicy', 'allow-api-to-agent') in resources
          assert ('NetworkPolicy', 'allow-api-to-capture') not in resources, "legacy values without capture enabled its ingress"
          PY
          # Spec 022: with the bundled receiver and ServiceMonitors switched on
          # over beta.8's values (no persistence, dashboard, interval or enabled
          # keys), the chart still renders: no receiver PVC is added, no
          # receiver ServiceMonitor renders without a token, and the API
          # keeps working without api.telemetry.enabled.
          helm template gameplane charts/gameplane \
            --set api.telemetry.receiver.enabled=true \
            --set serviceMonitors.enabled=true > /tmp/rendered-reuse-values-receiver.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered-reuse-values-receiver.yaml')) if d]
          resources = {(d['kind'], d['metadata']['name']) for d in docs}
          assert ('Deployment', 'gameplane-telemetry-receiver') in resources
          assert ('PersistentVolumeClaim', 'gameplane-telemetry-receiver-data') not in resources, "--reuse-values added receiver storage"
          assert ('ServiceMonitor', 'gameplane-telemetry-receiver') not in resources, "receiver ServiceMonitor rendered without a dashboard token"
          PY
          # Spec 022 FR-039: beta.8's values have no ingestPow block, so the
          # receiver renders the OD-5 defaults, with proof-of-work off.
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered-reuse-values-receiver.yaml')) if d]
          env = {e['name']: e['value'] for d in docs
                 if d['kind'] == 'Deployment' and d['metadata']['name'] == 'gameplane-telemetry-receiver'
                 for e in d['spec']['template']['spec']['containers'][0]['env'] if 'value' in e}
          got = [env[k] for k in ('INGEST_POW', 'INGEST_POW_TARGET_PER_MIN', 'INGEST_POW_MIN_BITS', 'INGEST_POW_MAX_BITS')]
          assert got == ['false', '60', '0', '22'], f"--reuse-values changed the INGEST_POW defaults: {got}"
          PY
      - name: crd-manifests in sync with crds
        # The CRD-apply hook serves CRDs from crd-manifests/ (crds/ isn't
        # readable by Helm .Files). make manifests keeps both in sync; guard
        # against a drift that would apply stale CRDs on upgrade.
        run: diff -r charts/gameplane/crds charts/gameplane/crd-manifests
      - name: chart CRDs carry the current bundle-hash stamp (F-218)
        # crd-apply-hook.yaml fires on pre-install only when the live CRDs'
        # gameplane.local/crd-bundle-sha256 differs from the chart's. A stale
        # stamp (CRDs hand-copied without `make manifests`) would make a fresh
        # install skip the hook over CRDs that are actually out of date, so
        # regenerate the chart copies from operator/config/crd and fail on any
        # difference.
        run: |
          hack/sync-chart-crds.sh
          git diff --exit-code -- charts/gameplane/crds charts/gameplane/crd-manifests
      - name: chart cosign key matches root cosign.pub
        # values.yaml embeds a copy of the signing public key so the operator
        # can verify official module bundles. Nothing regenerates it, so a key
        # rotation that updates only the root file leaves the chart verifying
        # against the retired key — every official bundle then fails to install.
        # The release workflows check the root key against the signing secret;
        # this checks the chart's copy against the root key.
        run: |
          helm template gameplane charts/gameplane \
            --set defaultModuleSource.oci.verify.enabled=true \
            --show-only templates/module-cosign-key.yaml > /tmp/keysecret.yaml
          # The rendered Secret carries the key under stringData/data; pull the
          # PEM back out and compare it to the committed root key.
          python3 - <<'PY' > /tmp/chart-cosign.pub
          import base64, sys, yaml
          d = yaml.safe_load(open('/tmp/keysecret.yaml'))
          data = (d.get('stringData') or {}).get('cosign.pub')
          if data is None:
              data = base64.b64decode((d.get('data') or {})['cosign.pub']).decode()
          sys.stdout.write(data if data.endswith('\n') else data + '\n')
          PY
          if ! diff -u cosign.pub /tmp/chart-cosign.pub; then
            echo "::error::charts/gameplane/values.yaml cosignPublicKey does not match the root cosign.pub — update both when rotating the signing key"
            exit 1
          fi
          echo "chart cosign key matches root cosign.pub"
      - name: docs/oidc.md example values render (F-252)
        # docs/oidc.md's Keycloak "Or in values.yaml" example is meant to be
        # copy-pasteable. Render it as a real -f values file (with
        # api.oidc.enabled: true, since the doc's own example turns it on)
        # and fail if the object-shaped clientSecretRef the chart schema
        # expects ever regresses to the bare string the doc used to show.
        run: |
          python3 - <<'PY' > /tmp/oidc-example-values.yaml
          import re
          text = open('docs/oidc.md').read()
          m = re.search(r"Or in `values\.yaml`:\n```yaml\n(.*?)\n```", text, re.S)
          if not m:
              raise SystemExit("could not find the Keycloak 'Or in values.yaml' example in docs/oidc.md")
          print(m.group(1))
          PY
          helm template gameplane charts/gameplane \
            -f /tmp/oidc-example-values.yaml \
            --show-only templates/api.yaml > /tmp/rendered-oidc.yaml
          grep -q 'GAMEPLANE_OIDC_CLIENT_SECRET' /tmp/rendered-oidc.yaml
          grep -q 'name: keycloak-oidc-secret' /tmp/rendered-oidc.yaml
          grep -qE 'key: +clientSecret' /tmp/rendered-oidc.yaml

  workflow-lint:
    name: workflow lint
    needs: [changes]
    if: needs.changes.outputs.github == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (download and verify)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz
          # sha256sum -c exits non-zero on mismatch, and set -e aborts the step:
          # the binary never executes unless it matches the pinned digest.
          echo "f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz
          # actionlint takes workflow FILE paths, not a directory. With no
          # arguments it discovers every workflow in the repository itself,
          # so run it from the checkout root.
          cd "$GITHUB_WORKSPACE"
          "$tmp/actionlint"
      - name: ci report job coverage (F-238)
        run: ./hack/check-ci-report-coverage.sh
      - name: test ci report job coverage checker
        run: ./hack/test-check-ci-report-coverage.sh
      - name: publish-edge.yaml path coverage (F-239)
        run: ./hack/check-publish-edge-paths.sh
      - name: test publish-edge.yaml path coverage checker
        run: ./hack/test-check-publish-edge-paths.sh
      # This gate makes SC-001 ("100% SHA-pinned") mechanically true by failing on
      # unpinned uses and ref-version mismatches. The four deferred rules and their
      # tracking are defined in .github/zizmor.yml.
      - name: CI scope regression tests
        run: make test-ci-scope
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          advanced-security: false
          persona: regular

  # Unit tests for probe protocol packages (minecraft, terraria, etc).
  # These are in test/e2e but are untagged Go unit tests, not integration
  # tests, so they run without a cluster or build tags. Gated on e2e
  # changes since the tests live in the e2e directory (covered by e2etree
  # filter). This job intentionally runs no coverage — test/e2e has no
  # .testcoverage.yml and is excluded from the coverage gates.
  go-e2e-unit:
    name: go (test/e2e)
    needs: [changes]
    if: needs.changes.outputs.e2e-unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e-unit
      - name: go vet
        working-directory: test/e2e
        run: go vet ./...
      - name: unit test (probe protocols)
        working-directory: test/e2e
        run: go test ./...

  # The api's PostgreSQL backend (--db-driver=postgres) is compiled only
  # with -tags postgres, so the `go` matrix and `lint` never build it. This
  # job builds and vets api with the tag and runs api/internal/db's tests
  # against a real PostgreSQL service; the db_postgres_test.go tests skip
  # unless GAMEPLANE_TEST_POSTGRES_DSN is set. The server keeps the image's
  # default (non-C) locale on purpose: TestPostgres_TextOrderingIsByteWise
  # checks the migrations' COLLATE "C" columns sort byte-wise regardless.
  # The name must not start with "go (" or the report's `go` matcher would
  # absorb it.
  api-postgres:
    name: api (postgres)
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.modules), 'api')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # Throwaway CI-only server reachable only from this job's runner.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gameplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gameplane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: api-postgres
      - name: go mod download
        working-directory: api
        # Same transient-proxy retry as the `go` job; see the comment there.
        env:
          GOSUMDB: "off"
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt ${attempt}/5) — retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          go mod download
      - name: go build -tags postgres
        working-directory: api
        run: go build -tags postgres ./...
      - name: go vet -tags postgres
        working-directory: api
        run: go vet -tags postgres ./...
      - name: test api/internal/db against PostgreSQL
        working-directory: api
        env:
          GAMEPLANE_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/gameplane_test?sslmode=disable
        run: go test -tags postgres -count=1 ./internal/db/...

  # ---------------------------------------------------------------------
  # kind e2e — one job per suite, each with its own throwaway cluster on
  # its own VM. No `needs` edges: a broken unit test doesn't gate e2e
  # feedback, and the per-ref concurrency group above still cancels
  # superseded runs. VMs are discarded after the job, so there is no
  # teardown step and no cross-run cluster-name collision to guard.
  # Which tests run in which job is defined ONLY in test/e2e/buckets.sh;
  # the e2e-buckets job proves the buckets cover the whole suite.
  # ---------------------------------------------------------------------
  e2e-buckets:
    name: e2e bucket coverage
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: verify buckets are disjoint + exhaustive
        run: ./test/e2e/buckets.sh verify
      - name: verify game protocol coverage
        run: ./test/e2e/joincoverage.sh verify
      # The fixtures are what prove the gate above can actually fail. Without
      # running them, a verifier that silently passed everything would look
      # identical to a working one.
      - name: verify the coverage gate can fail
        run: ./test/e2e/joincoverage_test.sh
      - name: verify lint gate configuration
        run: ./test/e2e/lint-gate-verify.sh verify
      - name: verify the lint gate can fail
        run: ./test/e2e/lint-gate-verify_test.sh

  e2e-go:
    name: e2e ${{ matrix.bucket }} / ${{ matrix.arch }} (kind)
    needs: [changes, build-images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.job_timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Buckets are cut by login pressure, not feature area — see the
        # header comment in test/e2e/buckets.sh. The suite runs with
        # t.Parallel(); `parallel` bounds in-flight tests per bucket
        # (operator does zero logins and is wait-dominated, so it runs
        # wide; the api buckets stay within the login limiter's budget).
        # The arm64 job below uses the same steps and per-bucket settings.
        bucket: [operator, api-auth, api-roles, api-rbac, api-agent, api-mods, telemetry]
        arch: [amd64]
        include:
          - bucket: operator
            parallel: 8
            test_timeout: 20m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-auth
            parallel: 4
            test_timeout: 15m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
            tail: ratelimit
          - bucket: api-roles
            parallel: 3
            test_timeout: 10m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-rbac
            parallel: 4
            test_timeout: 10m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-agent
            parallel: 4
            test_timeout: 15m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-mods
            parallel: 2
            test_timeout: 15m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: telemetry
            parallel: 1
            test_timeout: 45m # the lifecycle test waits on 1m report intervals for every subtest
            job_timeout: 75 # Boots a kind cluster, installs the chart, runs the bucket's suite.
    env:
      CLUSTER: gameplane-e2e
      CTX: kind-gameplane-e2e
    steps: &e2e-go-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: load images
        uses: ./.github/actions/e2e-images
        with:
          arch: ${{ matrix.arch }}
      - name: bring up cluster + helm install
        run: ./deploy/kind/e2e.sh up "$CLUSTER" e2e
      - name: run go e2e (${{ matrix.bucket }})
        run: |
          RUN_REGEX="$(./test/e2e/buckets.sh regex '${{ matrix.bucket }}')"
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            go test -tags=e2e -timeout ${{ matrix.test_timeout }} -v \
              -parallel ${{ matrix.parallel }} -run "$RUN_REGEX" ./...
      - name: run go e2e (ratelimit tail)
        # LAST on purpose: this test deliberately drains the shared per-IP
        # and per-username login buckets; anything running after it queues
        # behind the refill.
        if: matrix.tail == 'ratelimit'
        run: |
          RUN_REGEX="$(./test/e2e/buckets.sh regex ratelimit)"
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            go test -tags=e2e -timeout 5m -v -run "$RUN_REGEX" ./...
      - name: dump cluster state on failure (e2e-go)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
          namespaces: "gameplane-system,gameplane-games"
          include-previous-logs: "true"

  e2e-go-arm64:
    name: e2e ${{ matrix.bucket }} / ${{ matrix.arch }} (kind)
    needs: [changes, build-images-arm64]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.job_timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Buckets are cut by login pressure, not feature area — see the
        # header comment in test/e2e/buckets.sh. The suite runs with
        # t.Parallel(); `parallel` bounds in-flight tests per bucket
        # (operator does zero logins and is wait-dominated, so it runs
        # wide; the api buckets stay within the login limiter's budget).
        # Mirrors e2e-go's steps and per-bucket settings.
        bucket: [operator, api-auth, api-roles, api-rbac, api-agent, api-mods, telemetry]
        arch: [arm64]
        include:
          - bucket: operator
            parallel: 8
            test_timeout: 20m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-auth
            parallel: 4
            test_timeout: 15m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
            tail: ratelimit
          - bucket: api-roles
            parallel: 3
            test_timeout: 10m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-rbac
            parallel: 4
            test_timeout: 10m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-agent
            parallel: 4
            test_timeout: 15m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: api-mods
            parallel: 2
            test_timeout: 15m
            job_timeout: 60 # Boots a kind cluster, installs the chart, runs the bucket's suite.
          - bucket: telemetry
            parallel: 1
            test_timeout: 45m # the lifecycle test waits on 1m report intervals for every subtest
            job_timeout: 75 # Boots a kind cluster, installs the chart, runs the bucket's suite.
    env:
      CLUSTER: gameplane-e2e
      CTX: kind-gameplane-e2e
    steps: *e2e-go-steps

  # Dual-cluster ?cluster= dispatch + scoped RBAC (test/e2e/multicluster_e2e_test.go).
  # Split out from e2e-go: it's the only bucket that needs a SECOND kind
  # cluster (registered as a remote target via POST /clusters), so it gets
  # its own job rather than complicating the single-cluster matrix above.

  e2e-multicluster:
    name: e2e multicluster / ${{ matrix.arch }} (kind x2)
    needs: [changes, build-images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60 # Same, across two clusters.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    env:
      CLUSTER: gameplane-e2e
      CLUSTER_B: gameplane-e2e-b
      CTX: kind-gameplane-e2e
      CTX_B: kind-gameplane-e2e-b
    steps: &e2e-multicluster-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: load images
        uses: ./.github/actions/e2e-images
        with:
          arch: ${{ matrix.arch }}
      - name: bring up cluster A + helm install
        run: ./deploy/kind/e2e.sh up "$CLUSTER" e2e
      - name: bring up cluster B + helm install
        # A second, fully independent kind cluster with the same chart
        # installed — it needs its own operator to reconcile the GameServer
        # this test dispatches to it. kind attaches every cluster's nodes to
        # the same docker bridge network ("kind"), so cluster A's api/
        # operator pods can reach cluster B's control-plane container by its
        # docker-network IP; see multicluster_e2e_test.go's package doc.
        run: ./deploy/kind/e2e.sh up "$CLUSTER_B" e2e
      - name: run go e2e (multicluster)
        # GatewayParity installs this checkout's real gateway chart on B with
        # temporary PKI, exercises agent/capture/Minecraft paths from A, and
        # rotates trust/endpoints. Missing second-cluster infra fails in CI.
        run: |
          RUN_REGEX="$(./test/e2e/buckets.sh regex multicluster)"
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            GAMEPLANE_E2E_CLUSTER_B="$CLUSTER_B" \
            GAMEPLANE_E2E_REQUIRE_GATEWAY=1 \
            go test -tags=e2e -timeout 45m -v -run "$RUN_REGEX" ./...
      - name: dump cluster state on failure (multicluster A)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
      - name: dump cluster state on failure (multicluster B)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX_B }}
          include-api-logs: "false"

  e2e-multicluster-arm64:
    name: e2e multicluster / ${{ matrix.arch }} (kind x2)
    needs: [changes, build-images-arm64]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60 # Same, across two clusters.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      CLUSTER: gameplane-e2e
      CLUSTER_B: gameplane-e2e-b
      CTX: kind-gameplane-e2e
      CTX_B: kind-gameplane-e2e-b
    steps: *e2e-multicluster-steps

  # helm upgrade from the last published release to this tree
  # (test/e2e/upgrade_e2e_test.go). Split out from e2e-go for the same reason
  # as multicluster: its cluster is set up differently. Every other job
  # installs the working-tree chart; this one installs the PUBLISHED chart and
  # PUBLISHED GHCR images of the previous release, then upgrades onto the tree
  # — so it cannot share a cluster with anything, and needs network access to
  # ghcr.io that the other kind jobs do not.

  e2e-upgrade:
    name: e2e upgrade / ${{ matrix.arch }} (kind)
    needs: [changes, build-images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60 # Same, plus a chart upgrade across versions.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    env:
      CLUSTER: gameplane-upgrade
      CTX: kind-gameplane-upgrade
      # The release to upgrade FROM. Bump at release time to the previous
      # published version. deploy/kind/upgrade.sh carries the same default.
      GAMEPLANE_UPGRADE_FROM: 0.2.0-beta.8
    steps: &e2e-upgrade-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: load images
        uses: ./.github/actions/e2e-images
        with:
          arch: ${{ matrix.arch }}
      - name: bring up cluster on the PREVIOUS release
        run: ./deploy/kind/upgrade.sh up "$CLUSTER" e2e
      - name: run go e2e (upgrade)
        run: |
          RUN_REGEX="$(./test/e2e/buckets.sh regex upgrade)"
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            go test -tags=e2e -timeout 25m -v -run "$RUN_REGEX" ./...
      - name: dump cluster state on failure (e2e-upgrade)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
          include-helm-history: "true"
          include-get-jobs: "true"


  e2e-upgrade-arm64:
    name: e2e upgrade / ${{ matrix.arch }} (kind)
    needs: [changes, build-images-arm64]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60 # Same, plus a chart upgrade across versions.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      CLUSTER: gameplane-upgrade
      CTX: kind-gameplane-upgrade
      # The release to upgrade FROM. Bump at release time to the previous
      # published version. deploy/kind/upgrade.sh carries the same default.
      GAMEPLANE_UPGRADE_FROM: 0.2.0-beta.8
    steps: *e2e-upgrade-steps

  e2e-web-live:
    name: e2e web live / ${{ matrix.arch }} (kind)
    needs: [changes, build-images]
    if: needs.changes.outputs.weblive == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60 # Same, plus a live dashboard drive.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    env:
      CLUSTER: gameplane-e2e
      CTX: kind-gameplane-e2e
    steps: &e2e-web-live-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: load images
        uses: ./.github/actions/e2e-images
        with:
          arch: ${{ matrix.arch }}
      - name: bring up cluster + helm install
        run: ./deploy/kind/e2e.sh up "$CLUSTER" e2e
      - name: bootstrap admin
        # Playwright's live-mode globalSetup (web/e2e/globalSetup.ts) reads
        # the admin password from test/e2e/.tmp/admin-password, which this
        # test writes.
        run: |
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            go test -tags=e2e -timeout 5m -v -run '^TestAPI_BootstrapAndLogin$' ./...
      - name: playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: install playwright browser
        run: |
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: run playwright (live)
        env:
          GAMEPLANE_E2E_TARGET: live
          GAMEPLANE_E2E_CLUSTER: ${{ env.CLUSTER }}
        run: |
          cd web && npm run test:e2e:live
      - name: dump cluster state on failure (e2e-web-live)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
          include-operator-logs: "false"
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-live-${{ matrix.arch }}
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: warn


  e2e-web-live-arm64:
    name: e2e web live / ${{ matrix.arch }} (kind)
    needs: [changes, build-images-arm64]
    if: needs.changes.outputs.weblive == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60 # Same, plus a live dashboard drive.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      CLUSTER: gameplane-e2e
      CTX: kind-gameplane-e2e
    steps: *e2e-web-live-steps

  e2e-game-bot:
    name: e2e game bot / ${{ matrix.test }} (kind)
    needs: [changes, build-images]
    if: needs.changes.outputs.e2e == 'true'
    # amd64 only: this boots the external itzg/minecraft-server (multi-arch) AND
    # passivelemon/terraria-docker, whose arm64 support is unverified upstream —
    # so an arm64 leg would fail on the Terraria pull. Add an arch axis here once
    # an arm-capable Terraria image is confirmed/pinned.
    runs-on: ubuntu-latest
    # Two serial real-game boots (Minecraft, then Terraria — deliberately
    # not parallel: two game servers booting at once OOM-starve the node).
    timeout-minutes: 60 # Pulls multi-GB game images, boots real servers, runs protocol joins.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.bot-matrix) }}
    env:
      BOT_TEST: ${{ matrix.test }}
      CLUSTER: gameplane-e2e
      CTX: kind-gameplane-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: load images
        uses: ./.github/actions/e2e-images
      - name: bring up cluster + helm install
        run: ./deploy/kind/e2e.sh up "$CLUSTER" e2e
      - name: run go e2e (game bot)
        # Blocking. The bot runs as a Job inside the cluster and dials the game
        # Service directly, removing the `kubectl port-forward` hop this job's
        # flakiness was once blamed on. (That blame turned out to be wrong: the
        # real failures were a too-long bot username and a drifted Terraria image
        # tag, both fixed. The in-cluster harness is still what exercises the
        # network path a real client uses.)
        run: |
          RUN_REGEX="^${BOT_TEST}$"
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            GAMEPLANE_E2E_GAME_BOT=1 \
            go test -tags=e2e -timeout 30m -v -run "$RUN_REGEX" ./...
      - name: dump cluster state on failure (e2e-game-bot)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
          namespaces: "gameplane-system,gameplane-games"

  # Capture-overhead regression guard (spec 007, FR-006..FR-008). This is a
  # gross-regression guard, NOT SC-002 certification: the certified number is
  # the live-cluster manual benchmark in
  # specs/done_003-network-capture-sidecar/sc-002-benchmark.md. It never blocks
  # a merge (OD-1, maintainer ruling 2026-10-09): job-level continue-on-error
  # keeps the workflow and PRs mergeable. A detected regression turns this job
  # red and is recorded in capture-overhead-metrics.json (uploaded below).
  # Runs on master pushes, and on PRs only when the diff touches the capture
  # path or the probe (OD-2, changes.outputs.capture_overhead).
  e2e-capture-overhead:
    name: e2e capture overhead (kind)
    needs: [changes, build-images]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.e2e == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.capture_overhead == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    env:
      CLUSTER: gameplane-e2e
      CTX: kind-gameplane-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
        with:
          key-suffix: e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: load images
        uses: ./.github/actions/e2e-images
      - name: bring up cluster + helm install
        run: ./deploy/kind/e2e.sh up "$CLUSTER" e2e
      - name: run go e2e (capture overhead)
        # Sustained-mode probes against the real itzg/minecraft-server image.
        # The bucket (test/e2e/buckets.sh, capture-overhead) owns the test list;
        # it is deliberately not in bot-fast, whose legs block merges.
        env:
          GAMEPLANE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/capture-overhead
        run: |
          RUN_REGEX="$(./test/e2e/buckets.sh regex capture-overhead)"
          mkdir -p "$GAMEPLANE_E2E_ARTIFACT_DIR"
          cd test/e2e && \
            GAMEPLANE_E2E_REUSE_CLUSTER=1 \
            GAMEPLANE_E2E_CLUSTER="$CLUSTER" \
            GAMEPLANE_E2E_GAME_BOT=1 \
            go test -tags=e2e -timeout 40m -v -run "$RUN_REGEX" ./...
      - name: upload capture overhead metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-overhead-metrics
          path: ${{ runner.temp }}/capture-overhead/capture-overhead-metrics.json
          retention-days: 7
          if-no-files-found: warn
      - name: dump cluster state on failure (e2e-capture-overhead)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
          namespaces: "gameplane-system,gameplane-games"

  # Smoke-tests the dev ingress-nginx manifest pin (deploy/kind/up.sh,
  # INGRESS_NGINX_VERSION) on the same Kind node config `make dev-up` uses
  # (deploy/kind/cluster.yaml — the ingress-ready control-plane node label
  # and the 8080/8443/30565 extraPortMappings the ingress-nginx Kind
  # manifest's controller Service depends on). Nothing else in CI applies
  # this manifest (deploy/kind/e2e.sh deliberately skips ingress-nginx — see
  # its header comment), so a pin bump whose kind manifest moved, or whose
  # controller no longer reaches Available on the runner's Kind node image,
  # was previously only caught by a developer running `make dev-up` (#521).
  #
  # Gated on `kindsmoke` (deploy/kind/** or this workflow file), not the
  # broad `e2e` gate: a Go/chart/test-tree change doesn't touch the pinned
  # manifest or the cluster config this job exercises, so it stays out of
  # every other PR's critical path.
  e2e-kind-ingress-smoke:
    name: ingress-nginx smoke (kind)
    needs: [changes]
    if: needs.changes.outputs.kindsmoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLUSTER: gameplane-dev
      CTX: kind-gameplane-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: read ingress-nginx version pin from up.sh
        id: pin
        # Single source of truth: deploy/kind/up.sh's INGRESS_NGINX_VERSION=
        # line. Never duplicate the version here — read it back instead, so
        # this job smoke-tests whatever `make dev-up` actually installs.
        run: |
          VERSION="$(sed -n 's/^INGRESS_NGINX_VERSION="\(.*\)"$/\1/p' deploy/kind/up.sh)"
          if [ -z "$VERSION" ] || [ "$(printf '%s\n' "$VERSION" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one INGRESS_NGINX_VERSION=\"...\" line in deploy/kind/up.sh" >&2
            exit 1
          fi
          echo "found INGRESS_NGINX_VERSION=${VERSION} in deploy/kind/up.sh"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: create kind cluster (dev config)
        # Same node config make dev-up uses (deploy/kind/cluster.yaml), not
        # e2e.sh's single-node config — the ingress-ready node label and the
        # host port mappings it carries are exactly what this job is meant
        # to exercise.
        run: kind create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml
      - name: install ingress-nginx at the pinned version
        env:
          INGRESS_NGINX_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          kubectl --context "$CTX" apply -f \
            "https://raw.githubusercontent.com/kubernetes/ingress-nginx/${INGRESS_NGINX_VERSION}/deploy/static/provider/kind/deploy.yaml"
      - name: wait for ingress-nginx-controller to become Available
        # rollout status, not `wait --for=condition=Available`: the manifest
        # sets maxUnavailable: 1 on a one-replica Deployment, so its
        # Available condition is True before any controller pod is ready.
        run: |
          kubectl --context "$CTX" rollout status --namespace ingress-nginx \
            deployment/ingress-nginx-controller --timeout=180s
      - name: dump cluster state on failure (e2e-kind-ingress-smoke)
        if: failure()
        uses: ./.github/actions/dump-cluster-state
        with:
          context: ${{ env.CTX }}
          namespaces: "ingress-nginx"
          include-operator-logs: "false"
          include-api-logs: "false"
      - name: delete kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER" || true

  # Runs after every other job and publishes one build report: which jobs
  # failed and where, measured coverage against each gate, changed files by
  # area (PRs only), the slowest job legs, and which e2e buckets actually
  # ran. Always writes the Actions job-summary panel; on pull_request it also
  # upserts a single sticky PR comment (tagged with a hidden marker so
  # re-runs update it in place instead of piling up).
  #
  # `if: always()` so a red run still gets a report. Every data-gathering and
  # publishing step is defensive (set +e, continue-on-error) so a broken
  # report can never turn a green build red or hide a real failure — a fork
  # PR's read-only token, for example, makes the comment step a no-op but
  # never fails the job.
  report:
    name: ci report
    needs:
      [
        changes,
        build-images,
        build-images-arm64,
        capture-sidecar-setcap-proof,
        docs,
        lint,
        go,
        web,
        web-e2e-mock,
        helm,
        chart-template,
        workflow-lint,
        go-e2e-unit,
        api-postgres,
        e2e-buckets,
        e2e-go,
        e2e-go-arm64,
        e2e-multicluster,
        e2e-multicluster-arm64,
        e2e-upgrade,
        e2e-upgrade-arm64,
        e2e-web-live,
        e2e-web-live-arm64,
        e2e-game-bot,
        e2e-capture-overhead,
        e2e-kind-ingress-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads back the coverage/* commit statuses published near web:287.
      statuses: read
      # Upserts the sticky PR comment. On a fork PR this permission is
      # downgraded to read-only by GitHub regardless of what's requested
      # here, which the comment step detects and skips quietly.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gather data
        id: gather
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          SHA="${HEAD_SHA:-$RUN_SHA}"
          echo "$SHA" > /tmp/sha.txt

          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json 2>/tmp/jobs.err
          [ -s /tmp/jobs.json ] || echo '{"jobs":[]}' > /tmp/jobs.json

          gh api "repos/$REPO/commits/$SHA/statuses?per_page=100" > /tmp/statuses.json 2>/tmp/statuses.err
          [ -s /tmp/statuses.json ] || echo '[]' > /tmp/statuses.json

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate > /tmp/files.json 2>/tmp/files.err
            [ -s /tmp/files.json ] || echo '[]' > /tmp/files.json
          else
            echo '[]' > /tmp/files.json
          fi
          exit 0

      - name: render report
        id: render
        continue-on-error: true
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set +e
          printf '%s' "$NEEDS_JSON" > /tmp/needs.json
          [ -s /tmp/needs.json ] || echo '{}' > /tmp/needs.json
          cat > /tmp/render.cjs <<'JSEOF'
          const fs = require('node:fs');

          function safe(fn, fallback) {
            try { return fn(); } catch { return fallback; }
          }

          function readJSON(path, fallback) {
            return safe(() => JSON.parse(fs.readFileSync(path, 'utf8')), fallback);
          }

          function fmtDuration(ms) {
            if (ms == null || !Number.isFinite(ms) || ms < 0) return 'unknown';
            const totalSec = Math.round(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return m > 0 ? m + 'm' + s + 's' : s + 's';
          }

          function render() {
            const HEAD = safe(() => fs.readFileSync('/tmp/sha.txt', 'utf8').trim(), '');
            const SHORT = HEAD ? HEAD.slice(0, 7) : 'unknown';
            const EVENT = process.env.EVENT_NAME || '';

            const needs = readJSON('/tmp/needs.json', {});
            const jobsResp = readJSON('/tmp/jobs.json', { jobs: [] });
            const apiJobs = Array.isArray(jobsResp.jobs) ? jobsResp.jobs : [];
            const statuses = readJSON('/tmp/statuses.json', []);
            const files = readJSON('/tmp/files.json', []);

            const NEEDS_ORDER = [
              'changes', 'build-images', 'build-images-arm64',
              'capture-sidecar-setcap-proof', 'docs', 'lint', 'go',
              'web', 'web-e2e-mock', 'helm', 'chart-template', 'workflow-lint', 'go-e2e-unit',
              'api-postgres',
              'e2e-buckets', 'e2e-go', 'e2e-go-arm64', 'e2e-multicluster', 'e2e-multicluster-arm64', 'e2e-upgrade', 'e2e-upgrade-arm64',
              'e2e-web-live', 'e2e-web-live-arm64', 'e2e-game-bot', 'e2e-capture-overhead', 'e2e-kind-ingress-smoke',
            ];

            // Maps each workflow job id to how its `name:` field (as reported by
            // the jobs API, with matrix values interpolated) can be recognized.
            // Kept in sync by hand with the `name:` fields above.
            const JOB_MATCHERS = {
              changes: (n) => n === 'detect changes',
              'build-images': (n) => n === 'build e2e images',
              'build-images-arm64': (n) => n === 'build e2e images (arm64)',
              'capture-sidecar-setcap-proof': (n) => n === 'capture-sidecar CAP_NET_RAW survival',
              docs: (n) => n === 'docs and repository checks',
              lint: (n) => n.startsWith('lint ('),
              go: (n) => n.startsWith('go (') && n !== 'go (test/e2e)',
              web: (n) => n === 'web',
              'web-e2e-mock': (n) => n === 'web e2e (mock)',
              helm: (n) => n === 'helm lint',
              'chart-template': (n) => n === 'chart render',
              'workflow-lint': (n) => n === 'workflow lint',
              'go-e2e-unit': (n) => n === 'go (test/e2e)',
              'api-postgres': (n) => n === 'api (postgres)',
              'e2e-buckets': (n) => n === 'e2e bucket coverage',
              'e2e-go': (n) => /^e2e (operator|api-auth|api-roles|api-rbac|api-agent|api-mods|telemetry) \//.test(n) && n.includes('/ amd64 '),
              'e2e-go-arm64': (n) => /^e2e (operator|api-auth|api-roles|api-rbac|api-agent|api-mods|telemetry) \//.test(n) && n.includes('/ arm64 '),
              'e2e-multicluster': (n) => n.startsWith('e2e multicluster /') && n.includes('/ amd64 '),
              'e2e-multicluster-arm64': (n) => n.startsWith('e2e multicluster /') && n.includes('/ arm64 '),
              'e2e-upgrade': (n) => n.startsWith('e2e upgrade /') && n.includes('/ amd64 '),
              'e2e-upgrade-arm64': (n) => n.startsWith('e2e upgrade /') && n.includes('/ arm64 '),
              'e2e-web-live': (n) => n.startsWith('e2e web live /') && n.includes('/ amd64 '),
              'e2e-web-live-arm64': (n) => n.startsWith('e2e web live /') && n.includes('/ arm64 '),
              'e2e-game-bot': (n) => n.startsWith('e2e game bot /'),
              'e2e-capture-overhead': (n) => n === 'e2e capture overhead (kind)',
              'e2e-kind-ingress-smoke': (n) => n === 'ingress-nginx smoke (kind)',
            };

            let passed = 0, failed = 0, skipped = 0, cancelled = 0;
            const failingRows = [];
            for (const key of NEEDS_ORDER) {
              const entry = needs[key];
              const result = entry && entry.result;
              if (result === 'success') {
                passed++;
              } else if (result === 'skipped') {
                skipped++;
              } else if (result === 'cancelled') {
                cancelled++;
              } else {
                failed++;
                const matcher = JOB_MATCHERS[key];
                let url = null;
                if (matcher) {
                  const candidates = apiJobs.filter((j) => matcher(j.name || ''));
                  const bad = candidates.find((j) => j.conclusion && j.conclusion !== 'success');
                  url = (bad || candidates[0] || {}).html_url || null;
                }
                failingRows.push({ key, result: result || 'unknown', url });
              }
            }

            // Wall-clock span across every non-report job leg, for the headline.
            let minStart = null, maxEnd = null;
            for (const j of apiJobs) {
              if (j.name === 'ci report') continue;
              const s = j.started_at ? Date.parse(j.started_at) : NaN;
              const e = j.completed_at ? Date.parse(j.completed_at) : NaN;
              if (Number.isFinite(s) && (minStart === null || s < minStart)) minStart = s;
              if (Number.isFinite(e) && (maxEnd === null || e > maxEnd)) maxEnd = e;
            }
            const elapsed = (minStart !== null && maxEnd !== null) ? fmtDuration(maxEnd - minStart) : 'unknown';

            // Slowest individual job legs (each matrix combination is its own
            // API job entry), excluding this report job itself.
            const durations = apiJobs
              .filter((j) => j.name !== 'ci report' && j.started_at && j.completed_at)
              .map((j) => ({ name: j.name, ms: Date.parse(j.completed_at) - Date.parse(j.started_at) }))
              .filter((j) => Number.isFinite(j.ms) && j.ms >= 0)
              .sort((a, b) => b.ms - a.ms)
              .slice(0, 5);

            // Coverage: read back whatever coverage/* commit statuses are on the
            // head sha, and pair each against its gate read from the repo
            // (web/vitest.config.ts, or <module>/.testcoverage.yml for Go).
            function parseVitestGates() {
              const src = fs.readFileSync('web/vitest.config.ts', 'utf8');
              const grab = (name) => {
                const m = src.match(new RegExp(name + '\\s*:\\s*([0-9.]+)'));
                return m ? Number(m[1]) : null;
              };
              return { L: grab('lines'), F: grab('functions'), B: grab('branches'), S: grab('statements') };
            }
            const vitestGates = safe(parseVitestGates, null);

            function parseGoGate(mod) {
              const src = fs.readFileSync(mod + '/.testcoverage.yml', 'utf8');
              const m = src.match(/threshold:[\s\S]*?total:\s*([0-9.]+)/);
              return m ? Number(m[1]) : null;
            }

            const seenContexts = new Set();
            const coverageRows = [];
            for (const st of Array.isArray(statuses) ? statuses : []) {
              const ctx = st && st.context;
              if (!ctx || !ctx.startsWith('coverage/') || seenContexts.has(ctx)) continue;
              seenContexts.add(ctx);
              const mod = ctx.slice('coverage/'.length);
              const desc = st.description || '';
              if (mod === 'web' && vitestGates) {
                const measured = {};
                for (const letter of ['L', 'S', 'B', 'F']) {
                  const m = desc.match(new RegExp(letter + '([0-9.]+)'));
                  if (m) measured[letter] = Number(m[1]);
                }
                const gateStr = ['L', 'S', 'B', 'F']
                  .map((l) => (vitestGates[l] != null ? l + vitestGates[l] : l + '-'))
                  .join(' ');
                let margin = null;
                for (const l of ['L', 'S', 'B', 'F']) {
                  if (measured[l] != null && vitestGates[l] != null) {
                    const d = measured[l] - vitestGates[l];
                    if (margin === null || d < margin) margin = d;
                  }
                }
                coverageRows.push({
                  module: mod,
                  measured: desc || '-',
                  gate: gateStr,
                  margin: margin !== null ? (margin >= 0 ? '+' + margin.toFixed(2) : margin.toFixed(2)) : '-',
                });
              } else {
                const gate = safe(() => parseGoGate(mod), null);
                const mMeasured = desc.match(/([0-9]+(\.[0-9]+)?)/);
                const measuredNum = mMeasured ? Number(mMeasured[1]) : null;
                let margin = '-';
                if (gate != null && measuredNum != null) {
                  const d = measuredNum - gate;
                  margin = d >= 0 ? '+' + d.toFixed(2) : d.toFixed(2);
                }
                coverageRows.push({
                  module: mod,
                  measured: desc || '-',
                  gate: gate != null ? gate + '%' : '-',
                  margin,
                });
              }
            }

            // Changed files by top-level area, PR events only.
            let changedRows = [];
            if (EVENT === 'pull_request' && Array.isArray(files)) {
              const byArea = new Map();
              for (const f of files) {
                const name = f && f.filename;
                if (!name) continue;
                const slash = name.indexOf('/');
                const area = slash === -1 ? '(root)' : name.slice(0, slash + 1);
                const cur = byArea.get(area) || { count: 0, add: 0, del: 0 };
                cur.count++;
                cur.add += f.additions || 0;
                cur.del += f.deletions || 0;
                byArea.set(area, cur);
              }
              changedRows = [...byArea.entries()]
                .map(([area, v]) => ({ area, files: v.count, plus: v.add, minus: v.del }))
                .sort((a, b) => (b.plus + b.minus) - (a.plus + a.minus));
            }

            // e2e buckets that actually executed, derived from the e2e-go
            // matrix leg names plus the multicluster/upgrade/game-bot jobs.
            const bucketSet = new Set();
            for (const j of apiJobs) {
              const n = j.name || '';
              const m = n.match(/^e2e (operator|api-auth|api-roles|api-rbac|api-agent|api-mods|telemetry) \//);
              if (m) bucketSet.add(m[1]);
              if (/^e2e multicluster \//.test(n)) bucketSet.add('multicluster');
              if (/^e2e upgrade \//.test(n)) bucketSet.add('upgrade');
              // The ratelimit bucket runs as a trailing step inside the
              // api-auth job leg (deliberately, so it drains the shared
              // login buckets last), not as its own job — so it never
              // matches a job-name regex. Read the step-level conclusion:
              // the step is skipped (not "success") when the api-auth
              // bucket step itself failed first.
              if (/^e2e api-auth \//.test(n) && Array.isArray(j.steps)) {
                const tail = j.steps.find((s) => s.name === 'run go e2e (ratelimit tail)');
                if (tail && tail.conclusion === 'success') bucketSet.add('ratelimit');
              }
            }
            const gameBot = needs['e2e-game-bot'];
            if (gameBot && gameBot.result && gameBot.result !== 'skipped') bucketSet.add('bot-fast');
            const buckets = [...bucketSet].sort();

            // --- render ---
            let md = '';
            md += '<!-- ci-report -->\n';
            const RUN_ID = process.env.RUN_ID || '';
            const RUN_ATTEMPT = process.env.RUN_ATTEMPT || '1';
            const REPO_SLUG = process.env.REPO_SLUG || '';
            // Name the run and attempt: a re-run of failed jobs bumps the attempt
            // without re-rendering this comment, so without these a stale report
            // is indistinguishable from a current one.
            const runLink = (RUN_ID && REPO_SLUG)
              ? '[run ' + RUN_ID + '](https://github.com/' + REPO_SLUG + '/actions/runs/' + RUN_ID + ')'
              : 'run unknown';
            md += '## CI Report - ' + SHORT + '\n';
            md += '_' + runLink + ' - attempt ' + RUN_ATTEMPT + '_\n\n';
            const cancelledSeg = cancelled > 0 ? cancelled + ' cancelled - ' : '';
            md += '**' + failed + ' failed - ' + passed + ' passed - ' + skipped + ' skipped - ' + cancelledSeg + elapsed + ' elapsed**\n\n';

            if (failed > 0) {
              md += '### Failing\n\n| Job | Log |\n| --- | --- |\n';
              for (const row of failingRows) {
                md += '| ' + row.key + ' | ' + (row.url ? '[logs](' + row.url + ')' : '-') + ' |\n';
              }
              md += '\n';
            }

            md += '### Coverage\n\n';
            if (coverageRows.length) {
              md += '| Module | Measured | Gate | Margin |\n| --- | --- | --- | --- |\n';
              for (const r of coverageRows) {
                md += '| ' + r.module + ' | ' + r.measured + ' | ' + r.gate + ' | ' + r.margin + ' |\n';
              }
            } else {
              md += '_no coverage/* commit statuses found on ' + SHORT + '_\n';
            }
            md += '\n';

            if (EVENT === 'pull_request') {
              md += '### Changed\n\n';
              if (changedRows.length) {
                md += '| Area | Files | +/- |\n| --- | --- | --- |\n';
                for (const r of changedRows) {
                  md += '| ' + r.area + ' | ' + r.files + ' | +' + r.plus + '/-' + r.minus + ' |\n';
                }
              } else {
                md += '_no changed-file data available_\n';
              }
              md += '\n';
            }

            md += '### Slowest jobs\n\n';
            if (durations.length) {
              md += '| Job | Duration |\n| --- | --- |\n';
              for (const d of durations) {
                md += '| ' + d.name + ' | ' + fmtDuration(d.ms) + ' |\n';
              }
            } else {
              md += '_no job duration data available_\n';
            }
            md += '\n';

            md += '### e2e buckets run\n\n';
            md += buckets.length ? buckets.map((b) => '`' + b + '`').join(', ') + '\n' : '_none ran_\n';

            fs.writeFileSync('/tmp/report.md', md);
          }

          try {
            render();
          } catch (err) {
            fs.writeFileSync(
              '/tmp/report.md',
              '<!-- ci-report -->\n## CI Report\n\nReport generation failed: ' + String(err) + '\n'
            );
          }
          JSEOF
          node /tmp/render.cjs
          exit 0

      - name: write job summary
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ -s /tmp/report.md ]; then
            cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## CI Report'
              echo
              echo 'Report generation failed; see the "render report" step logs for this job.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: post sticky PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          if [ ! -s /tmp/report.md ]; then
            echo "no report body to post, skipping PR comment"
            exit 0
          fi
          EXISTING_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate \
            -q '.[] | select((.body // "") | startswith("<!-- ci-report -->")) | .id' 2>/tmp/find.err | tail -n1)
          if [ -n "$EXISTING_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING_ID" -F body=@/tmp/report.md >/tmp/patch.out 2>/tmp/patch.err
            RC=$?
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@/tmp/report.md >/tmp/post.out 2>/tmp/post.err
            RC=$?
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::notice::could not publish the sticky PR comment (likely a fork PR with a read-only token); the job summary above still has the full report"
          fi
          exit 0
